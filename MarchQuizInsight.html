er\n             magnets'.\n        2. The presence of Iron (Fe) in these magnets provides high magnetization but also makes them\n             susceptible to corrosion.\n        3. These magnets maintain their magnetic force indefinitely without requiring an external power source.\n        4. Their magnetic performance is generally unaffected by extreme temperature variations.\nWhich of the above statements are correct?", "options": {"a": "1 and 2 only", "b": "1, 3, and 4 only", "c": "1, 2, 3 and 4", "d": "1, 2 and 3 only"}, "correct": "d", "explanation": "•   Nd-Fe-B (Neodymium-Iron-Boron) magnets are a critical component in modern technology.\n•   Statements 1 and 3 are correct; they are known as permanent magnets because they maintain high magnetic\nforce indefinitely without external power, and they are the strongest commercially available magnets, often\ncalled \"super magnets\" due to their high energy product. This allows very small magnets to produce intense\nmagnetic fields, making them vital for smartphones and headphones.\n• Statement 2 is correct because Iron (Fe) is the primary metallic component providing high magnetization, but\nit also makes the material prone to oxidization/rusting. Consequently, these magnets require protective\ncoatings like nickel or epoxy.\n• Statement 4 is incorrect because Nd-Fe-B magnets are actually temperature sensitive. Their magnetic\nperformance can significantly decrease at high temperatures. To improve their stability in high-heat\nenvironments—such as in electric vehicle motors or wind turbine generators—heavy rare earth elements like\nDysprosium must be added.\nIndia’s pilot plant at ARCI, Hyderabad, aims to create a \"mineral-to-market\" ecosystem. By mastering the\ncomplex manufacturing process—which involves strip-casting, pulverizing, and vacuum sintering—India seeks to\nmitigate vulnerabilities in the global supply chain, where rare earth resources are highly concentrated in a few\nnations."}, {"id": 88, "section": "Science and Technology", "question": "Consider the following statements regarding the Floating LiDAR Buoy System:\n      1. It utilizes infrared laser pulses to measure vertical wind profiles up to 300 metres above sea level.\n      2. The system operates on the principle of the Doppler Shift in reflected light frequency.\n      3. It is designed to replace traditional anemometers due to its ability to function without a stable\n           surface.\n      4. The technology was developed indigenously by the National Institute of Ocean Technology (NIOT).\nHow many of the above statements are correct?", "options": {"a": "Only one", "b": "Only two", "c": "Only three", "d": "All four"}, "correct": "c", "explanation": "•   The Floating LiDAR (Light Detection and Ranging) Buoy is a sophisticated oceanic platform designed to provide\nhigh-resolution vertical wind profiles and meteorological data from the sea surface.\n•   Statements 1, 2, and 4 are correct. The system uses Optical Remote Sensing where LiDAR units emit laser\npulses that reflect off aerosols (backscattering). By measuring the Doppler Shift, it calculates wind speed at\nvarious altitudes. It was developed by NIOT under the Ministry of Earth Sciences.\n•   Statement 3 is incorrect; while it is superior to traditional anemometers because it provides vertical profiling\n(multiple heights) rather than just surface-level data, it does not function \"without a stable surface\"—it is\nspecifically designed as a buoy platform that remains stable on the ocean surface to provide accurate\nreadings.\n•   This indigenous development is a major step toward technological self-reliance in India's Blue Economy. By\naccurately mapping offshore wind energy potential, it helps identify the best locations for wind farms,\nsupporting India’s renewable energy targets. Beyond energy, the system plays a critical role in disaster\nmanagement by providing real-time data for tracking cyclones and understanding ocean-atmosphere\ninteractions.\n•   Traditional methods are often limited by height and location; however, the Floating LiDAR can be deployed in\ndeep-sea environments. This reduces India’s dependence on expensive imported marine survey technologies\nand enhances the precision of climate modeling and meteorological predictions for the Indian coastline."}, {"id": 89, "section": "Science and Technology", "question": "With reference to the 'Sujal Gaon ID', consider the following statements:\n       Statement I: It is a unique digital identifier assigned to every rural piped drinking water supply scheme in\nIndia.\n       Statement II: It has been launched under the Jal Jeevan Mission 2.0 to ensure digital mapping and real-\ntime monitoring of water assets.\n       Statement III: The ID is independent of the 'Sujalam Bharat' platform to prevent data overlapping.\nWhich one of the following is correct in respect of the above statements?", "options": {"a": "Both Statement II and Statement III are correct and both of them explain Statement I", "b": "Both Statement II and Statement III are correct but only one of them explains Statement I", "c": "Only one of the Statements II and III is correct and that explains Statement I", "d": "Neither Statement II nor Statement III is correct"}, "correct": "c", "explanation": "•   Statement I is correct as it defines the core purpose of the Sujal Gaon ID.\n•   Statement II is correct and explains the policy framework (JJM 2.0) that necessitates such an ID for better\ngovernance and transparency.\n•   Statement III, however, is incorrect. The Sujal Gaon ID is actually linked and integrated with the Sujalam\nBharat platform. This integration is designed to combine the \"infrastructure ID\" (the scheme) with the\n\"service-area ID\" (the beneficiaries) to create a comprehensive digital map of the entire water supply chain."}, {"id": 90, "section": "Science and Technology", "question": "Consider the following statements regarding the NavIC (IRNSS) system:\n       1. It consists of satellites placed in Geosynchronous and Geostationary orbits at an altitude of\n            approximately 36,000 km.\n       2. NavIC provides better accuracy in dense mountainous terrains compared to GPS because its satellites\n            are always visible over the Indian region.\n       3. The system is designed to provide coverage for the entire globe, similar to the American GPS and\n            Russian GLONASS.\nWhich of the above statements are correct?", "options": {"a": "1, 2 and 3", "b": "1 and 3 only", "c": "2 and 3 only", "d": "1 and 2 only"}, "correct": "d", "explanation": "•   Statement 1 is correct; unlike the Medium Earth Orbit (MEO) used by GPS, NavIC utilizes High Earth Orbits\n(GEO/GSO) to ensure the satellites remain stationary or semi-stationary relative to India.\n•   Statement 2 is correct because these high-inclination orbits ensure that the satellites are positioned at a\nhigher elevation angle for users in India, which helps signals bypass obstacles like tall trees or deep valleys\nthat might block GPS signals.\n•   Statement 3 is incorrect. NavIC is a regional system, not a global one. Its primary service area covers India\nand a region extending 1,500 km beyond its borders. While it provides strategic independence for the\nsubcontinent, it does not aim for global coverage like the four major GNSS systems (GPS, GLONASS, Galileo,\nand BeiDou)."}, {"id": 91, "section": "Science and Technology", "question": "With reference to Atomic Clocks in satellite navigation, consider the following statements:\n       1. These clocks measure time based on the vibrations of atoms, typically using Rubidium or Cesium.\n\n\n\n                                                                              2. In navigation, even a tiny error in time measurement can lead to a significant error in determining\n            ground location.\nWhich of the above statements are correct?", "options": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "correct": "c", "explanation": "•   Statement 1 is correct. Atomic clocks operate by measuring the precise frequency of electromagnetic\nradiation emitted or absorbed during transitions between energy levels of atoms, most commonly Cesium-\n133 or Rubidium. These atoms provide extremely stable and accurate time standards, making them ideal for\nsatellite navigation systems like GPS, GLONASS, and NavIC.\n•   Statement 2 is also correct. Satellite navigation systems rely on precise timing signals to calculate distances\nusing the speed of light. Even a nanosecond-level error in time measurement can translate into meter-level\nerrors in positional accuracy on Earth. Since positioning is based on trilateration from multiple satellites, any\ntiming error directly propagates into spatial inaccuracies."}, {"id": 92, "section": "Science and Technology", "question": "With reference to the Dumpsite Remediation Accelerator Programme (DRAP), consider the following\n    statements:\n        1. It is a multi-year initiative aimed at the complete elimination of legacy waste across all Tier-1 and\n             Tier-2 cities by 2030.\n        2. The programme operates under the aegis of the Ministry of Housing and Urban Affairs as part of\n             Swachh Bharat Mission-Urban 2.0.\n        3. It prioritizes a specific set of high-impact dumpsites that account for the vast majority of India's legacy\n             waste.\nHow many of the above statements are correct?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "b", "explanation": "•   The Dumpsite Remediation Accelerator Programme (DRAP) was launched in November 2025 to fast-track the\nclearance of legacy waste in urban India.\n•   Statement 1 is incorrect because DRAP is designed as a year-long targeted programme rather than a long-\nterm decadal plan. Its specific goal is to achieve 100% dumpsite clearance within one year of adoption at\nselected sites, supporting the broader SBM-U 2.0 goal of \"Lakshya Zero Dumpsites\" by September 2026.\n•   Statement 2 is correct; it is implemented by the Ministry of Housing and Urban Affairs (MoHUA) to reclaim\nland for productive urban use. Statement 3 is correct as the programme strategically focuses on 214 major\ndumpsites across 202 urban local bodies, which together contain approximately 80% of the country’s legacy\nwaste. This prioritization ensures that maximum environmental and public health gains are achieved in the\nshortest time.\n•   The programme utilizes a Central Financial Assistance (CFA) model of ₹550 per tonne. By focusing on these\nhigh-impact areas, the government intends to transform \"garbage mountains\" into green spaces or waste-\nprocessing infrastructure, thereby preventing the further degradation of soil and groundwater."}, {"id": 93, "section": "Science and Technology", "question": "In the context of advanced nuclear fuels, what distinguishes High Assay Low Enriched Uranium (HALEU) from\n    typical Low Enriched Uranium (LEU)?", "options": {"a": "LEU is used exclusively in weapons-grade applications, while HALEU is used for civilian power.", "b": "HALEU is composed entirely of Thorium-232, while LEU is a mix of Uranium and Plutonium.", "c": "is correct and defines the technical difference. Natural uranium contains only about 0.7% of the\n    fissile isotope U-235. For most commercial power reactors today, this is enriched to less than 5%, which is\n    known as Low Enriched Uranium (LEU).\n•   HALEU (High Assay Low Enriched Uranium) is a \"sweet spot\" in enrichment. It is enriched to between 5% and\n    20%. This higher concentration allows for smaller reactor designs, longer core lives, and higher efficiency\n    (burn-up). Any enrichment above 20% is considered Highly Enriched Uranium (HEU), which is strictly\n    regulated because it can potentially be used to develop nuclear weapons.\n•   HALEU is the primary driver in the HALEU-Thorium (or ANEEL) fuel being considered for India’s PHWRs. In this\n    mix, the HALEU provides the initial \"spark\" or neutrons needed to sustain a chain reaction, which eventually\n    converts the non-fissile Thorium-232 into fissile U-233. This process allows for better thorium utilization—a\n    key goal for India, which holds some of the world's largest thorium deposits. However, the commercial\n    availability of HALEU is currently limited and expensive.", "d": "HALEU requires a liquid sodium coolant, whereas LEU can only function with heavy water."}, "correct": "c", "explanation": "•   The classification of uranium enrichment is vital for understanding nuclear power and non-proliferation.\n•   Statement (c) is correct and defines the technical difference. Natural uranium contains only about 0.7% of the\nfissile isotope U-235. For most commercial power reactors today, this is enriched to less than 5%, which is\nknown as Low Enriched Uranium (LEU).\n•   HALEU (High Assay Low Enriched Uranium) is a \"sweet spot\" in enrichment. It is enriched to between 5% and\n20%. This higher concentration allows for smaller reactor designs, longer core lives, and higher efficiency\n(burn-up). Any enrichment above 20% is considered Highly Enriched Uranium (HEU), which is strictly\nregulated because it can potentially be used to develop nuclear weapons.\n•   HALEU is the primary driver in the HALEU-Thorium (or ANEEL) fuel being considered for India’s PHWRs. In this\nmix, the HALEU provides the initial \"spark\" or neutrons needed to sustain a chain reaction, which eventually\nconverts the non-fissile Thorium-232 into fissile U-233. This process allows for better thorium utilization—a\nkey goal for India, which holds some of the world's largest thorium deposits. However, the commercial\navailability of HALEU is currently limited and expensive."}, {"id": 94, "section": "Science and Technology", "question": "Regarding the \"Kavach 4.0\" system recently in the news, which of the following best describes its primary\n    function?", "options": {"a": "An AI-based satellite system for tracking the real-time location of all commercial aircraft in Indian\nairspace.", "b": "A cyber-security firewall developed by DRDO to protect India's critical power grid infrastructure from\nforeign malware.", "c": "An indigenous automatic train protection system designed to prevent collisions by managing speed\nand braking.", "d": "A deep-sea hull technology for the Indian Navy’s next-generation nuclear-powered submarines."}, "correct": "c", "explanation": "•   Kavach 4.0 is India’s indigenous Automatic Train Protection (ATP) system. Developed by the Research Design\nand Standards Organisation (RDSO) in collaboration with Indian industry, it is a state-of-the-art electronic\nsafety system. Its primary goal is to achieve \"Zero Accidents\" on the Indian Railways network.\n•   The system functions by automatically applying brakes if the loco pilot fails to respond to a red signal (Signal\nPassing at Danger - SPAD) or exceeds the permitted speed limit. It is particularly effective during adverse\nweather conditions like dense fog, where human visibility is compromised. Kavach uses a combination of\nRFID tags on tracks, on-board equipment in locomotives, and radio towers at stations to monitor train\nmovements in real-time.\n•   The recent version 4.0 offers enhanced precision in complex railway yards and seamless integration with\nelectronic interlocking systems. By eliminating human error in critical safety maneuvers, Kavach significantly\nenhances the operational safety of the high-density corridors like Delhi-Mumbai and Delhi-Howrah."}, {"id": 95, "section": "Science and Technology", "question": "Which of the following statements about \"Narrowband\" and \"Broadband\" interference is correct?\n         1. Narrowband interference affects a wide range of the radio spectrum and is usually caused by\n              lightning.\n         2. Broadband interference is typically man-made and originates from specific radio transmitters.\n         3. Continuous interference, like background radiation from power lines, is a form of narrowband\n              interference.\nSelect the correct answer using the code given below:", "options": {"a": "1 and 2 only", "b": "3 only", "c": "1, 2 and 3", "d": "None of the above"}, "correct": "d", "explanation": "•   Narrowband interference (Statement 1) actually affects only a specific, small frequency range and is usually\nman-made, such as noise from a specific radio or mobile phone.\n•   Broadband interference (Statement 2) affects a wide range of the radio spectrum and is often caused by\nmalfunctioning equipment or natural phenomena like lightning.\n•   Statement 3 is incorrect because continuous interference refers to the duration of the emission (constant),\nwhereas \"narrowband\" refers to the frequency range. Continuous interference can be either narrowband or\nbroadband. For example, the hum from a power line is a continuous, broadband-type interference."}, {"id": 96, "section": "Science and Technology", "question": "Consider the following statements regarding GPS Jamming:\n       1. It involves broadcasting noise on the L1 and L2 bands to overpower weak satellite signals.\n       2. Unlike spoofing, jamming requires a sophisticated understanding of the satellite's signal structure.\n       3. It can be mitigated by switching to manual navigation or using inertial navigation systems.\nHow many of the above statements are correct?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "b", "explanation": "•   Statement 1 is correct. Jamming is a brute-force method that simply broadcasts radio frequency noise on the\nsame frequencies used by GPS satellites (L1 and L2), drowning out the faint signals that have traveled\nthousands of kilometers.\n•   Statement 2 is incorrect. Jamming is actually less sophisticated than spoofing. Jamming just requires \"noise\"\ngeneration, whereas spoofing requires generating a signal that precisely mimics the structure and timing of a\nreal satellite signal to trick the receiver.\n•   Statement 3 is correct. Since jamming results in a total loss of signal, operators must rely on non-GNSS\nmethods like Inertial Navigation Systems (INS), which use gyroscopes and accelerometers, or traditional\nmanual navigation."}, {"id": 97, "section": "Science and Technology", "question": "Consider the following pairs regarding Electromagnetic Interference (EMI):\n Mechanism of Coupling Description\n1. Radiated              A. Interference travels through physical wires like power cables.\n2. Conducted             B. Interference travels through air as radio waves.\n3. Inductive             C. Occurs when a magnetic field leaks into a nearby wire.\nWhich of the above are correctly matched?", "options": {"a": "1 and 2 only", "b": "2 and 3 only", "c": "1 and 3 only", "d": "1, 2 and 3"}, "correct": "d", "explanation": "•   Radiated interference (1-B) is common in wireless communications where electromagnetic energy\npropagates through space; examples include interference from Wi-Fi routers or mobile phones.\n•   Conducted interference (2-A) occurs when the noise is transmitted through a physical path such as a power\nline or signal cable, often causing the \"mains hum\" in audio equipment.\n•   Inductive coupling (3-C) is a form of magnetic interference where a changing current in one conductor\ninduces a voltage in a parallel conductor without physical contact.\n•   Understanding these mechanisms is crucial for Electromagnetic Compatibility (EMC), ensuring that different\nelectronic devices can operate in close proximity without disrupting each other."}, {"id": 98, "section": "Science and Technology", "question": "Consider the following statements regarding Desalination Plants:\n       1. Reverse Osmosis (RO) technology utilizes high pressure to push seawater through semi-permeable\n            membranes.\n       2. Desalination plants are predominantly located in regions with high annual precipitation to\n            supplement groundwater.\n       3. Brine discharge, a byproduct of desalination, is typically treated and converted into solid salt before\n            being released into the ocean.\nHow many of the above statements are correct?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "a", "explanation": "•   Desalination is a critical technology for water-scarce regions.\n•   Statement 1 is correct as Reverse Osmosis (RO) is the most common technology, using semi-permeable\nmembranes to separate dissolved salts from water under high pressure.\n•   Statement 2 is incorrect because these plants are primarily concentrated in arid and water-scarce coastal\nregions, such as West Asia and North Africa, not regions with high precipitation. Their primary aim is to\nprovide water security where natural freshwater is absent.\n•   Statement 3 is incorrect because, while brine is a byproduct, it is typically released directly back into the\nocean as concentrated saltwater, rather than being converted into solid salt. This process is energy-intensive\nand often co-located with power plants to share energy resources. West Asia accounts for nearly 70% of\nglobal capacity, highlighting the strategic importance of these facilities in desert climates."}, {"id": 99, "section": "Science and Technology", "question": "With reference to Very Low Earth Orbit (VLEO), consider the following statements:\n       1. VLEO satellites require constant thrust to counter aerodynamic drag.\n       2. They offer better optical resolution compared to satellites in higher orbits.\n       3. They have a longer orbital life than LEO satellites because they are closer to Earth's gravity.\nWhich of the statements given above are correct?", "options": {"a": "1, 2 and 3", "b": "2 and 3 only", "c": "1 and 3 only", "d": "1 and 2 only"}, "correct": "d", "explanation": "•   VLEO (Very Low Earth Orbit) is a challenging but rewarding operational environment.\n•   Statement 1 is correct; because VLEO exists within the outer fringes of the atmosphere (up to 450 km), the\naerodynamic drag is high enough to slow a satellite down, causing it to lose altitude. To stay in orbit, these\nsatellites must use propulsion systems (like the ones being developed by Bellatrix Aerospace) to provide a\nconstant forward thrust that balances the drag.\n•   Statement 2 is correct. Simple physics dictates that being closer to the target (Earth) allows for higher\nresolution images. Satellites in VLEO can achieve the same or better resolution with smaller, lighter, and\ncheaper cameras than those in LEO or Medium Earth Orbit.\n•   Statement 3 is incorrect. VLEO satellites actually have a shorter natural orbital life compared to LEO satellites\nif their propulsion fails. While a LEO satellite at 800 km might stay in orbit for decades after it dies, a VLEO\nsatellite will be dragged down by the atmosphere and burn up within weeks or months. This \"short life\" is\nactually a benefit for space debris management, but technically, the orbital duration is shorter, not longer."}, {"id": 100, "section": "Science and Technology", "question": "Consider the following statements regarding Leprosy:\n       1. It is a chronic infectious disease caused by the bacterium Mycobacterium leprae.\n\n\n\n                                                                             2. The disease is highly infectious and can be transmitted through casual skin-to-skin contact.\n      3. Chile was recently verified by the WHO as the first country in the world to eliminate leprosy.\nHow many of the above statements are correct?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "b", "explanation": "•   Statement 1 is correct. Leprosy, also known as Hansen’s Disease, is caused by the slow-growing bacterium\nMycobacterium leprae.\n•   Statement 2 is incorrect. Contrary to historical myths, leprosy is not highly infectious. It is transmitted via\ndroplets from the nose and mouth during close and frequent contact with untreated cases, rather than\ncasual skin contact.\n•   Statement 3 is incorrect. While Chile was recently verified by the WHO as having eliminated leprosy, it is the\nfirst country in the Americas and the second globally to achieve this status (the first was likely a different\nnation, as Chile is explicitly cited as the second).\n•   The disease has a very long incubation period, averaging 5 years but sometimes taking 20 years for symptoms\nto appear. Since the 1980s, the WHO has provided Multi-Drug Therapy (MDT)—a combination of rifampicin,\ndapsone, and clofazimine—for free. If treated early, the disease is 100% curable, preventing permanent\ndamage to the nerves, skin, and eyes. Historically, the disease was localized in Chile on Rapa Nui (Easter\nIsland) before being eradicated through strict public health measures."}, {"id": 101, "section": "Science and Technology", "question": "With reference to Very Low Earth Orbit (VLEO) satellite systems, consider the following statements:\n       1. VLEO satellites operate at altitudes where atmospheric drag is negligible compared to traditional Low\n            Earth Orbit (LEO).\n       2. The proximity of VLEO satellites to the Earth's surface inherently results in higher signal latency\n            compared to Geostationary satellites.\n       3. These systems can achieve sub-meter imaging resolution using smaller optical sensors than those\n            required at higher altitudes.\nHow many of the above statements are correct?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "a", "explanation": "•   Very Low Earth Orbit (VLEO) refers to altitudes between 150 km and 450 km. At these heights, satellites\nencounter a thin but significant atmosphere, which creates aerodynamic drag. Unlike traditional LEO (500 km\n– 2,000 km) where drag is minimal, VLEO satellites require constant thrust from advanced propulsion systems\n(like electric or green propulsion) to maintain their orbit and prevent de-orbiting. Therefore, statement 1 is\nincorrect.\n•   Regarding communication, VLEO satellites offer ultra-low latency. Since the distance a signal travels is\nsignificantly shorter than in LEO or Geostationary orbits (35,786 km), the time delay is minimized, making\nthem ideal for real-time strategic communication. Statement 2 is incorrect as it suggests higher latency.\n•   The primary advantage of VLEO is superior imaging capabilities. Being much closer to the surface allows\nthese platforms to capture high-resolution, sub-meter images using smaller and less expensive optical\nsensors. Additionally, VLEO orbits are considered \"self-cleaning\" because failed satellites are naturally pulled\ndown by atmospheric drag to burn up, reducing long-term space debris."}, {"id": 102, "section": "Science and Technology", "question": "Consider the following initiatives under the New Delhi Declaration 2026 with their nature and objectives:\n\n\n\n\n                                                                               Column 1 (Initiative)           Column 2 (Objective)                      Column 3 (Nature)\nA. Global AI Impact Commons 1. Share/replicate successful AI solutions X. Voluntary Collaborative Platform\n                                2. Repository of benchmarks/best          Y. Non-binding Collaborative\nB. Trusted AI Commons\n                                practices                                 Repository\nC. Democratic Diffusion\n                                3. Access to foundational AI resources    Z. Sovereign-based Policy Framework\nCharter\nHow many of the above are correctly matched?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None", "A": "is a voluntary platform (X) whose main goal is the\n    replication of proven AI use-cases (1) to maximize social impact across different regions.\n•   B is correctly matched. The Trusted AI Commons", "B": "acts as a repository (Y) for benchmarks and technical\n    resources (2). It focuses on the \"how-to\" of building secure AI systems that can be adapted to specific\n    national contexts.\n•   C is correctly matched. The Democratic Diffusion of AI Charter", "C": "is a policy framework (Z) that emphasizes\n    affordable access to foundational resources (3) like compute and data. It addresses the \"AI Divide\" by\n    ensuring that the underlying infrastructure of the AI revolution is not monopolized.\n•   The declaration balances these global collaborations with a sovereignty-based approach, meaning that while\n    countries share tools and resources, they maintain the right to regulate AI according to their own national\n    laws. This multi-layered governance model is designed to be inclusive and equitable, reflecting India's\n    leadership in AI diplomacy under the \"AI for All\" banner."}, "correct": "c", "explanation": "•   A is correctly matched. The Global AI Impact Commons (A) is a voluntary platform (X) whose main goal is the\nreplication of proven AI use-cases (1) to maximize social impact across different regions.\n•   B is correctly matched. The Trusted AI Commons (B) acts as a repository (Y) for benchmarks and technical\nresources (2). It focuses on the \"how-to\" of building secure AI systems that can be adapted to specific\nnational contexts.\n•   C is correctly matched. The Democratic Diffusion of AI Charter (C) is a policy framework (Z) that emphasizes\naffordable access to foundational resources (3) like compute and data. It addresses the \"AI Divide\" by\nensuring that the underlying infrastructure of the AI revolution is not monopolized.\n•   The declaration balances these global collaborations with a sovereignty-based approach, meaning that while\ncountries share tools and resources, they maintain the right to regulate AI according to their own national\nlaws. This multi-layered governance model is designed to be inclusive and equitable, reflecting India's\nleadership in AI diplomacy under the \"AI for All\" banner."}, {"id": 103, "section": "Science and Technology", "question": "Consider the following statements regarding the collaborative platforms launched under the New Delhi\n    Declaration on AI Impact 2026:\n       1. The 'Trusted AI Commons' serves as a voluntary repository for benchmarks and best practices to build\n            secure AI systems.\n       2. The 'International Network of AI for Science Institutions' aims to pool research infrastructure to\n            accelerate scientific discovery.\n       3. The 'Global AI Impact Commons' is primarily a commercial marketplace for the private sale of AI\n            algorithms.\nWhich of the above statements are correct?", "options": {"a": "1, 2 and 3", "b": "1 and 3 only", "c": "2 and 3 only", "d": "1 and 2 only"}, "correct": "d", "explanation": "The New Delhi Declaration on AI Impact (2026), adopted during the India AI Impact Summit 2026, introduced\nseveral collaborative global platforms and mechanisms to promote international cooperation in artificial\nintelligence governance and development.\n• Statement 1 is correct as the Trusted AI Commons is focused on safety, security, and the sharing of non-\nbinding technical standards to help nations deploy AI responsibly.\n• Statement 2 is correct as the International Network of AI for Science Institutions connects global scientific\nbodies to share the immense computing power needed for complex simulations in fields like genomics or\nclimate modeling.\n•   Statement 3 is incorrect because the Global AI Impact Commons is a voluntary global platform for sharing\nand replicating successful AI solutions for social good, not a commercial marketplace. It is designed to\nmaximize development impact through scaling proven use-cases."}, {"id": 104, "section": "Science and Technology", "question": "With reference to \"Oleum\", which of the following statements is correct?", "options": {"a": "is incorrect because sulfur dioxide is not dissolved in water to produce oleum; it involves sulfur\n    trioxide and sulfuric acid.\n•   Statement", "b": "is incorrect because oleum is extremely corrosive and highly reactive, often more dangerous\n    than diluted sulfuric acid due to its strong dehydrating and oxidizing properties.\n•   Statement", "c": "It consists of sulfur trioxide dissolved in concentrated sulfuric acid.", "d": "is incorrect since oleum has no role as a coolant in nuclear reactors. Nuclear reactors typically\n    use water, heavy water, liquid sodium, or gases as coolants."}, "correct": "c", "explanation": "•   Oleum, also called fuming sulfuric acid, is a chemical compound formed by dissolving sulfur trioxide (SO₃) in\nconcentrated sulfuric acid (H₂SO₄). Its general composition can be represented as H₂SO₄·xSO₃. Oleum is\nwidely used in the industrial production of sulfuric acid, particularly in the Contact Process, where sulfur\ntrioxide cannot be directly absorbed in water because it forms a fine acid mist that is difficult to condense.\nInstead, sulfur trioxide is absorbed in concentrated sulfuric acid to produce oleum, which can later be diluted\nwith water to obtain sulfuric acid safely.\n•   Statement (a) is incorrect because sulfur dioxide is not dissolved in water to produce oleum; it involves sulfur\ntrioxide and sulfuric acid.\n•   Statement (b) is incorrect because oleum is extremely corrosive and highly reactive, often more dangerous\nthan diluted sulfuric acid due to its strong dehydrating and oxidizing properties.\n•   Statement (d) is incorrect since oleum has no role as a coolant in nuclear reactors. Nuclear reactors typically\nuse water, heavy water, liquid sodium, or gases as coolants."}, {"id": 105, "section": "Science and Technology", "question": "What is the role of Blockchain-as-a-Service (BaaS) in blockchain technology?", "options": {"a": "It provides infrastructure and tools to build blockchain applications without requiring users to manage\n      the blockchain themselves", "b": "It replaces traditional blockchains with centralized cloud databases", "c": "It centralizes the blockchain ecosystem by hosting all decentralized apps", "d": "It allows developers to mine cryptocurrencies more efficiently"}, "correct": "a", "explanation": "Blockchain-as-a-Service (BaaS) offers cloud-based infrastructure and tools that enable businesses and\ndevelopers to build, deploy, and manage blockchain applications without the need for creating or maintaining\nthe blockchain infrastructure themselves. Microsoft Azure's BaaS is an example, allowing businesses to quickly\nset up blockchain applications."}, {"id": 106, "section": "Science and Technology", "question": "Which of the following best explains the primary mandate of North East Centre for Technology Application\n    and Reach (NECTAR)?", "options": {"a": "To implement direct cash transfers for technology-based enterprises in Northeast India.", "b": "To promote research and development in space technology for ISRO’s Northeast initiatives.", "c": "To bridge the gap between research institutions and grassroots innovations through technology-driven\n       solutions.", "d": "To establish large-scale industrial zones in Northeast India with foreign investments."}, "correct": "c", "explanation": "•   Option a is incorrect – NECTAR does not implement direct cash transfers but supports research-based\ntechnological interventions.\n•   Option b is incorrect – NECTAR is not directly involved in space technology research for ISRO.\n•   Option c is correct – NECTAR's core mission is to bridge the gap between research institutions and\ngrassroots innovations, ensuring technology adoption in agriculture, drone mapping, and infrastructure\ndevelopment.\n•   Option d is incorrect – NECTAR does not focus on industrial zones, but rather on technological applications in\nagriculture, infrastructure, and skill development.\n•   What is NECTAR?\no An autonomous body under the Department of Science and Technology (DST), Government of\nIndia.\no Focuses on technological applications for the development of Northeast India.\n•   Established In: 2014, under the Ministry of Science & Technology.\n•   Headquarters: Shillong, Meghalaya.\n•   Aim:\no Promote technological advancements for socio-economic development in Northeast India.\no Bridge the gap between research institutions and grassroots innovations.\no Encourage sustainable agricultural practices like saffron and bamboo cultivation.\n•   Functions & Features:\no Technology Application in Agriculture: Expanding saffron cultivation in Northeast India, similar to\nLavender farming in J&K.\no Drone Technology for Land Mapping: Supports the ‘Swamitva’ program for efficient land records\nmanagement.\no Bamboo & Honey Production: Boosts eco-friendly industries to generate sustainable livelihoods.\no Infrastructure & Connectivity Enhancement: Works on scientific and technological interventions to\nimprove rural accessibility.\no Skill Development & Research: Establishing a Centre of Excellence in Shillong for advanced tech\ntraining and innovation."}, {"id": 107, "section": "Science and Technology", "question": "Which of the following best explains why Starlink’s satellite broadband is considered superior to traditional\n    internet services?", "options": {"a": "It operates using fiber-optic communication in space, ensuring higher speeds than terrestrial\n        broadband.", "b": "It eliminates the need for ground stations, making it completely independent of terrestrial\n        infrastructure.", "c": "Starlink uses a low-Earth orbit (LEO) satellite constellation, reducing latency compared to traditional\n        satellite internet.", "d": "Starlink’s satellites orbit in geostationary orbit (GEO), allowing seamless global coverage."}, "correct": "c", "explanation": "•   Option a is incorrect – Starlink does not use fiber-optic communication in space but relies on radio frequency\n(RF) signals and phased-array antennas for data transmission.\n•   Option b is incorrect – Starlink still requires ground stations to relay data to the broader internet. While it\nreduces dependency on terrestrial infrastructure, it is not fully independent.\n•   Option c is correct – Starlink’s LEO satellites (550 km altitude) provide lower latency (25-50 ms) compared\nto GEO satellites (~600 ms), making it suitable for real-time applications.\n•   Option d is incorrect – Starlink operates in low-Earth orbit (LEO), not geostationary orbit (GEO). GEO satellites\nremain fixed relative to Earth but suffer from high latency (~600 ms).\n• What is Starlink\no A satellite-based internet service operated by SpaceX, founded by Elon Musk.\no Designed to provide high-speed, low-latency broadband globally, especially in remote areas.\n• Developed by: SpaceX\no Launched in 2019, aims to deploy 42,000 satellites in low-Earth orbit (LEO).\n• How Does Starlink Work?\no Uses a constellation of LEO satellites to provide internet access.\no A Starlink dish connects to the nearest satellite, which transmits data to and from ground\nstations connected to the internet.\no Unlike fiber or cellular networks, Starlink does not depend on terrestrial infrastructure.\n•   Key Features:\no Low Latency (25-50 ms): Suitable for gaming, video calls, and HD streaming.\no Speeds up to 220 Mbps: Varies by region, with average speeds of 50-100 Mbps.\no Global Coverage: Effective in areas with poor broadband infrastructure.\no Portability: Works for homes, businesses, vehicles, ships, and aircraft.\no Easy Installation: Self-installable dish and router for quick setup."}, {"id": 108, "section": "Science and Technology", "question": "Consider the following applications of gene-editing technology:\n       1. Developing genetically engineered mosquitoes to prevent the spread of malaria.\n       2. Creating synthetic human embryos for organ transplantation.\n       3. Enhancing crop resistance to pests and environmental stress.\nWhich of the above are currently feasible using gene-editing techniques?", "options": {"a": "2 and 3", "b": "1 and 2", "c": "1 and 3", "d": "1, 2 and 3"}, "correct": "c", "explanation": "Gene-edited mosquitoes have been developed using CRISPR to suppress malaria transmission.\nGene-editing is widely used in agriculture for developing pest-resistant and drought-tolerant crops.\nStatement 2 is incorrect – Creating synthetic human embryos solely for organ transplantation is not yet feasible\nand raises ethical concerns.\nWhat is Gene Editing?\n• Gene editing involves modifying an organism’s DNA to enhance traits, eliminate defects, or develop\nresistance to diseases.\n• Unlike traditional breeding, it allows precise and controlled alterations at the molecular level.\nMethods Used\n1. CRISPR-Cas9 – Most common technique, cuts DNA at specific sites for modification.\n2. Zinc Finger Nucleases (ZFNs) – Custom DNA-binding proteins used to alter genes.\n3. TALENs (Transcription Activator-Like Effector Nucleases) – Precise cutting and editing of genetic\nsequences.\nRegulatory Provisions in India\n• Genetic Engineering Appraisal Committee (GEAC) under MoEFCC oversees gene-editing approvals.\n• The Food Safety and Standards Authority of India (FSSAI) regulates genetically modified foods.\n• India approved GM Mustard for commercial cultivation but has stricter regulations for gene-edited crops.\nCurrent Status in India\n• India has not approved CRISPR-based crops for commercial use yet, but research is underway.\n• Gene-edited rice, wheat, and bananas are in developmental stages.\n• The Indian Council of Agricultural Research (ICAR) is exploring gene-editing to improve climate resilience\nand pest resistance in crops."}, {"id": 109, "section": "International Relations and Organisations", "question": "Consider the following statements on customary international law in transboundary water treaties:\n      1. The no-harm rule is automatically enforceable in all treaties.\n      2. Equitable and reasonable utilization (ERU) is a principle applied in international watercourse\n      management.\n      3. Customary law obliges states to conduct Environmental Impact Assessments (EIAs) for projects with\n      potential cross-border impacts.\nHow many of the above statements are correct?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "b", "explanation": "Statement 1 is incorrect because, while the no-harm rule is a foundational principle in international\nenvironmental law, it is not automatically enforceable in all treaties. Its application depends on the specific\nterms agreed upon by the treaty parties. States may include the no-harm obligation explicitly in a treaty, making it\nbinding for those parties.\nStatement 2 is correct, as equitable and reasonable utilization (ERU) is widely recognized in customary\ninternational law, particularly in the context of shared water resources. ERU emphasizes\nbalanced resource use, ensuring that no single state exploits shared watercourses to the detriment of others.\nStatement 3 is also correct. Customary law obliges states to conduct Environmental Impact Assessments (EIAs)\nfor projects with potential cross-border impacts, promoting transparency and minimizing risks to neighbouring\nstates."}, {"id": 110, "section": "International Relations and Organisations", "question": "Consider the following statements:\n      1. The UN Commission on the Status of Women (CSW) is a functional commission of the UN General\n           Assembly.\n      2. The CSW is the principal global intergovernmental body dedicated to the promotion of gender\n           equality.\n      3. The Beijing Declaration of 1995 was formulated under the guidance of the CSW.\nHow many of the above statements are correct?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "b", "explanation": "•   Statement 1 is incorrect because the CSW is a functional commission of the Economic and Social Council\n(ECOSOC), not the General Assembly.\n•   Statement 2 and Statement 3 are correct. The CSW is the primary global body for gender equality policy-\nmaking, and it was instrumental in formulating the landmark Beijing Declaration (1995).\n•   The CSW plays a vital role in monitoring progress on international agreements like the 2030 Agenda (SDG 5).\nIn its 70th session in 2026, the commission emphasized survivor-centered justice and the reform of\ndiscriminatory laws regarding property and marriage. It also addressed modern challenges like AI governance\nand digital exclusion. By providing a platform for NGOs and civil society, the CSW ensures that the voices of\nwomen from conflict zones (like Gaza or Ukraine) reach global policy-makers. It works in coordination with\nUN Women to ensure that gender equality is mainstreamed across all UN activities, acting as a global\nconscience for women's rights and legal protection."}, {"id": 111, "section": "International Relations and Organisations", "question": "Consider the following objectives of the UN80 Initiative:\n       1. Strengthening strategic planning and cost-effectiveness.\n       2. Enhancing collaboration among different UN bodies for better coordination.\n       3. Establishing a separate financial institution to oversee UN funding.\n       4. Encouraging timely financial contributions from member states.\nWhich of the above statements are correct?", "options": {"a": "1, 2, and 3 only", "b": "2, 3, and 4 only", "c": "1, 2, and 4 only", "d": "1, 3, and 4 only"}, "correct": "c", "explanation": "Explanation:\n• The UN80 Initiative is a recent reform-oriented effort within the United Nations framework, aimed at\nenhancing the efficiency, coordination, and financial sustainability of the global body in the run-up to its\n80th anniversary.\n• Statement 1 is correct — One of its core goals is to strengthen strategic planning and promote cost-effective\ndeployment of resources, especially in humanitarian, development, and peacekeeping operations.\n• Statement 2 is correct — The initiative stresses greater inter-agency collaboration among UN bodies,\nensuring synergy and cohesion in global responses to crises, including climate change, pandemics, and\nconflict.\n• Statement 3 is incorrect — The initiative does not propose the creation of a separate financial institution.\nInstead, it advocates for internal financial reforms within the current UN structure to ensure transparency,\naccountability, and efficiency.\n• Statement 4 is correct — Timely financial contributions from member states are crucial to address funding\ndelays that often hinder program implementation."}, {"id": 112, "section": "International Relations and Organisations", "question": "With reference to the United Nations Assistance Mission in Afghanistan (UNAMA), which of the following\n    statements is NOT correct?", "options": {"a": "It was established in 2002 to support the Afghan people through peacebuilding and development.", "b": "The mission monitors the situation of women and minorities under the current regime.", "c": "are all correct descriptions of UNAMA. It was established in 2002", "d": "is the incorrect statement. UNAMA is not a permanent body. It is a Special Political Mission whose\n    mandate must be periodically reviewed and extended by the UN Security Council. Recently its mandate was\n    extended for only three months, highlighting its temporary and mandate-driven nature.\n•   Options"}, "correct": "d", "explanation": "•   Option (d) is the incorrect statement. UNAMA is not a permanent body. It is a Special Political Mission whose\nmandate must be periodically reviewed and extended by the UN Security Council. Recently its mandate was\nextended for only three months, highlighting its temporary and mandate-driven nature.\n•   Options (a), (b), and (c) are all correct descriptions of UNAMA. It was established in 2002 (a), it actively\nmonitors human rights, including those of vulnerable groups (b), and it acts as the primary coordinator for\ninternational humanitarian efforts in a country facing severe food insecurity (c)."}, {"id": 113, "section": "International Relations and Organisations", "question": "Consider the following statements regarding the United States Commission on International Religious\n    Freedom (USCIRF):\n        1. It is a subsidiary body of the U.S. State Department tasked with implementing foreign policy related\n             to religious liberties.\n        2. It was established under the International Religious Freedom Act of 1998 to monitor global adherence\n             to the Universal Declaration of Human Rights.\n        3. The commission has the statutory authority to impose economic sanctions on countries it designates\n             as Countries of Particular Concern.\nHow many of the above statements are correct?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "a", "explanation": "•   The United States Commission on International Religious Freedom (USCIRF) is an independent, bipartisan\nagency of the U.S. legislative branch, not the executive branch or the State Department. This distinction is\ncrucial as it ensures the commission remains separate from the diplomatic interests of the State Department.\nStatement 1 is incorrect because it is not a subsidiary of the State Department.\n•   Statement 2 is correct. It was created by the International Religious Freedom Act (IRFA) of 1998. Its mandate\nincludes monitoring religious freedom globally based on international standards, specifically Article 18 of the\nUniversal Declaration of Human Rights, which protects the freedom of thought, conscience, and religion.\n•   Statement 3 is incorrect. While USCIRF monitors violations and provides policy recommendations to the\nPresident, the Secretary of State, and Congress, it does not have the power to impose sanctions. It only\nrecommends actions; the authority to designate Countries of Particular Concern (CPC) and implement\nsanctions rests with the U.S. Department of State. The commission's role is purely advisory and report-\noriented."}, {"id": 114, "section": "International Relations and Organisations", "question": "Consider the following statements regarding the United Nations Security Council (UNSC):\n       1. It is the only principal organ of the United Nations that was not established by the original UN Charter\n            of 1945.\n       2. The Council is headed by a rotating President chosen from the five permanent members only.\nWhich of the above statements are correct?", "options": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "correct": "d", "explanation": "Statement 1 is incorrect because the UNSC is one of the six principal organs established by the UN Charter in\n1945. It has been a central part of the UN structure since its inception.\nStatement 2 is incorrect because the Presidency of the Security Council rotates monthly among all its members\n(both the 5 permanent and 10 non-permanent members) in alphabetical order of their names. It is not restricted\nto the P5 (China, France, Russia, UK, and USA). The Council’s primary responsibility is maintaining international\npeace and security, and it remains the only body capable of authorizing collective military action or imposing\nbinding economic sanctions. Its significance lies in its ability to provide legal legitimacy to international\ninterventions. All member states are obligated under the Charter to implement its decisions, making it the most\ninfluential body in global diplomacy."}, {"id": 115, "section": "International Relations and Organisations", "question": "With reference to the Commission on the Status of Women (CSW), consider the following statements:\n       1. It was the first UN body to have its own secretariat provided by UN Women.\n       2. It contributes to the development of international norms like the Convention on the Elimination of All\n            Forms of Discrimination Against Women (CEDAW).\n       3. Member states are the only participants allowed to engage in the annual CSW dialogue platform.\nHow many of the above statements are correct?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "a", "explanation": "•   The CSW plays a major role in international law and policy.\n•   Statement 1 is incorrect; while UN Women currently provides secretariat support, the CSW was established\ndecades before UN Women (founded in 2010) existed. Historically, various UN divisions supported it.\n•   Statement 2 is correct; the CSW has been instrumental in standard-setting and was a key driver in the\ncreation of CEDAW, often described as the international bill of rights for women.\n•   Statement 3 is incorrect because the CSW is known for being the largest annual UN forum that is highly\ninclusive. While it is an intergovernmental body (decisions are made by states), the dialogue platform is open\nto civil society, NGOs, and other UN agencies.\n•   Thousands of NGO representatives attend every year to influence the \"Agreed Conclusions\" and participate in\nside events. This multi-stakeholder approach is a hallmark of the CSW, ensuring that grassroots voices from\naround the world can inform high-level policy discussions on gender equality and women's empowerment."}, {"id": 116, "section": "International Relations and Organisations", "question": "With reference to the legal concept of 'Force Majeure', consider the following statements:\n       1. It is a statutory right under international maritime law that automatically applies to all commercial\n            contracts.\n       2. For a party to invoke this clause, the event must be both unforeseeable at the time of signing and\n            external to the party's control.\nWhich of the above statements are correct?", "options": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "correct": "b", "explanation": "• Statement 1 is incorrect. Force majeure is not an automatic statutory right, nor does it universally apply\nunder international maritime law or all commercial contracts. It is primarily a contractual clause, meaning it\napplies only if explicitly included in the agreement between parties. In some jurisdictions, similar relief may\narise under doctrines like frustration of contract, but that is distinct from force majeure.\n•   Statement 2 is correct. For a party to successfully invoke a force majeure clause, the event must generally be\nunforeseeable, beyond the control of the parties, and must render performance impossible or impracticable.\nTypical examples include natural disasters, war, or government actions. Courts also examine whether the\naffected party took reasonable steps to mitigate the impact."}, {"id": 117, "section": "International Relations and Organisations", "question": "With reference to the thematic pillar 'Repairing the Commons' of the Raisina Dialogue 2026, which of the\n    following best describes its focus?", "options": {"a": "Exploring deep-sea mining and maritime security in the Indo-Pacific.", "b": "Investigating new groups, guardians, and avenues for global governance.", "c": "focuses on economic reinvention, and 'Contested Frontiers'", "d": "would be more relevant to military discussions.\n•   The focus on \"Repairing\" suggests an acknowledgement that the current multilateral system is fractured and\n    requires innovative avenues for cooperation. This pillar is essential for India’s advocacy for \"Effective\n    Multilateralism,\" where global institutions are made more inclusive and representative of the Global South.\n•   By hosting these discussions, the Raisina Dialogue seeks to shape the narrative on how humanity manages its\n    collective challenges in an era of increasing fragmentation."}, "correct": "b", "explanation": "•   The thematic pillar 'Repairing the Commons' is centered on the concept of \"Global Commons\"—resources\nand spaces that no single nation owns, such as the high seas, atmosphere, and cyberspace.\n•   The specific sub-theme for 2026 is \"New Groups, New Guardians, New Avenues.\" This reflects a move\ntoward reforming global governance structures that are often seen as outdated or stalled. It explores how\nnew international groupings (like the Quad or BRICS+) and non-state actors can act as \"guardians\" of these\nshared resources.\n•   In contrast, 'Trade in the Time of Tariffs' (c) focuses on economic reinvention, and 'Contested Frontiers' (d)\nwould be more relevant to military discussions.\n•   The focus on \"Repairing\" suggests an acknowledgement that the current multilateral system is fractured and\nrequires innovative avenues for cooperation. This pillar is essential for India’s advocacy for \"Effective\nMultilateralism,\" where global institutions are made more inclusive and representative of the Global South.\n•   By hosting these discussions, the Raisina Dialogue seeks to shape the narrative on how humanity manages its\ncollective challenges in an era of increasing fragmentation."}, {"id": 118, "section": "International Relations and Organisations", "question": "Match the following geographic features with their respective regions/locations:\n Geographic Feature Associated Location/Region\nI. Durand Line        A. Persian Gulf and Gulf of Oman\nII. Strait of Hormuz B. Afghanistan and Pakistan\n III. Hudson River          C. New York State, USA\nSelect the correct answer using the code given below:", "options": {"a": "I-B, II-A, III-C", "b": "I-A, II-B, III-C", "c": "I-B, II-C, III-A", "d": "I-C, II-A, III-B"}, "correct": "a", "explanation": "•   The Durand Line (I) is the international land boundary between Afghanistan and Pakistan (B). It was\nestablished in 1893 and remains one of the world's most sensitive and disputed borders due to its ethnic and\nhistorical complexities.\n•   The Strait of Hormuz (II) is a maritime chokepoint connecting the Persian Gulf and the Gulf of Oman (A). It is\nsituated between Iran and Oman and is vital for the global transit of oil and liquefied natural gas.\n•   The Hudson River (III) is a major waterway located in New York State (C). It originates in the Adirondack\nMountains and flows into the Atlantic Ocean at New York City.\n•   The Durand Line and the Strait of Hormuz are \"flashpoints\" where regional conflicts can have global security\nand economic repercussions, while the Hudson River represents a critical piece of North American economic\ninfrastructure."}, {"id": 119, "section": "International Relations and Organisations", "question": "Consider the following statements regarding the United Nations Security Council (UNSC):\n\n\n                                                                                Statement-I: The Security Council is the only body of the United Nations that possesses the authority to\nissue resolutions that are legally binding on all member states.\n        Statement-II: Under the UN Charter, all member states agree to accept and implement the decisions\nmade by the Security Council to maintain international peace and security.\nWhich one of the following is correct in respect of the above statements?", "options": {"a": "Both Statement-I and Statement-II are correct and Statement-II is the correct explanation for\nStatement-I", "b": "Both Statement-I and Statement-II are correct and Statement-II is not the correct explanation for\nStatement-I", "c": "Statement-I is correct but Statement-II is incorrect", "d": "Statement-I is incorrect but Statement-II is correct"}, "correct": "a", "explanation": "•   The United Nations Security Council (UNSC) holds a unique position within the international legal\narchitecture. Unlike the General Assembly, whose resolutions are generally recommendatory, the UNSC has\nthe power to issue binding mandates. This distinction is what gives the Council its \"teeth\" in international\ndiplomacy. Statement-I is correct because it accurately identifies the Council as the sole UN organ with this\nspecific legal authority.\n•   Statement-II is also correct and serves as the fundamental legal basis for Statement-I. The binding nature of\nUNSC resolutions is derived directly from the UN Charter, which is a treaty. When nations join the United\nNations, they sign onto this Charter, effectively consenting to the Council's jurisdiction in matters of global\npeace and security. Therefore, Statement-II explains why the Council's resolutions are binding—it is a result\nof the collective legal obligation accepted by member states.\n•   The Council’s functions, ranging from investigative and mediatory roles to enforcement measures like\neconomic sanctions or military action, rely on this foundational agreement. The significance of the UNSC lies\nin its role as the ultimate arbiter, providing international legal legitimacy to interventions that would\notherwise be considered violations of national sovereignty."}, {"id": 120, "section": "International Relations and Organisations", "question": "In the context of the Gulf Cooperation Council (GCC), consider the following statements:\n         1. All member states of the GCC are monarchies.\n         2. The council was established primarily to facilitate a common currency among the member states.\n         3. Yemen and Iraq are observers but not full members of the GCC.\nHow many of the above statements are correct?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "a", "explanation": "•   Statement 1 is correct. The GCC consists of six monarchies: Saudi Arabia, UAE, Qatar, Kuwait, Oman, and\nBahrain.\n•   Statement 2 is incorrect. While economic integration is a goal, the primary drivers for the establishment of\nthe GCC in 1981 were regional security and political stability in the wake of the Iranian Revolution and the\nIran-Iraq War. A common currency has been discussed but never fully implemented.\n•   Statement 3 is incorrect; while Yemen has sought membership and participates in some committees, neither\nYemen nor Iraq are \"official observer states\" in a formal capacity like a permanent status.\n•   The GCC remains a tightly-knit bloc of the six original members. The significance of this bloc lies in its control\nover global energy markets and its massive sovereign wealth funds, which are used to diversify their\neconomies away from oil reliance."}, {"id": 121, "section": "International Relations and Organisations", "question": "Match the following pairs regarding military exercises and their focus:\n\n\n\n\n                                                                                  Column A (Exercise) Column B (Nature/Host) Column C (Key Feature)\n1. Cold Response      A. NATO / Norway          I. Arctic Warfare & Civilian Preparedness\n2. Lamitiye           B. India-Seychelles       II. Semi-urban warfare training\n 3. Arctic Sentry         C. NATO               III. Broad Arctic Presence Mission\nSelect the correct answer using the code given below:", "options": {"a": "1-A-I, 2-B-II, 3-C-III", "b": "1-B-II, 2-A-I, 3-C-III", "c": "1-A-III, 2-B-I, 3-C-II", "d": "1-C-II, 2-B-III, 3-A-I"}, "correct": "a", "explanation": "•   Cold Response (1-A-I) is a NATO exercise hosted by Norway focused on Arctic conditions and \"Total Defence,\"\nwhich includes civilian sectors.\n•   Lamitiye (2-B-II) is a bilateral exercise between India and Seychelles, meaning \"Friendship,\" focusing on\ntactical drills in semi-urban and coastal environments to counter sub-conventional threats.\n•   Arctic Sentry (3-C-III) is a broader NATO mission that supports the alliance's presence in the Arctic, which\nCold Response helps reinforce.\n•   These exercises are strategically significant; Cold Response acts as a deterrent near the Russian border, while\nLamitiye strengthens India's role as a net security provider in the Indian Ocean under the SAGAR policy. Both\nemphasize interoperability among allied and partner forces in increasingly contested geographic theaters."}, {"id": 122, "section": "International Relations and Organisations", "question": "With reference to the Proba-3 mission, consider the following statements:\n       1. It is a precision formation-flying mission launched by the European Space Agency.\n       2. The mission uses a single satellite equipped with an internal coronagraph to study the Sun's\n            atmosphere.\n       3. It aims to create an artificial solar eclipse to observe the solar corona.\nHow many of the above statements are correct?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "b", "explanation": "•   Statement 1 is correct as Proba-3 is the world’s first precision formation-flying mission by the ESA, launched\naboard ISRO’s PSLV-C59.\n•   Statement 2 is incorrect because it is a twin spacecraft system. It consists of two independent satellites—the\nCoronagraph and the Occulter—not a single satellite. These two must maintain a precise distance of 150\nmeters to function as a virtual instrument.\n•   Statement 3 is correct because the primary objective is to create an artificial solar eclipse. The Occulter\nblocks the Sun’s disk, casting a shadow on the Coronagraph, allowing for the observation of the faint outer\natmosphere (the corona). This setup allows for continuous data collection, which is impossible during natural\neclipses on Earth. Studying the corona is vital for understanding solar winds and Coronal Mass Ejections\n(CMEs) that can affect Earth's power grids."}, {"id": 123, "section": "International Relations and Organisations", "question": "What is the primary focus of the Global Biofuel Alliance?", "options": {"a": "Promoting the use of biofuels exclusively in the transportation sector", "b": "Leading efforts to establish global standards for hydrogen production from biomass", "c": "Funding the production of biofuels in developing countries", "d": "Establishing global trade agreements for biofuel exports"}, "correct": "b", "explanation": "The Global Biofuel Alliance is focused on establishing global standards for the production of hydrogen from\nbiomass. This initiative is aimed at creating uniform regulations and best practices for biofuel production, with a\nparticular emphasis on sustainable and green hydrogen production. By setting these standards, the alliance aims\nto facilitate international collaboration and promote the global adoption of biofuels derived from biomass as part\nof a broader clean energy transition."}, {"id": 124, "section": "International Relations and Organisations", "question": "The 'Torkham' border crossing, recently in the news due to armed conflict, is located between:", "options": {"a": "India and Myanmar", "b": "Armenia and Azerbaijan", "c": "Iran and Iraq", "d": "Pakistan and Afghanistan"}, "correct": "d", "explanation": "•   The Torkham border crossing is one of the most significant and busiest transit points between Pakistan and\nAfghanistan. It is located along the Durand Line, the 2,640 km border that Afghanistan has historically\nrefused to recognize as an international boundary.\n•   Recently, Torkham has become a major flashpoint in the escalated conflict between the Pakistan Armed\nForces and the Afghan Taliban. The tension arose from issues like border fencing and Pakistan’s accusations\nthat the Taliban provides safe havens for the Tehrik-i-Taliban Pakistan (TTP). In response to alleged\nunprovoked aggression, Pakistan launched Operation Ghazab lil-Haq, which included airstrikes reaching as far\nas Kabul.\n•   The conflict has transitioned from intermittent skirmishes to a full-scale conventional military confrontation\ninvolving tanks and heavy artillery. The UN has flagged Torkham as a critical area where civilian populations\nare severely impacted by the hostilities. This region is strategically sensitive, and a prolonged war risks\ninvolving external powers like China or Russia, given the nuclear-sensitive nature of the neighborhood and\nPakistan's fragile economic and security situation. Torkham remains a barometer for the state of bilateral\nrelations between these two neighbors."}, {"id": 125, "section": "International Relations and Organisations", "question": "Consider the following statements.\n       Statement-I: Very Low Earth Orbit (VLEO) satellites are considered a \"self-cleaning\" technology regarding\n       space debris.\n       Statement-II: The significant atmospheric drag at altitudes below 450 km ensures that failed satellites\n       naturally de-orbit and burn up in the atmosphere.\nWhich one of the following is correct in respect of the above statements?", "options": {"a": "Both Statement-I and Statement-II are correct and Statement-II is the correct explanation for\nStatement-I", "b": "Both Statement-I and Statement-II are correct and Statement-II is not the correct explanation for\nStatement-I", "c": "Statement-I is correct but Statement-II is incorrect", "d": "Statement-I is incorrect but Statement-II is correct"}, "correct": "a", "explanation": "•   Space debris is a growing concern in Low Earth Orbit (LEO), where defunct satellites can remain for decades\nor centuries. However, satellites in Very Low Earth Orbit (VLEO)—typically between 150 km and 450 km—\noperate in a region where the Earth's atmosphere is thin but still dense enough to exert aerodynamic drag.\n•   Statement-I is correct because this drag acts as a natural \"janitor.\" If a VLEO satellite fails or its propulsion\nsystem stops providing the necessary thrust to maintain its altitude, the drag will rapidly pull the satellite\nlower into the denser layers of the atmosphere.\n•   Statement-II is correct and provides the direct physical reason for Statement-I. Upon entering the denser\natmosphere, the friction generates intense heat, causing the satellite to burn up completely. This prevents\nthe accumulation of \"dead\" assets in orbit, making VLEO a sustainable choice for satellite constellations\ncompared to higher orbits where satellites might require active de-orbiting maneuvers or remain as\nhazardous debris for long periods."}, {"id": 126, "section": "International Relations and Organisations", "question": "With reference to the Raisina Dialogue 2026, consider the following statements:\n       1. It is a multilateral conference hosted annually by the Ministry of External Affairs in partnership with\n            the Observer Research Foundation.\n       2. The 11th edition of the dialogue was held under the theme 'Saṁskāra – Assertion, Accommodation,\n            Advancement'.\n       3. One of its thematic pillars, 'Trade in the Time of Tariffs', focuses specifically on the recovery and\n            reinvention of global supply chains.\nWhich of the statements given above are correct?", "options": {"a": "1 and 2 only", "b": "2 and 3 only", "c": "1 and 3 only", "d": "1, 2 and 3"}, "correct": "d", "explanation": "•   The Raisina Dialogue has emerged as India’s premier conference on geopolitics and geo-economics since its\ninception in 2016.\n•   Statement 1 is correct as it is organized by the Observer Research Foundation (ORF) in collaboration with the\nMinistry of External Affairs (MEA). It serves as a flagship platform for discussing global strategic issues,\nsimilar to the Shangri-La Dialogue.\n•   Statement 2 is correct; the 2026 theme, \"Saṁskāra – Assertion, Accommodation, Advancement\", reflects\nIndia's vision of balancing national interests with global cooperation.\n•   Statement 3 is also correct as the 11th edition identified six thematic pillars, including \"Trade in the Time of\nTariffs\", which addresses the challenges of protectionism and the need for resilient economic recovery. The\ndialogue emphasizes India's role as a \"convening power\", bringing together diverse stakeholders like heads of\nstate, military commanders, and tech leaders.\n•   The 2026 event saw participation from 110 countries, highlighting its growing global footprint. The\nconference is named after Raisina Hill, the seat of the Indian government, symbolizing its status as a core\ndiplomatic exercise."}, {"id": 127, "section": "International Relations and Organisations", "question": "With reference to the International Energy Agency (IEA), consider the following statements:\n       1. It was originally established to coordinate a collective response to disruptions in the global oil supply.\n       2. A country must be a member of the OECD to qualify for full membership in the IEA.\n       3. India currently holds the status of an \"Association Country,\" which grants it full voting rights in energy\n            transition policies.\nHow many of the above statements are correct?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "b", "explanation": "•   The IEA is a central pillar of global energy governance.\n•   Statement 1 is correct; it was founded in 1974 following the 1973 oil crisis (the Arab oil embargo). Its primary\nmission was to ensure energy security for industrialized nations by creating a mechanism for collective action\nduring supply shocks.\n•   Statement 2 is correct based on the 1974 founding charter. Historically, OECD membership has been a\nmandatory prerequisite for joining the IEA. This is why the organization is headquartered in Paris alongside\nthe OECD.\n•   Statement 3 is incorrect. While India is an Associate Member (since 2017), this status does not grant voting\nrights or a seat in the primary decision-making bodies. India is currently the world’s 3rd largest energy\nconsumer, and its bid for full membership (applied for in 2023) is significant because it requires the IEA to\namend its charter to allow a non-OECD nation to join. This change reflects the shifting reality of global energy\nconsumption, where emerging economies like India now play a more dominant role than the traditional\nindustrialized nations of the 1970s."}, {"id": 128, "section": "International Relations and Organisations", "question": "Consider the following statements regarding the United Nations Convention on the Law of the Sea (UNCLOS):\n       1. It is often referred to as the \"Constitution of the Oceans\" and established the International Seabed\n            Authority (ISA).\n       2. The Convention guarantees the \"Freedom of Overflight\" in the Exclusive Economic Zones (EEZ) of\n            coastal states.\nWhich of the above statements are incorrect?", "options": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "correct": "b", "explanation": "•   Statement 1 is correct. UNCLOS (1982) is the comprehensive legal framework governing all ocean activities,\nearning it the title \"Constitution of the Oceans.\" It established critical institutions like the International\nSeabed Authority (ISA) to regulate mineral resources in the deep seabed beyond national jurisdiction (the\n\"Common Heritage of Mankind\") and the International Tribunal for the Law of the Sea (ITLOS) for dispute\nresolution.\n•   Statement 2 is incorrect in the context of general \"guaranteed\" rights within the EEZ as defined solely by the\nprovided principles of International Waters. While UNCLOS provides for various freedoms, the high seas\n(beyond 200 nautical miles) are where Freedom of Overflight and Freedom of Navigation are most absolute\nas part of the \"Shared Global Commons.\""}, {"id": 129, "section": "International Relations and Organisations", "question": "In the context of the International Emergency Economic Powers Act (IEEPA) of 1977, consider the following\n    statements:\n         1. The Act provides the US President with the authority to regulate international commerce only during\n              a state of war.\n         2. It was designed to replace and limit the broad powers previously granted under the Trading with the\n              Enemy Act (TWEA) of 1917.\n         3. While it allows for blocking assets and financial transactions, it does not explicitly grant blanket\n              authority for imposing long-term trade tariffs.\nHow many of the above statements are correct?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "b", "explanation": "• Statement 1 is incorrect because the IEEPA 1977 allows the President to act during a declared national\nemergency arising from external threats, which is a broader category than just a formal \"state of war.\" This\nflexibility allows the US to respond to terrorism, proliferation, or cyber threats that do not constitute\ntraditional warfare.\n• Statement 2 is correct; the IEEPA was enacted to constrain the executive branch by replacing the more\nexpansive powers of the 1917 trading with the Enemy Act (TWEA), which had been used excessively during\npeacetime.\n• Statement 3 is correct and highly relevant to recent legal developments. The US Supreme Court recently\nhighlighted that the IEEPA is primarily a sanctions framework. While it grants the President\nthe power to block assets or restrict transactions to protect national security, it does not provide a blanket\nmandate for trade protectionism or the imposition of long-term tariffs without specific Congressional\nbacking. This highlights the constitutional balance of power between the executive's role in foreign\npolicy/national security and Congress's authority over international trade and tariffs. The Act remains a\ncornerstone of US economic statecraft, allowing for the rapid deployment of sanctions against hostile entities\nwhile being subject to judicial review to prevent executive overreach."}, {"id": 130, "section": "International Relations and Organisations", "question": "Consider the following statements regarding Durand Line.\n       Statement-I: The Durand Line remains a significant source of diplomatic and military friction between\n       Pakistan and Afghanistan.\n       Statement-II: Afghanistan has historically refused to formally recognize the Durand Line as a legitimate\n       international boundary since the creation of Pakistan in 1947.\nWhich one of the following is correct in respect of the above statements?", "options": {"a": "Both Statement-I and Statement-II are correct and Statement-II is the correct explanation for\nStatement-I", "b": "Both Statement-I and Statement-II are correct and Statement-II is not the correct explanation for\nStatement-I", "c": "Statement-I is correct but Statement-II is incorrect", "d": "Statement-I is incorrect but Statement-II is correct"}, "correct": "a", "explanation": "•   The Durand Line is a 2,600-km border established in 1893 through an agreement between Sir Mortimer\nDurand of British India and Emir Abdur Rahman Khan of Afghanistan.\n•   Statement-I is correct because the border is a flashpoint for military clashes and political tension.\n•   Statement-II is also correct and provides the underlying reason for this friction. When Pakistan was created in\n1947, it inherited the border based on the principle of uti possidetis juris (as you possess under law).\nHowever, Afghanistan argued that the original treaty was with the British and expired upon their departure.\n•   The refusal to recognize the line stems from the fact that it bisects the Pashtun and Baloch ethnic\nhomelands, splitting families and tribes between two different sovereign states. This ethnic division has\nfueled cross-border militancy and \"Greater Pashtunistan\" sentiments. Recent years have seen increased\ntension as Pakistan began fencing the border to control movement, a move strongly opposed by authorities\nin Kabul.\n•   Thus, the lack of formal recognition (Statement-II) is the direct cause of the ongoing bilateral disputes and\ns
