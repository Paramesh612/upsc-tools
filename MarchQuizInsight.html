the following statements:\n         1. It refers to a condition where an organism expresses both male and female physical characteristics\n              simultaneously on different parts of its body.\n         2. Unlike hermaphroditism, gynandromorphy is typically the result of genetic anomalies during early\n              embryonic development.\nWhich of the above statements are correct?", "options": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "correct": "c", "explanation": "•   Statement 1 is correct. Gynandromorphy is a rare biological state where an individual is a mosaic of male\nand female tissue. In the case of Vela carli, the crab displayed male reproductive structures alongside\nfemale gonopores.\n•   Statement 2 is correct. There is a fundamental biological difference between the two. Hermaphroditism\nusually involves an organism having fully functional male and female reproductive organs (either at the\nsame time or sequentially). Gynandromorphy, however, is a genetic anomaly occurring during early cell\ndivision (mitosis), leading to a physical split in sexual characteristics across the body."}, {"id": 40, "section": "Ecology and Environment", "question": "With reference to the environmental impact of pollutants found in Black Rain, consider the following\n    statements:\n        1. Benzene is a known carcinogen that can cause long-term health issues upon exposure.\n        2. PFAS, or \"forever chemicals,\" are easily broken down by soil bacteria, preventing groundwater\n             contamination.\n        3. Topographic features like surrounding mountains can worsen the impact of black rain by trapping\n             smoke over urban centers.\n        4. The oily residue from black rain can be easily removed from buildings using standard rainwater\n             harvesting filters.\nHow many of the above statements are correct?", "options": {"a": "Only one", "b": "Only two", "c": "Only three", "d": "All four"}, "correct": "b", "explanation": "•    Statements 1 and 3 are correct. Benzene is a volatile organic compound and a known human carcinogen\nassociated with leukemia. Its presence in oily rainfall is a major public health concern. Topography plays a\ncritical role; as seen in Tehran, surrounding mountains act as a barrier, preventing smoke from dispersing and\nforcing the \"atmospheric loading\" of pollutants to settle over the city.\n• Statement 2 is incorrect. PFAS are called \"forever chemicals\" precisely because they do not break down in\nthe environment or the human body. They are resistant to water, grease, and heat, making them persistent\npollutants that can contaminate groundwater for generations.\nStatement 4 is incorrect. The residue from black rain is viscous, greasy, and oily. It leaves permanent or very\ndifficult-to-remove stains on infrastructure. Standard rainwater harvesting filters are designed for natural\nsediments and are not capable of filtering out complex hydrocarbons or oily contaminants, rendering the\nharvested water toxic and unusable for domestic or agricultural purposes."}, {"id": 41, "section": "Ecology and Environment", "question": "With reference to the Great Indian Bustard (GIB), consider the following statements:\n       1. It is a migratory bird that arrives in the Indian grasslands from Central Asia during the winter months.\n       2. The bird is a prolific breeder, typically laying multiple clutches of eggs throughout the monsoon\n            season.\n       3. It is classified as an 'Umbrella Species' because its conservation protects the entire grassland\n            ecosystem.\nHow many of the above statements are correct?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "a", "explanation": "•   Statement 1 is incorrect: The Great Indian Bustard is a resident species of the Indian subcontinent, not a\nmigratory bird from Central Asia. While it may show some local movement based on rainfall and food\navailability, it remains within the semi-arid grasslands of India and parts of Pakistan.\n•   Statement 2 is incorrect: The GIB is a slow breeder, usually laying only one egg per year. This low\nreproductive rate, combined with high juvenile mortality and habitat loss, makes the population extremely\nvulnerable to extinction.\n•   Statement 3 is correct: It is considered an umbrella species for grasslands. By protecting the vast, open tracts\nof land required by the GIB, conservationists effectively protect a wide range of other species, including the\nIndian Grey Wolf, Blackbuck, and various flora and fauna specific to the grassland biome. It is often called the\n\"flagship species\" of these ecosystems. The bird is currently Critically Endangered and is protected under\nSchedule I of the Wildlife Protection Act, 1972, signifying the highest level of legal protection in India."}, {"id": 42, "section": "Ecology and Environment", "question": "Consider the following statements regarding the Western Tragopan:\n       1. It is a pheasant species endemic to the Western Ghats and is known for its crimson neck patch.\n       2. The bird is listed as 'Critically Endangered' on the IUCN Red List due to habitat fragmentation.\n       3. It serves as an indicator species for the health of Himalayan temperate forest ecosystems.\nHow many of the above statements are correct?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "a", "explanation": "•   Statement 1 is incorrect: While the Western Tragopan (Tragopan melanocephalus) has a crimson neck patch,\nit is endemic to the Western Himalayas, not the Western Ghats. Its range extends from North-West Pakistan\nthrough Jammu and Kashmir and Himachal Pradesh to Uttarakhand.\n• Statement 2 is incorrect: Its IUCN status is 'Vulnerable', not 'Critically Endangered'. Its population is\nestimated to be fragmented and small (roughly 2,500–3,500 individuals), but it has not yet reached the\nthreshold for the highest threat category.\n• Statement 3 is correct: As a bird that inhabits dense undergrowth in temperate and subalpine forests\n(2,400–3,600 meters), it is considered an indicator species. Its presence or absence reflects the ecological\nintegrity of the Himalayan high-altitude forests. Locally called the Jujurana, it is the state bird of Himachal\nPradesh. Protecting its habitat also ensures the survival of other Himalayan biodiversity.\nThe bird is known for its secretive behavior and the distinctive horn-like fleshy blue structures that males display\nduring the breeding season."}, {"id": 43, "section": "Ecology and Environment", "question": "Consider the following pairs:\n       | Conservation Initiative | Associated Species |\n       | 1. Project Godawan | Great Indian Bustard |\n       | 2. Jujurana Conservation | Western Tragopan |\n       | 3. Project Panna | Indian Diamond Mining |\nHow many of the above pairs are correctly matched?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "c", "explanation": "•   Pair 1 is correct because the Great Indian Bustard (GIB) is locally known as Godawan in Rajasthan, which\nholds over 90% of its wild population. The Rajasthan government launched Project Great Indian Bustard in\n2013 to protect this flagship grassland species.\n• Pair 2 is correct as the Western Tragopan is popularly called Jujurana, meaning \"King of Birds,\" in Himachal\nPradesh. It is the state bird of Himachal Pradesh, and conservation efforts are focused on the Western\nHimalayan temperate forests to protect its dwindling numbers.\nPair 3 is correct in the context of the National Mineral Development Corporation (NMDC), which operates\nIndia’s only mechanized diamond mine at Panna, Madhya Pradesh. While \"Project Panna\" is often associated with\ntiger conservation (Panna Tiger Reserve), in the industrial and mineral context of India, it refers to the strategic\ndiamond mining operations that NMDC oversees."}, {"id": 44, "section": "Ecology and Environment", "question": "Which of the following best describes the \"Perform, Achieve and Trade\" (PAT) scheme?", "options": {"a": "A regulatory framework for the mandatory rehabilitation of cadres in Legacy Thrust Territories.", "b": "A diplomatic initiative to coordinate strikes under Operation Epic Fury.", "c": "A market-based mechanism to enhance energy efficiency in large energy-intensive industries.", "d": "A certification protocol for space re-entry modules to ensure thermal protection."}, "correct": "c", "explanation": "•   The PAT (Perform, Achieve and Trade) scheme is a flagship program of the Bureau of Energy Efficiency (BEE).\nIt is a market-based mechanism designed to improve the energy efficiency of Designated Consumers (DCs)—\nwhich are large, energy-intensive industries like cement, steel, and fertilizers.\n•   Under this scheme, the government sets specific energy reduction targets for these industries. Those that\nover-achieve their targets are issued Energy Savings Certificates (ESCerts), which can then be traded and\npurchased by those who find it difficult to meet their own targets.\n•   This creates a financial incentive for industrial energy conservation, contributing significantly to India's goal of\nreducing the overall energy intensity of its economy. It is not related to security operations or space\ntechnology."}, {"id": 45, "section": "Ecology and Environment", "question": "Consider the following statements regarding the phenomenon of \"Black Rain\":\n       1. It is formed when soot and toxic hydrocarbons from large-scale petroleum fires mix with rain droplets\n            in the atmosphere.\n       2. The presence of sulfur and nitrogen oxides in the smoke leads to the formation of acid rain, which is a\n            component of black rain.\n       3. Black rain is purely a visual phenomenon and does not carry any long-term environmental hazards\n            once the rain stops.\nHow many of the above statements are incorrect?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "a", "explanation": "•   Statement 1 is correct. Black rain is a severe form of environmental fallout. It occurs when massive quantities\nof particulate matter (soot) and unburned hydrocarbons are pushed into the atmosphere—typically from oil\nrefinery fires. These particles act as nuclei for water droplets, resulting in dark, oily precipitation.\n•   Statement 2 is correct. The combustion of petroleum releases Sulfur Oxides (SOx) and Nitrogen Oxides\n(NOx). When these react with water vapor and oxygen in the atmosphere, they form sulfuric and nitric acids.\nThus, black rain is often highly acidic, causing damage to infrastructure and vegetation.\n•   Statement 3 is incorrect. Black rain is far from being a \"visual only\" issue. It carries long-term environmental\nhazards. It contains \"Forever Chemicals\" (PFAS) and carcinogens like Benzene. These toxins can settle into\nthe soil and seep into groundwater, entering the food chain through crops. The environmental damage can\npersist for decades because many of these chemicals do not degrade naturally. It also poses immediate health\nrisks, including respiratory distress and skin burns."}, {"id": 46, "section": "Ecology and Environment", "question": "Consider the following statements regarding CO2-to-methanol technology:\n       1. The CO2-to-methanol technology supports India’s commitment to achieving net-zero carbon emissions\n       by 2030.\n       2. Methanol produced from CO2 can be used in a wide range of industrial applications, including the\n       chemical and energy sectors.\n       3. The primary challenge in scaling up the CO2-to-methanol technology is the lack of CO2 availability from\n       industrial sources in India.\nHow many of the above statements is/are correct?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "a", "explanation": "India has committed to achieving net-zero carbon emissions by 2070, not 2030 (Statement 1 is incorrect).\nMethanol produced from CO2 can be used in various industrial applications, including the chemical, energy,\nand transport sectors (Statement 2 is correct).\nIndia’s challenge in scaling up CO2-to-methanol technologies is not due to a lack of CO2 availability but rather the\ncost and efficiency of capturing CO2 from industrial emissions (Statement 3 is incorrect)."}, {"id": 47, "section": "Ecology and Environment", "question": "How does green hydrogen benefit industrial operations?", "options": {"a": "It reduces waste generation in industrial processes.", "b": "It offers lower energy efficiency compared to traditional combustion engines.", "c": "It enables on-site production and storage, reducing energy costs and grid dependence.", "d": "It increases dependence on the electricity grid for energy supply."}, "correct": "c", "explanation": "Green hydrogen production in the industrial sector allows for on-site generation and storage, making it a\nreliable and flexible energy source. This can significantly reduce dependence on the electricity grid and lower\nenergy costs, especially when produced using excess renewable energy. The use of green hydrogen in fuel cells\nalso increases energy efficiency compared to traditional combustion engines, contributing to a reduction in\noverall energy consumption and promoting sustainable industrial operations."}, {"id": 48, "section": "Ecology and Environment", "question": "In the context of Carbon Capture and Utilisation (CCU), the process of \"Biological Conversion\" most commonly\n    involves the use of which of the following?", "options": {"a": "High-pressure injection into saline aquifers.", "b": "Chemical synthesis of methanol from flue gases.", "c": "Cultivation of algae or bacteria to produce biomass.", "d": "Reaction of CO2 with calcium to form solid bricks."}, "correct": "c", "explanation": "Biological conversion in CCU specifically refers to using biological agents—most notably algae or certain\nbacteria—to \"consume\" CO2 through photosynthesis or other metabolic pathways. This process produces\nbiomass, which can then be processed into biofuels, animal feed, or fertilizers."}, {"id": 49, "section": "Ecology and Environment", "question": "Consider the following statements regarding the Striped Hyena (Hyaena hyaena):\n       1. It is the only species of the Hyaenidae family found in the Indian subcontinent and is primarily\n            nocturnal.\n       2. It is currently listed as 'Endangered' under the IUCN Red List of Threatened Species.\n       3. In India, it is granted the highest level of legal protection under Schedule I of the Wildlife (Protection)\n            Act, 1972.\nWhich of the statements given above are correct?", "options": {"a": "1 and 2 only", "b": "2 and 3 only", "c": "1, 2 and 3", "d": "1 and 3 only"}, "correct": "d", "explanation": "•   Statement 1 is correct; the Striped Hyena is the only species of the Hyaenidae family resident in India. It is a\nnocturnal carnivore, active primarily at night, which makes it an elusive inhabitant of arid and semi-arid\nlandscapes.\n•   Statement 2 is incorrect because its global status on the IUCN Red List is 'Near Threatened', though it is\nconsidered 'Vulnerable' in specific regions like the Mediterranean.\n•   Statement 3 is correct as the Indian government has placed it under Schedule I of the Wildlife (Protection)\nAct, 1972, ensuring stringent legal safeguards against hunting and habitat destruction. Ecologically, these\nanimals are vital \"sanitary workers\" or scavengers, consuming carrion and preventing the spread of diseases.\n•   Unlike the Spotted Hyena of Africa, the Striped Hyena is generally solitary or lives in very small family groups\nand does not possess the characteristic \"laughing\" vocalization. They are known for their powerful jaws\ncapable of crushing bone.\n•   Recently, Tajikistan and Uzbekistan proposed its inclusion in Appendix I and II of the Convention on\nMigratory Species (CMS) to enhance international conservation efforts for their transboundary movements."}, {"id": 50, "section": "Ecology and Environment", "question": "With reference to conservation methods, consider the following pairs:\n       | Conservation Method | Example / Site |\n       | 1. In-Situ Conservation | National Seed Gene Bank |\n       | 2. Ex-Situ Conservation | Biosphere Reserves |\n       | 3. In-Situ Conservation | Sacred Groves |\n       | 4. Ex-Situ Conservation | Cryopreservation |\nHow many of the pairs given above are correctly matched?", "options": {"a": "Only one", "b": "Only two", "c": "Only three", "d": "All four"}, "correct": "b", "explanation": "•   Pairs 3 and 4 are correctly matched. In-situ conservation involves the protection of species within their\nnatural habitats. Sacred Groves are a classic example of this, where community-protected forest fragments\nare preserved due to religious and cultural beliefs, acting as micro-refuges for biodiversity. Similarly,\nCryopreservation is a sophisticated ex-situ (off-site) method where biological materials like seeds, pollen, or\nembryos are stored at ultra-low temperatures to maintain viability for long periods outside their natural\nenvironment.\n•   Pairs 1 and 2 are incorrectly matched. The National Seed Gene Bank is an ex-situ facility because it preserves\ngenetic material in a controlled, artificial environment (NBPGR) rather than in the wild. Conversely, Biosphere\nReserves (like the Nilgiris) are large-scale in-situ conservation areas designed for ecosystem protection and\nsustainable development within the natural landscape.\n•   Understanding the distinction between \"on-site\" and \"off-site\" protection is fundamental to wildlife\nmanagement. While in-situ methods preserve the evolutionary process and ecological interactions, ex-situ\nmethods provide a vital safety net for species that are critically endangered or extinct in the wild. India\nutilizes a multidisciplinary approach combining both to ensure the restoration of healthy native ecosystems."}, {"id": 51, "section": "Ecology and Environment", "question": "Consider the following statements about the impact of polar ice melt on marine ecosystems:\n       1. Habitat loss due to ice melt primarily affects species like polar bears and penguins.\n       2. Changing salinity levels and water temperatures in the ocean are altering the biodiversity of marine\n       ecosystems.\n       3. Ocean acidification benefits shell-forming marine species by creating more favorable environments.\nHow many of the above statements is/are correct?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "b", "explanation": "Statement 1 is correct because polar ice melt leads to habitat loss for species like polar bears and penguins,\nwhich depend on sea ice for hunting and breeding.\nStatement 2 is also correct, as changing salinity and rising ocean temperatures due to melting ice are altering\nmarine biodiversity, affecting species composition and distribution.\nHowever, statement 3 is incorrect because ocean acidification harms shell-forming species by reducing the\navailability of carbonate ions, which are essential for building shells. Acidification poses a severe threat to these\nspecies."}, {"id": 52, "section": "Ecology and Environment", "question": "What is the key characteristic of Oxo-degradable plastics?", "options": {"a": "They are completely biodegradable in the environment", "b": "They are derived from renewable biomass", "c": "They contain additives that help break them into smaller fragments, leading to microplastic leakage", "d": "They are compostable and yield biomass during decomposition"}, "correct": "c", "explanation": "•   Oxo-degradable plastics are not truly biodegradable but instead fragment into microplastics due to the\npresence of chemical additives. These additives enable oxidation, which accelerates the breakdown of\nplastic under exposure to heat, light, and oxygen. However, instead of decomposing into harmless organic\nmatter, they disintegrate into microplastics, which persist in the environment and contribute to long-term\npollution.\n•   Unlike compostable plastics (which degrade into biomass, water, and carbon dioxide), oxo-degradable\nplastics do not fully break down and instead create microplastic contamination in soil, water bodies, and\nmarine ecosystems. They are often mistaken as a solution to plastic waste, but their environmental impact\nremains a major concern.\n•   Due to these issues, many countries and environmental organizations discourage or ban the use of oxo-\ndegradable plastics, advocating instead for biodegradable or compostable alternatives that completely\ndegrade into natural elements without harmful residues."}, {"id": 53, "section": "Ecology and Environment", "question": "Consider the following statements regarding the energy sector and methane emissions:\n       1. Methane often escapes during oil and gas production, transportation, and storage.\n       2. Methane is less likely to leak during natural gas production than during coal extraction.\n       3. Flaring and venting processes contribute to methane emissions in the energy sector.\nHow many of the above statements is/are correct?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "b", "explanation": "Statement 1 is correct as methane often escapes during oil and gas production, transportation, and storage due\nto leaks and equipment failure.\nStatement 3 is also correct; flaring and venting processes in the energy sector release methane.\nStatement 2 is incorrect because methane leaks occur more frequently in natural gas production than in coal\nextraction."}, {"id": 54, "section": "Ecology and Environment", "question": "India played a pivotal role in forming the Green Group alliance at the first Conference of Parties (COP) under\n    the UNFCCC. What was the primary objective of this coalition?", "options": {"a": "To promote the rapid development of renewable energy technologies", "b": "To counter demands from developed countries for stringent commitments on developing countries", "c": "To negotiate favorable trade agreements for developing nations", "d": "To create a fund for technological advancement in developed nations"}, "correct": "b", "explanation": "•   India’s role in forming the Green Group alliance of 72 like-minded developing countries during the first\nConference of Parties (COP) under the UNFCCC was primarily aimed at countering the demands from\ndeveloped countries.\n•   These demands sought to place stringent climate-related commitments on developing nations, without\nconsidering their varied development levels and historical contributions to global emissions.\n•   The coalition helped ensure that the interests of the Global South were adequately represented, emphasizing\nthat developing countries should not be subjected to the same obligations as developed nations in global\nclimate negotiations."}, {"id": 55, "section": "Geography", "question": "With reference to the Padma River in Bangladesh, consider the following statements:\n       1. It is formed by the bifurcation of the Ganges at the Farakka Barrage in West Bengal.\n       2. The river follows a braided channel pattern characterized by shifting \"chars\" or sandy islands.\n       3. The Mahananda is a major distributary that branches off from the Padma to feed the southwestern\n            districts.\nWhich of the statements given above is/are correct?", "options": {"a": "1 and 2 only", "b": "2 only", "c": "1 and 3 only", "d": "1, 2 and 3"}, "correct": "a", "explanation": "•   The Padma River is the principal channel of the Ganges in Bangladesh.\n•   Statement 1 is correct; the river enters Bangladesh after the main stream of the Ganges splits at the Farakka\nBarrage in Murshidabad, India. One branch continues as the Bhagirathi-Hooghly in India, while the main\nvolume flows into Bangladesh as the Padma.\n•   Statement 2 is correct. Geologically, the Padma is a classic braided river. Because of the high sediment load it\ncarries from the Himalayas, the river constantly creates and destroys chars (temporary islands). This leads to\na high erosion rate, which frequently alters the geography and displaces communities along its banks. During\nthe monsoon, its discharge is massive, often exceeding 75,000 cubic meters per second.\n•   Statement 3 is incorrect. The Mahananda is a tributary, not a distributary. It originates in the Himalayas and\njoins the Padma from the north in northwestern Bangladesh. Conversely, rivers like the Madhumati, Ariyal\nKhan, and Bhairab are distributaries that branch off from the Padma to distribute water across the delta. The\nPadma eventually joins the Meghna River at Chandpur before emptying into the Bay of Bengal. The recent\nconstruction of the Padma Bridge has reduced reliance on ferry terminals like Dauladia, though they remains\ncritical for heavy goods transit."}, {"id": 56, "section": "Geography", "question": "Consider the following statements regarding the rivers in Karnataka:\n      1. The Aghanashini is an independent, west-flowing river that originates in the Western Ghats and\n          remains largely undammed.\n      2. The Vedavathi river is formed by the confluence of the Veda and Avati streams and is part of the\n          Krishna River basin.\n      3. Both the Aghanashini and the Vedavathi rivers drain into the Arabian Sea.\n\n\n\n                                                                                     How many of the above statements are incorrect?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "a", "explanation": "•   Statement 1 is correct. The Aghanashini River originates at Sirsi in the Shankara Tirtha of the Heggarne\nforest. It is a pristine, free-flowing river that is notable for being largely undammed and free from significant\nindustrial pollution. It flows entirely through Karnataka and empties into the Arabian Sea at Tadri.\n•   Statement 2 is correct. The Vedavathi River is formed by the confluence of the Veda and Avati streams,\nwhich originate in the Bababudangiri range. It flows east and eventually joins the Tungabhadra River, which\nis a major tributary of the Krishna River. Thus, it is part of the larger Krishna River system.\n•   Statement 3 is incorrect. While the Aghanashini is a west-flowing river that drains into the Arabian Sea, the\nVedavathi is an east-flowing river. As a tributary of the Tungabhadra (and subsequently the Krishna), its\nwaters eventually flow into the Bay of Bengal.\n•   The proposed Aghanashini–Vedavathi river-linking project aims to divert water from the surplus, west-flowing\nAghanashini to the water-deficit, east-flowing Vedavathi. This project has faced scrutiny from UNESCO due to\nthe ecological sensitivity of the Aghanashini’s free-flowing nature and its impact on World Heritage\nConservation norms."}, {"id": 57, "section": "Geography", "question": "Consider the following statements about the practice of light fishing:\n      1. It is most commonly used in the monsoon season when fish abundance is at its peak.\n      2. It can interfere with the natural reproductive cycles of marine species.\n      3. It increases the risk of biodiversity loss by attracting non-target marine species.\nHow many of the above statements are correct?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "b", "explanation": "•   Light fishing is a practice that uses artificial lighting to attract fish toward nets or traps, and while it increases\nshort-term catch efficiency, it raises several ecological concerns.\n• Statement 1 is incorrect — light fishing is not typically practiced during the monsoon, when sea conditions\nare rough and fish populations are naturally abundant. Instead, it is predominantly used during lean fishing\nmonths, especially between December and February, when fish catch is low. The artificial attraction of fish\nduring these periods boosts economic returns but comes at a cost.\n• Statement 2 is correct — artificial lights can disrupt the natural behavioral and reproductive cycles of marine\norganisms. Many fish species rely on natural light cues for spawning, migration, and feeding rhythms, and\nthe presence of continuous artificial light can lead to physiological stress or failure to spawn.\nStatement 3 is also correct — artificial lights attract not only target species but a wide range of marine life,\nincluding juveniles and non-target species, thereby increasing the incidence of bycatch and contributing to\nbiodiversity loss in marine ecosystems."}, {"id": 58, "section": "Geography", "question": "Consider the following statements regarding asymmetric and semi-annually reversing surface circulation in\n   Indian Ocean.\n       Statement I: The Indian Ocean is the only ocean with an asymmetric and semi-annually reversing surface\n       circulation.\n       Statement II: This unique circulation is driven primarily by the seasonal monsoon winds.\n       Statement III: This reversal plays a critical role in the nutrient cycling and marine biodiversity of the North\n       Indian Ocean.\n\n\n\n                                                                                 Which one of the following is correct in respect of the above statements?", "options": {"a": "Both Statement II and Statement III are correct and both of them explain Statement I", "b": "Both Statement II and Statement III are correct but only one of them explains Statement I", "c": "Only one of the Statements II and III is correct and that explains Statement I", "d": "Neither Statement II nor Statement III is correct"}, "correct": "a", "explanation": "•   Statement I is a factual description of the Indian Ocean's unique physical oceanography. Unlike the Atlantic or\nPacific, where currents are relatively stable in their direction, the North Indian Ocean's currents reverse\ndirection twice a year.\n•   Statement II explains the mechanism: the Monsoon winds. During the summer, the Southwest Monsoon\npushes water one way; during winter, the Northeast Monsoon reverses it. This is the direct cause of the\nasymmetry and reversal mentioned in Statement I.\n•   Statement III explains the biological consequence. This seasonal reversal leads to upwelling (bringing cold,\nnutrient-rich water to the surface) in different regions at different times. This nutrient cycling supports the\nvast plankton growth that sustains the region’s marine biodiversity and 25% of the world's coral reefs.\n•   Both Statement II (the physical cause) and Statement III (the ecological impact) are correct, and both provide\na comprehensive explanation for why this \"unique reversal\" (Statement I) is scientifically and strategically\nsignificant for the region's littoral states and its global fishing catch."}, {"id": 59, "section": "Geography", "question": "Consider the following statements regarding Wular Lake:\n       1. Wular Lake was formed as a result of tectonic activity and is one of the largest freshwater lakes in\n            South Asia.\n       2. The lake is primarily fed by the Jhelum River and also receives glacial meltwater from the Pir Panjal\n            range.\n       3. The Wular Lake basin is designated as a Ramsar site due to its ecological importance and biodiversity.\nWhich of the above statements are correct?", "options": {"a": "3 only", "b": "1 and 3 only", "c": "2 and 3 only", "d": "1, 2 and 3"}, "correct": "d", "explanation": "•   Wular Lake was formed due to tectonic activity and is among the largest freshwater lakes in South Asia,\nmaking statement 1 correct.\n•   It is primarily fed by the Jhelum River and additional water from mountain streams, including glacial melt\nfrom nearby ranges such as Pir Panjal, making statement 2 also correct.\n•   Statement 3 is correct as Wular Lake is a Ramsar site recognized for its significant biodiversity and wetland\necology."}, {"id": 60, "section": "Geography", "question": "Consider the following statements.\n       Statement-I: Finland experiences phenomena such as the midnight sun and polar night.\n       Statement-II: Approximately one-third of Finland’s territory lies north of the Arctic Circle.\nWhich one of the following is correct in respect of the above statements?", "options": {"a": "Both Statement-I and Statement-II are correct and Statement-II is the correct explanation for\nStatement-I", "b": "Both Statement-I and Statement-II are correct and Statement-II is not the correct explanation for\nStatement-I", "c": "Statement-I is correct but Statement-II is incorrect", "d": "Statement-I is incorrect but Statement-II is correct"}, "correct": "a", "explanation": "•   Both statements are correct and Statement II provides the geographic reason for the phenomenon described\nin Statement I.\n•   Finland is a Nordic country located in Northern Europe, and a significant portion of its land—roughly one-\nthird—is situated north of the Arctic Circle. This high latitude is the reason why the country experiences\nextreme seasonal variation in daylight. During the summer, the midnight sun occurs, where the sun does not\nset for several weeks. Conversely, in the winter, the polar night (kaamos) occurs, where the sun remains\nbelow the horizon.\n•   Beyond its Arctic geography, Finland is known as the \"Land of Lakes,\" with about 56,000 lakes formed by\nglacial landforms from the Ice Age. It sits on an ancient Precambrian Shield of granite and is the most densely\nforested country in Europe. Strategically, Finland acts as a bridge between Western Europe and Russia, a role\nshaped by its history of gaining independence from Russia in 1917."}, {"id": 61, "section": "Geography", "question": "Which of the following is not a notable feature of Saturn as compared to Jupiter?", "options": {"a": "Spectacular ring system", "b": "Moon Titan", "c": "Great Red Spot", "d": "Longer orbital period"}, "correct": "c", "explanation": "The Great Red Spot is a notable feature of Jupiter, a giant storm that has been ongoing for centuries. Saturn, on\nthe other hand, is known for its spectacular ring system with seven rings, and it also has the large moon Titan.\nSaturn has a longer orbital period of 29.5 Earth years compared to Jupiter's 11.9 years."}, {"id": 62, "section": "Government Schemes and Programmes", "question": "In the context of the randomization of EVMs and VVPATs in India, consider the following statements:\n        1. Randomization is a software-driven process conducted to eliminate human bias.\n        2. The serial numbers of the machines are kept strictly confidential from political parties.\nWhich of the statements given above is/are correct?", "options": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "correct": "a", "explanation": "•   Statement 1 is correct because the randomization process utilizes the EVM Management System (EMS)\nsoftware to ensure that the allocation of machines to constituencies and polling stations is unpredictable and\nfree from human intervention.\n•   Statement 2 is incorrect because the process is designed for transparency, not secrecy. The serial numbers\nof the randomized machines are shared with representatives of recognized National and State political\nparties at every stage of the process to ensure institutional integrity and public confidence."}, {"id": 63, "section": "Government Schemes and Programmes", "question": "With reference to the Immigration, Visa, Foreigners Registration & Tracking (IVFRT) Scheme, consider the\n   following statements:\n        1. It is a mission-mode project implemented by the Ministry of External Affairs to facilitate international\n           trade.\n        2. The project interlinks Immigration Check Posts (ICPs), Foreigners Regional Registration Offices\n           (FRROs), and visa issuance systems into a global database.\n\n\n\n\n                                                                          3. The Fast Track Immigration (FTI-TTP) system aims to reduce passenger clearance time significantly\n           using automated e-gates.\nHow many of the above statements are correct?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "b", "explanation": "•   Statement 1 is incorrect: Although it facilitates travel, the IVFRT scheme is primarily a security-cum-service\nproject implemented by the Ministry of Home Affairs (MHA), not the Ministry of External Affairs. Its core\nmandate is border management and national security.\n• Statement 2 is correct: The scheme creates a seamless digital ecosystem by connecting 117 ICPs, 15 FRROs,\nand 854 FROs. This integration allows for real-time tracking of a traveler’s lifecycle—from the moment they\napply for a visa to their final exit from the country.\n• Statement 3 is correct: The Fast Track Immigration (FTI-TTP) is a technological leap that utilizes automated\ne-gates. By using trusted traveler credentials, it reduces clearance time from an average of 3 minutes to just\n30 seconds.\nThis \"contactless and faceless\" service enhances the ease of travel while ensuring that security protocols, such as\nbiometric verification, are strictly maintained. The scheme balances the dual objectives of promoting\ntourism/business and safeguarding the country against illegal migration and security threats."}, {"id": 64, "section": "Government Schemes and Programmes", "question": "Consider the following statements regarding Nasha Mukt Vidyalaya initiative:\n        Statement I: The Ministry of Education has mandated the declaration of a 500-metre radius around\nschools as drug-free zones under the Nasha Mukt Vidyalaya initiative.\n        Statement II: The initiative aims to shift the focus from law enforcement to behavioral change and early\nintervention through peer-led programs.\nWhich one of the following is correct in respect of the above statements?", "options": {"a": "Both Statement-I and Statement-II are correct and Statement-II is the correct explanation for\nStatement-I", "b": "Both Statement-I and Statement-II are correct and Statement-II is not the correct explanation for\nStatement-I", "c": "Statement-I is correct but Statement-II is incorrect", "d": "Statement-I is incorrect but Statement-II is correct"}, "correct": "b", "explanation": "•   Statement I is correct as the Nasha Mukt Vidyalaya initiative, a subset of the larger Nasha Mukt Bharat\nAbhiyan (NMBA), explicitly requires school heads to ensure that a 500-metre radius around the institution is\ndesignated as a \"Drug-Free Zone.\" This involves mandatory reporting of any violations or drug-related\nactivities within this perimeter to the local police.\n•   Statement II is also correct. The initiative represents a shift in strategy by utilizing educational institutions as\na primary defense. It emphasizes capacity building for teachers and peer-led initiatives among students to\nfoster a culture of mutual support. By targeting the school environment, the government seeks to trigger\nbehavioral change and ensure early intervention before addiction patterns become ingrained in the youth.\n•   However, Statement II is not the explanation for Statement I. Statement I describes a physical, regulatory,\nand spatial mandate (the 500m zone) which is a law enforcement and administrative tool.\n•   Statement II describes the sociological and psychological philosophy of the program (behavioral change)."}, {"id": 65, "section": "Government Schemes and Programmes", "question": "In the context of the Indian economy and housing finance, consider the following description: \"It acts as a\n   digital aggregator and marketplace, specifically targeting personnel who face geographical constraints in\n   accessing traditional banking. It facilitates a bidding process among lending institutions to ensure competitive\n   interest rates for the end-user.\" Which of the following portals is described in the passage above?", "options": {"a": "PRISM-SG Portal", "b": "JanSamarth Portal", "c": "PMAY-U 2.0 Dashboard", "d": "Gruh Sugam Portal"}, "correct": "d", "explanation": "•   The description pertains to the Gruh Sugam Portal, an initiative launched by the National Housing Bank\n(NHB). The portal is designed as a specialized digital lending platform to foster financial inclusion for Defense,\nParamilitary, and Government personnel. The core logic behind this platform is to bridge the gap between\nfinancial institutions and employees who are often posted in remote or high-altitude areas, where physical\ndocumentation and branch visits are nearly impossible.\n•   Unlike general credit portals, Gruh Sugam functions as a Unified Digital Marketplace where the borrower\nregisters basic requirements, and various registered banks then provide competitive offers. This \"bidding\"\nmechanism is crucial as it leverages the stable income profiles of government employees to drive down\ninterest rates, making affordable home ownership a reality.\n•   Furthermore, the portal's integration with administrative units allows personnel to process applications\nthrough their office’s digital interface, effectively bringing \"banking to the doorstep.\" This reduces the\nbureaucratic paper trail and ensures that the families of soldiers on duty can secure housing without the lead\napplicant needing to be physically present at a bank branch. The NHB, as the apex regulatory body for\nhousing finance, oversees this ecosystem to ensure consumer protection and grievance redressal."}, {"id": 66, "section": "Government Schemes and Programmes", "question": "With reference to the Credit Guarantee Scheme for Microfinance Institutions-2.0 (CGSMFI-2.0), consider the\n   following statements:\n        1. The scheme provides a uniform 80% guarantee cover for all defaulted amounts, regardless of the size\n             of the MFI.\n        2. The National Credit Guarantee Trustee Company Limited (NCGTC) is the agency responsible for\n             managing the guarantee cover.\n        3. It aims to reduce the lending rates for small borrowers by capping the interest rates Microfinance\n             Institutions can charge.\nWhich of the statements given above are correct?", "options": {"a": "1 and 2 only", "b": "1, 2 and 3", "c": "1 and 3 only", "d": "2 and 3 only"}, "correct": "d", "explanation": "•   CGSMFI-2.0 was launched in March 2026 to stabilize the microfinance sector. Statement 1 is incorrect\nbecause the scheme uses a tiered guarantee structure. It provides 80% coverage for small MFIs, 75% for\nmedium, and 70% for large ones. This design prioritizes smaller players who often face higher credit risks\nand lack the collateral of larger institutions.\n•   Statement 2 is correct. The NCGTC acts as the trustee and manager, providing the financial cushion to\nMember Lending Institutions (MLIs) like banks. This encourages banks to lend to MFIs by mitigating the\nrisk of default.\n•   Statement 3 is correct. A key conceptual goal of the scheme is affordable credit. Microfinance Institutions\nreceiving this support must cap their lending rates to the public at 1% below their average lending rate of\nthe previous six months. Additionally, the bank-to- Microfinance Institution loan rate is capped at\nEBLR/MCLR + 2%. This ensures that the benefit of the government guarantee is passed down to the 36\nlakh targeted small borrowers, promoting rural economic stability and financial inclusion."}, {"id": 67, "section": "Government Schemes and Programmes", "question": "Consider the following statements regarding Remission of Duties and Taxes on Exported Products (RoDTEP)\n   scheme.\n       Statement I: The RoDTEP scheme is considered fully compliant with World Trade Organization (WTO)\nnorms.\n\n\n                                                                                 Statement II: The scheme is based on the principle of remitting only those taxes and duties which are not\nalready refunded under existing mechanisms like GST.\nWhich one of the following is correct in respect of the Remission of Duties and Taxes on Exported Products\n(RoDTEP) scheme?", "options": {"a": "Both Statement-I and Statement-II are correct and Statement-II is the correct explanation for\n        Statement-I", "b": "Both Statement-I and Statement-II are correct and Statement-II is not the correct explanation for\n        Statement-I", "c": "Statement-I is correct but Statement-II is incorrect", "d": "Statement-I is incorrect but Statement-II is correct"}, "correct": "a", "explanation": "•   Statement I is correct. The RoDTEP scheme, which replaced the Merchandise Exports from India Scheme\n(MEIS), was specifically designed to be WTO-compliant. Its predecessor, MEIS, was challenged at the WTO\nbecause it was seen as an export subsidy rather than a simple tax remission.\n•   Statement II is correct and provides the underlying reason for Statement I's correctness. The WTO allows for\nthe remission of duties and taxes on inputs used in the production of exported goods, provided the remission\ndoes not exceed the actual taxes paid. RoDTEP strictly follows this \"taxes should not be exported\" principle by\nrefunding embedded costs—such as VAT on fuel used in transport, electricity duty, and Mandi tax—which are\nnot covered under GST or Duty Drawback.\n•   By ensuring that the refund is a mathematical remission of actual costs incurred rather than an arbitrary\nincentive, the Indian government shields its exporters from potential \"countervailing duties\" or legal\nchallenges in international trade forums. This makes Indian goods more price-competitive globally while\nadhering to the legal framework of international trade."}, {"id": 68, "section": "Government Schemes and Programmes", "question": "With reference to the Coconut Promotion Scheme, consider the following statements:\n      1. It is a Centrally Sponsored Scheme designed to provide a 50:50 fund-sharing ratio between the Centre\n           and the States.\n      2. The scheme prioritizes the replacement of senile and low-yielding trees with climate-resilient\n           cultivars.\n      3. It aims to enhance value addition through the branding and export of coconut-based products.\nHow many of the above statements are correct?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "b", "explanation": "•   The Coconut Promotion Scheme was announced in the Union Budget 2026–27 as a Central Sector initiative,\nnot a Centrally Sponsored Scheme. In Central Sector schemes, the entire expenditure is borne by the Union\nGovernment, whereas Centrally Sponsored Schemes involve cost-sharing between the Centre and States.\nTherefore, Statement 1 is incorrect. The scheme is part of a broader ₹350 crore allocation for high-value crops\nlike coconut, cashew, and cocoa.\n•   Statement 2 is correct as a primary feature of the scheme is Replantation and Rejuvenation, focusing on\nremoving old, unproductive trees and introducing high-yielding, disease-resistant varieties. This is crucial for\nIndia, which, despite being the largest producer, faces challenges from aging plantations. Statement 3 is also\ncorrect; the scheme emphasizes Value Addition, encouraging the processing, branding, and export of\nproducts to improve farmers' income and global competitiveness.\n•   India holds a 30.37% share in global coconut production, making it the world leader. The scheme, currently\nunder formulation, intends to utilize this dominant position by improving agronomic practices, irrigation, and\nnutrient management. By strengthening the livelihoods of approximately 30 million people dependent on\nthis sector, the government seeks to bridge the gap between production volume and farmer profitability.\nProductivity enhancement remains the cornerstone of this strategic intervention."}, {"id": 69, "section": "Government Schemes and Programmes", "question": "With reference to the Bharat Audyogik Vikas Yojna (BHAVYA) scheme, what is the significance of its alignment\n    with PM GatiShakti?", "options": {"a": "It allows for the automation of judicial appointments via a single-window system.", "b": "It mandates that 25% of all industrial park land be reserved for renewable energy plants.", "c": "It provides 100% financial assistance for social infrastructure like worker housing.", "d": "correctly identifies this synergy.\n•   The goal is to make India a global manufacturing hub by providing \"plug-and-play\" facilities that are ready for\n    immediate export-oriented production."}, "correct": "d", "explanation": "•   The Bharat Audyogik Vikas Yojna (BHAVYA) is not just about building sheds; it is about creating a functional\nindustrial ecosystem. Its alignment with PM GatiShakti is a core feature. PM GatiShakti is a National Master\nPlan for multimodal connectivity that breaks down silos between different infrastructure departments\n(railways, shipping, roads, etc.).\n•   By aligning BHAVYA with GatiShakti, the government ensures that when a 1000-acre industrial park is\nplanned, it is simultaneously integrated with the nearest highway, railway siding, or port. This logistics\nintegration is crucial for reducing the \"cost of doing business\" in India, which has historically been high due to\nfragmented infrastructure. Statement (d) correctly identifies this synergy.\n•   The goal is to make India a global manufacturing hub by providing \"plug-and-play\" facilities that are ready for\nimmediate export-oriented production."}, {"id": 70, "section": "Government Schemes and Programmes", "question": "What is the primary aim of the Digital India Common Service Center (DICSC) project?", "options": {"a": "To enhance agricultural productivity through digital tools", "b": "To develop urban e-commerce platforms for rural products", "c": "To bridge the digital divide in rural areas by providing e-governance and digital services", "d": "To set up government offices in rural areas for public grievances"}, "correct": "c", "explanation": "The main objective of the Digital India Common Service Center (DICSC) project is to bridge the digital divide in\nrural areas by providing digital and e-governance services at the grassroots level. By establishing model centers\nin gram panchayats, the initiative ensures that rural citizens have access to essential services like Aadhaar,\nbanking, tele-law, telemedicine, and more, promoting digital inclusion and literacy. Unlike urban-focused projects\nor agriculture-specific initiatives, this project focuses on improving digital infrastructure and service accessibility\nfor rural communities."}, {"id": 71, "section": "Government Schemes and Programmes", "question": "What is the primary significance of the Sujal Gaon ID in rural water governance?", "options": {"a": "To provide direct financial subsidies to rural households for water bills.", "b": "To create a source-to-tap digital architecture for monitoring infrastructure and service delivery.", "c": "To privatize the maintenance of rural water schemes through international bidding.", "d": "To replace the existing Aadhaar-linked verification for water connections."}, "correct": "b", "explanation": "•   The Sujal Gaon ID is essentially a management and monitoring tool. Its primary significance lies in\nestablishing a national digital architecture. By assigning a unique ID to every scheme, the government can\ntrack the source-to-tap journey, ensuring that the infrastructure built under the Jal Jeevan Mission is actually\ndelivering water as intended. It helps in identifying leakages, planning maintenance, and ensuring evidence-\nbased decision-making. It is not about direct subsidies (a), privatization (c), or replacing Aadhaar (d), but\nrather about data-driven governance of public assets."}, {"id": 72, "section": "Government Schemes and Programmes", "question": "Consider the following statements regarding Samriddh Gram pilot initiative.\n       Statement I: The Samriddh Gram pilot initiative focuses on the convergence of digital infrastructure with\n       local governance institutions.\n       Statement II: The initiative aims to develop a replicable model for rural digital transformation.\n       Statement III: Samriddh Gram utilizes Samriddhi Kendras to provide a single-window access point for\n       diverse services like skill development and agriculture advisory.\nWhich one of the following is correct in respect of the above statements?", "options": {"a": "Both Statement II and Statement III are correct and both of them explain Statement I", "b": "Both Statement II and Statement III are correct but only one of them explains Statement I", "c": "Only one of the Statements II and III is correct and that explains Statement I", "d": "Neither Statement II nor Statement III is correct"}, "correct": "a", "explanation": "•   Statement I highlights the core philosophy of Samriddh Gram—connecting BharatNet (digital infrastructure)\nwith Panchayats (local governance).\n•   Statement II describes the ultimate objective, which is to create a template (model) that can be scaled across\nIndia's 600,000+ villages.\n•   Statement III explains the operational mechanism: the Samriddhi Kendras, which act as \"one-stop shops.\" In\nthe context of the question, both Statement II and Statement III explain Statement I. The convergence\nmentioned in Statement I is achieved through the Samriddhi Kendras (Statement III) and is motivated by the\ndesire to create a replicable model (Statement II).\n•   Without the functional hub (Kendras) and the broader goal of transformation, the convergence of digital and\nphysical infrastructure would lack both a medium and a purpose. This pilot project in villages like Umri and\nChaurawala tests how effectively high-speed internet can be translated into tangible citizen services like tele-\nmedicine and e-commerce, thereby bridging the rural-urban digital divide and empowering local self-\ngovernment."}, {"id": 73, "section": "Government Schemes and Programmes", "question": "With reference to the Samriddh Gram Phygital Services Pilot Initiative, consider the following statements:\n       1. It leverages the high-speed broadband infrastructure provided by BharatNet to deliver services in\n            rural areas.\n       2. The initiative is being implemented by the Ministry of Rural Development in collaboration with the\n            Department of Posts.\n       3. \"Samriddhi Kendras\" act as one-stop hubs for health, education, and e-governance services within a 5\n            km radius of villages.\n       4. The pilot project is initially confined to the northeastern states to bridge the digital divide in hilly\n            terrains.\nHow many of the above statements are correct?", "options": {"a": "Only one", "b": "Only two", "c": "Only three", "d": "All four"}, "correct": "b", "explanation": "•   Statement 1 is correct: The Samriddh Gram initiative is built on the digital backbone of BharatNet, which is\none of the world's largest rural broadband projects. This connectivity is essential for the \"Phygital\" (Physical +\nDigital) model.\n•   Statement 2 is incorrect: The initiative is implemented by the Department of Telecommunications (DoT)\nunder the Ministry of Communications, not the Ministry of Rural Development.\n•   Statement 3 is correct: Each Samriddhi Kendra is designed as a village-level service hub located at Panchayat\nBhawans, offering integrated services like telemedicine, agriculture advisory, and financial inclusion to\nvillages within a 5 km radius.\n•   Statement 4 is incorrect: The pilot project is being implemented in three diverse locations—Umri (Madhya\nPradesh), Narakoduru (Andhra Pradesh), and Chaurawala (Uttar Pradesh)—representing different socio-\neconomic contexts across India, rather than being restricted to the Northeast.\n•   The \"Phygital\" approach ensures that even those with low digital literacy can access high-tech services\nthrough physical assistance at the centers. This model aims to foster rural digital transformation by\nconverging infrastructure with community-centric governance."}, {"id": 74, "section": "Government Schemes and Programmes", "question": "With reference to the Bureau of Energy Efficiency (BEE), consider the following statements:\n       1. It mandates energy audits for all residential buildings in India.\n       2. It has developed the \"Star Label App\" to help consumers make informed choices about energy-\n            efficient appliances.\n\n\n\n                                                                          3. The BEE is currently transitioning toward market-based carbon mechanisms like the Carbon Credit\n           Trading Scheme (CCTS).\nHow many of the above statements are correct?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "b", "explanation": "•   The BEE’s role has evolved from simple labeling to complex market systems.\n•   Statement 1 is incorrect; while BEE promotes energy efficiency in buildings (like the Energy Conservation\nBuilding Code), it does not mandate energy audits for all residential buildings. Audits are primarily mandated\nfor designated energy-intensive industries.\n•   Statement 2 is correct; the Star Label App is a digital tool designed to increase consumer awareness, allowing\nusers to compare the energy savings and costs of different appliances.\n•   Statement 3 is correct; moving beyond the PAT scheme, the BEE is playing a central role in India’s transition\nto a national carbon market through the CCTS, which aims to align industrial emissions with India’s Net Zero\ntargets."}, {"id": 75, "section": "Government Schemes and Programmes", "question": "Consider the following statements regarding the Jal Jeevan Mission (JJM):\n       1. The mission’s objective is to provide 55 liters of water per person per day to every rural household\n            through Functional Household Tap Connections (FHTC).\n       2. Under the JJM 2.0 framework, the program has shifted its primary focus from service delivery to\n            large-scale infrastructure creation.\n       3. The Sujalam Bharat digital framework utilizes unique Sujal Gaon IDs to map water supply from source\n            to tap.\nHow many of the above statements are correct?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "b", "explanation": "•   Statement 1 is correct. The core mandate of the Jal Jeevan Mission, launched in 2019, is to ensure \"Har Ghar\nJal\" (Water in Every Home). It targets the provision of 55 liters of potable water per capita per day through\nindividual tap connections (FHTCs).\n•   Statement 2 is incorrect. The recent extension of the mission until 2028 (often termed JJM 2.0) marks a\nstrategic shift from infrastructure creation to sustained service delivery. While the initial phase focused on\nlaying pipes and building tanks, the current focus is on ensuring that these systems actually deliver water\n24×7 through utility-based reforms and MoUs with states.\n•   Statement 3 is correct. To enhance transparency and monitoring, the government introduced the Sujalam\nBharat digital framework. Under this, every village is assigned a Sujal Gaon ID, allowing for the digital\nmapping of the entire water supply chain. This ensures that the water quality and quantity are monitored\nfrom the source to the end-user's tap, reducing leakages and ensuring accountability."}, {"id": 76, "section": "Government Schemes and Programmes", "question": "Consider the following statements regarding the Pradhan Mantri Matsya Sampada Yojana (PMMSY):\n       1. It is a Central Sector Scheme designed to replace all existing state-level fisheries welfare programs.\n       2. The scheme incorporates the promotion of seaweed cultivation and ornamental fisheries to diversify\n           livelihoods.\n       3. It aims to modernize the fisheries value chain specifically through the development of fishing\n           harbours and cold chain facilities.\nWhich of the above statements are correct?", "options": {"a": "1 and 2 only", "b": "1 and 3 only", "c": "2 and 3 only", "d": "1, 2 and 3"}, "correct": "c", "explanation": "•   Statement 1 is incorrect because PMMSY is an umbrella scheme that operates through two components:\nCentral Sector (CS) and Centrally Sponsored Scheme (CSS). It does not \"replace\" all state programs but\nprovides a comprehensive framework for holistic development across the country.\n•   Statement 2 is correct as the scheme explicitly supports non-traditional activities like biofloc farming,\nseaweed cultivation, and ornamental fisheries to increase income and provide climate-resilient livelihoods.\n•   Statement 3 is correct because a core pillar of the scheme is infrastructure development, which includes the\nmodernization of fishing harbours, fish landing centers, and the establishment of robust post-harvest\nmanagement systems like cold chains. The scheme represents a shift from traditional fishing to a more\ntechnology-driven and value-added approach, aiming to reduce post-harvest losses, which are currently high\nin the Indian fisheries sector. This holistic focus ensures both economic growth for fishers and the sustainable\nmanagement of marine and inland aquatic resources."}, {"id": 77, "section": "Government Schemes and Programmes", "question": "Consider the following statements regarding the 'Lighting a Billion Lives 2.0' (LaBL 2.0) initiative:\n       1. It is a decentralized renewable energy programme launched by the Ministry of New and Renewable\n            Energy (MNRE).\n       2. The initiative focuses on promoting women-led entrepreneurship and green livelihoods in rural\n            regions.\n       3. It incorporates carbon accounting frameworks to link grassroots energy projects with global carbon\n            markets.\nHow many of the above statements are correct?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "b", "explanation": "•   The LaBL 2.0 initiative represents a significant evolution in decentralized energy access.\n•   Statement 1 is incorrect because the program is launched by The Energy and Resources Institute (TERI), a\nleading research institute, rather than a government ministry directly, although it aligns with national goals.\n•   Statement 2 is correct as a core pillar of LaBL 2.0 is the promotion of green livelihoods and empowering\nwomen as clean energy entrepreneurs. By focusing on productive uses of energy, it goes beyond simple\nlighting to enable small-scale rural industries.\n•   Statement 3 is correct because the 2.0 version specifically integrates Monitoring, Reporting, and Verification\n(MRV) frameworks. This allows for precise carbon accounting, enabling rural projects to tap into climate\nfinance and carbon markets. This financial integration ensures the long-term sustainability of decentralized\nrenewable energy (DRE) projects by creating new revenue streams for local communities. The transition from\nthe 2008 version to 2.0 signifies a shift from basic solar lighting to a comprehensive ecosystem involving\nclimate finance, women's empowerment, and sustainable economic development, directly supporting India’s\n\"Net Zero\" commitments through localized, bottom-up climate action."}, {"id": 78, "section": "Government Schemes and Programmes", "question": "Consider the following statements regarding the ‘Villages of Excellence’ initiative:\n       1. It is a grassroots-level extension of the Indo-Israel Agriculture Project (IIAP).\n       2. The initiative aims to transform entire farming clusters into technology-driven zones rather than\n           focusing only on centralized hubs.\n       3. The project is primarily funded and managed by the World Food Programme (WFP).\nHow many of the above statements are correct?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "b", "explanation": "Statement 3 is incorrect.\n•   The Villages of Excellence initiative represents a strategic shift in agricultural cooperation between India and\nIsrael. Historically, cooperation focused on Centres of Excellence (CoEs) which acted as centralized high-tech\nresearch hubs. This new initiative seeks to bridge the gap between these research centers and the common\nfarmer by integrating Israeli expertise directly into local village ecosystems. It aims to transform entire\nfarming clusters into modern agricultural zones using a \"hub and spoke\" model, where villages surrounding\nexisting CoEs serve as models.\n•   The initiative utilizes a sophisticated technological suite, including precision farming, satellite-based\nirrigation, and advanced nursery management. It is supported by the India-Israel Innovation Centre for\nAgriculture (IINCA), which provides the research foundation. Crucially, this is a bilateral government-to-\ngovernment initiative under the Special Strategic Partnership; it is not managed or funded by the World Food\nProgramme (WFP).\n•   The goal is to double farmers’ income by increasing productivity and reducing waste. By launching joint\nfellowships and on-site training, the program ensures long-term capacity building for Indian researchers and\nfarmers, making sustainable, future-ready farming a reality at the grassroots level across the planned 100\nCentres of Excellence."}, {"id": 79, "section": "Government Schemes and Programmes", "question": "The \"e-CHARAK\" portal, often mentioned in the context of medicinal plants, primarily serves as:", "options": {"a": "A digital library for ancient Ayurvedic manuscripts.", "b": "An online platform for the auction of timber from protected forests.", "c": "A virtual market for information exchange between farmers and herbal traders.", "d": "A mobile app for identifying endangered wildlife species in the field."}, "correct": "c", "explanation": "The e-CHARAK (e-Channel for Heritage, Aromatic, Raw-materials and Knowledge) portal is a digital initiative by\nthe National Medicinal Plants Board (NMPB). Its main goal is to create a transparent supply chain for the\nmedicinal plant sector. By providing a platform for farmers, collectors, and herbal traders, it facilitates the trade\nof raw materials like Nagauri Ashwagandha. This is crucial for India, which is the second-largest exporter of\nmedicinal plants. The portal helps farmers get better prices and ensures that the multi-billion dollar traditional\nmedicine (AYUSH) market has a sustainable supply of authentic ingredients."}, {"id": 80, "section": "Government Schemes and Programmes", "question": "Consider the following statements about the Central Warehousing Corporation (CWC):\n        Statement I: The CWC functions as a statutory body established to support the integrated supply chain\n    management of foodgrains.\n        Statement II: It has the authority to acquire and lease land for the expansion of warehousing\n    infrastructure across various states.\n        Statement III: Its role is limited to the storage of agricultural produce and does not extend to industrial\n    logistics or container freight.\nWhich one of the following is correct in respect of the above statements?", "options": {"a": "Both Statement II and Statement III are correct and both of them explain Statement I", "b": "Both Statement II and Statement III are correct but only one of them explains Statement I", "c": "Only one of the Statements II and III is correct and that explains Statement I", "d": "Neither Statement II nor Statement III is correct"}, "correct": "c", "explanation": "•   Statement I is a correct general description of CWC's mission.\n•   Statement II is correct; CWC has the mandate to expand its network by acquiring or leasing land to build\ngodowns and logistics hubs.\n•   Statement III is incorrect because CWC’s role is not limited to agricultural produce. It is heavily involved in\nindustrial logistics, operating Inland Container Depots (ICDs), Container Freight Stations (CFSs), and Custom\nBonded Warehouses for a variety of manufactured and imported goods.\n•   Statement II provides a functional explanation for how CWC achieves the goal mentioned in Statement I\n(integrated supply chain management requires physical infrastructure)."}, {"id": 81, "section": "Government Schemes and Programmes", "question": "Consider the following statements regarding the Central Warehousing Corporation (CWC):\n       1. It is a Central Public Sector Enterprise operating under the administrative control of the Ministry of\n            Agriculture and Farmers Welfare.\n       2. The corporation provides logistics support for a wide range of commodities including foodgrains,\n            sugar, and fertilizers.\n       3. Its origins are linked to the wartime food administration established during the 1940s.\nHow many of the above statements are correct?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "b", "explanation": "•   The Central Warehousing Corporation (CWC) is a premier statutory body, but it operates under the Ministry\nof Consumer Affairs, Food & Public Distribution, not the Ministry of Agriculture. Therefore, statement 1 is\nincorrect.\n•   It was established to provide scientific storage and logistics for a diverse array of goods. As mentioned in\nstatement 2, its functional mandate includes handling foodgrains, sugar, and fertilizers, alongside providing\nInland Container Depots (ICDs) and Custom Bonded Warehousing to facilitate international trade.\n•   The historical evolution of CWC, as noted in statement 3, traces back to the Second World War. In 1942, a\nseparate Food Department was created to manage food administration during the war. Post-independence,\nspecifically between 1947 and 1958, the warehousing functions were restructured, eventually leading to the\nenactment of the Warehousing Corporations Act. The CWC was formally established in 1957.\n•   Today, it plays a pivotal role in maintaining India’s food security by managing buffer stocks and supporting\nthe Public Distribution System (PDS). By improving storage efficiency, the CWC contributes significantly to\nthe national goal of reducing logistics costs and minimizing post-harvest losses in the agricultural value chain."}, {"id": 82, "section": "Science and Technology", "question": "With reference to Artificial Intelligence, what does the term \"Token\" represent?", "options": {"a": "The physical hardware chip used to train a model.", "b": "The smallest unit of data processed by a Large Language Model (LLM).", "c": "A cryptocurrency used to pay for AI-generated art.", "d": "A security password required to access an AI server."}, "correct": "b", "explanation": "•   In the context of Large Language Models (LLMs), a token is the fundamental unit of information. While\nhumans read text as words, AI models break text down into tokens during a process called tokenization. A\ntoken is not always a full word; it can be a single character, a part of a word (like the \"ing\" in \"playing\"), or\neven a whole word depending on the model's design.\n•   Once text is tokenized, it undergoes numerical conversion, where each token is assigned a unique numerical\nID (vector) that the computer can understand. The model then uses mathematical patterns to predict the\nnext token in a sequence. This granularity allows AI to handle spelling, grammar, and even coding languages\neffectively.\n•   Tokens also serve as the utility meter for the AI industry; companies like OpenAI or Google charge developers\nbased on the number of Input Tokens (the prompt) and Output Tokens (the response). Different languages\nhave different levels of language variability, meaning some languages use more tokens per word than others,\naffecting the cost and efficiency of the AI agent."}, {"id": 83, "section": "Science and Technology", "question": "Which one of the following best describes the primary objective of the Model Context Protocol (MCP)\n   launched for the e-Sankhyiki portal?", "options": {"a": "To replace human statisticians with AI models for economic planning.", "b": "To encrypt official government data so that it cannot be accessed by open-source AI models.", "c": "is the correct description. The primary aim is to eliminate data silos. Currently, AI models like ChatGPT\nor Gemini are \"frozen\" in time based on their training data. By using MCP, these models can \"plug into\" a live\ndatabase (the Server). When a user asks a question about current economic figures, the AI uses the protocol to\nfetch the latest available statistics from the portal.\nThis is significant for several reasons:\n    1. Accuracy: It reduces \"hallucinations\" by providing ground truth.\n    2. Governance: It democratizes access to official statistics, allowing policymakers and the public to query\n          complex datasets using simple chat interfaces.\n    3. Universal Integration: Since it is an open standard, any developer can build an MCP server. A single\n          server (like the e-Sankhyiki one) can allow multiple different AI tools to access the same verified data\n          simultaneously. It does not aim to replace humans (Option a), nor is it about encryption (Option b) or\n          creating a proprietary system (Option d).", "d": "To create a proprietary database that only Indian-made AI assistants can access."}, "correct": "c", "explanation": "The Model Context Protocol (MCP) is an open-source standard originally introduced by Anthropic and later\nadopted for various implementations, including by the Government of India for the e-Sankhyiki portal.\nOption (c) is the correct description. The primary aim is to eliminate data silos. Currently, AI models like ChatGPT\nor Gemini are \"frozen\" in time based on their training data. By using MCP, these models can \"plug into\" a live\ndatabase (the Server). When a user asks a question about current economic figures, the AI uses the protocol to\nfetch the latest available statistics from the portal.\nThis is significant for several reasons:\n1. Accuracy: It reduces \"hallucinations\" by providing ground truth.\n2. Governance: It democratizes access to official statistics, allowing policymakers and the public to query\ncomplex datasets using simple chat interfaces.\n3. Universal Integration: Since it is an open standard, any developer can build an MCP server. A single\nserver (like the e-Sankhyiki one) can allow multiple different AI tools to access the same verified data\nsimultaneously. It does not aim to replace humans (Option a), nor is it about encryption (Option b) or\ncreating a proprietary system (Option d)."}, {"id": 84, "section": "Science and Technology", "question": "Consider the following pairs:\n      1. Drug-Resistant TB: Bacteria do not respond to standard first-line antibiotics.\n      2. Latent TB: Individual shows no symptoms and is highly infectious.\n      3. Active TB: Bacteria multiply, making the person symptomatic and infectious.\nHow many of the above pairs are correctly matched?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "b", "explanation": "• Pair 1 is correctly matched. Drug-Resistant TB (which includes MDR-TB and XDR-TB) refers to strains of\nMycobacterium tuberculosis that have developed resistance to standard treatments. Multidrug-resistant TB\n(MDR-TB) specifically does not respond to at least isoniazid and rifampicin, the two most powerful first-line\ndrugs.\n• Pair 2 is incorrectly matched. In Latent TB, the person has the bacteria in their body, but the immune system\nprevents them from multiplying. Therefore, the person is not symptomatic (correct) but cannot spread the\ndisease (incorrect in the pair). A person with Latent TB is not infectious.\n• Pair 3 is correctly matched. Active TB occurs when the immune system can no longer contain the bacteria.\nThe bacteria multiply, causing tissue damage (usually in the lungs). The person becomes symptomatic (fever,\nweight loss, cough) and can spread the bacteria to others through the air.\nWHO End TB Strategy, which aims for a 90% reduction in incidence by 2035. Proper diagnosis of Latent cases\nprevents them from progressing to Active cases, while managing Drug-Resistant cases requires more expensive\nand prolonged second-line antibiotic regimens."}, {"id": 85, "section": "Science and Technology", "question": "Consider the following statements regarding xenotransplantation:\n      1. It involves the transfer of live tissues or organs from one human to another.\n      2. It can address organ shortages by providing alternative sources from animals.\n      3. Gene editing in donor animals reduces the risk of organ rejection.\nHow many of the above statements are incorrect?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "a", "explanation": "•   Statement 1 is incorrect — xenotransplantation involves the transplantation of live tissues, organs, or cells\nfrom a non-human animal to a human, not from one human to another. The latter is called\nallotransplantation. Xenotransplantation represents a potential solution to the global shortage of human\ndonor organs, especially for vital organs such as the heart, liver, and kidneys.\n•   Statement 2 is correct — this is the central promise of xenotransplantation. By using genetically modified\nanimal organs (primarily from pigs due to their physiological similarities to humans), the technique could\nsignificantly reduce wait times and mortality rates for patients on transplant lists.\n•   Statement 3 is also correct — gene-editing tools such as CRISPR-Cas9 are used to eliminate or modify\nspecific pig genes that trigger immune responses in humans. These genetic alterations reduce the likelihood\nof hyperacute or delayed rejection, increasing the viability of animal-to-human transplants."}, {"id": 86, "section": "Science and Technology", "question": "Consider the following statements regarding 6G technology:\n      1. Terahertz frequencies in 6G enable faster data transfer but can only travel short distances.\n      2. Integrated Intelligent Reflecting Surfaces (IIRS) improve signal quality in areas with weak reception.\n\n\n\n                                                                          3. Massive MIMO (Multiple Input Multiple Output) technology uses multiple antennas to enhance data\n      transmission, supporting numerous devices simultaneously.\nHow many of the above statements are correct?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "c", "explanation": "Terahertz (THz) frequencies are extremely high-frequency waves that can carry massive amounts of data,\nthough they suffer from limited range, making them suitable for specific, localized applications or indoor\nenvironments.\nIntegrated Intelligent Reflecting Surfaces (IIRS) help boost signal quality by reflecting signals towards areas with\nlow coverage, ensuring stronger and more reliable connections.\nMassive MIMO (Multiple Input Multiple Output) technology enhances the capacity and efficiency of wireless\nnetworks by using multiple antennas to support a higher number of simultaneous connections, which is crucial\nfor the expansive connectivity needs of 6G."}, {"id": 87, "section": "Science and Technology", "question": "In the context of 'Nd-Fe-B' Rare Earth Permanent Magnets, consider the following statements:\n        1. They are the strongest type of permanent magnets commercially available, categorized as 'sup
