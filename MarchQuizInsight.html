 Gulf region, which of the following events would\n    typically qualify for such a clause?\n         1. A sudden increase in the market price of oil making the contract less profitable.\n         2. A naval blockade or war preventing the safe passage of tankers.\n         3. Damage to infrastructure caused by a targeted missile attack.\n         4. A company's inability to deliver due to a labor strike caused by poor management.\nSelect the correct answer using the code given below:", "options": {"a": "1 and 4 only", "b": "2, 3 and 4 only", "c": "1, 2 and 3 only", "d": "2 and 3 only"}, "correct": "d", "explanation": "•   Force majeure refers to extraordinary events beyond the reasonable control of contracting parties that\nprevent the fulfilment of contractual obligations. These events must be unforeseeable, unavoidable, and not\nattributable to the fault or negligence of the parties involved.\n•   Statement 1 is incorrect because economic hardship, such as a rise in oil prices, does not qualify as force\nmajeure. Commercial risk is inherent in contracts, and price fluctuations are generally foreseeable market\ndynamics.\n•   Statement 2 is correct since war, naval blockades, or geopolitical conflict directly disrupt logistics and are\nclassic examples of force majeure events. These situations make contract performance physically or legally\nimpossible.\n•   Statement 3 is also correct because targeted missile attacks damaging infrastructure fall under “acts of war”\nor “acts of external aggression,” which are universally recognized as force majeure conditions.\n•   Statement 4 is incorrect because labor strikes arising from poor management are considered internal and\navoidable issues. For a strike to qualify, it must be external, widespread, and not attributable to the\ncompany’s own actions."}, {"id": 226, "section": "Miscellaneous", "question": "Consider the following statements regarding the National Mineral Development Corporation (NMDC):\n       1. It is a Maharatna Central Public Sector Enterprise operating under the Ministry of Mines.\n       2. It operates India’s only mechanized diamond mine, located in the state of Madhya Pradesh.\n       3. NMDC has a dedicated R&D center in Hyderabad which is recognized as a Centre of Excellence by a\n            UN body.\nWhich of the above statements are correct?", "options": {"a": "1 and 2 only", "b": "1 and 3 only", "c": "1, 2 and 3", "d": "2 and 3 only"}, "correct": "d", "explanation": "•   Statement 1 is incorrect: NMDC is a Navratna CPSE, not a Maharatna. Furthermore, it operates under the\nMinistry of Steel, not the Ministry of Mines. This distinction is important as NMDC is the primary supplier of\niron ore to the Indian steel industry.\n•   Statement 2 is correct: NMDC operates the country’s only mechanized diamond mine at Panna, Madhya\nPradesh. This makes it a unique entity in India's mineral map, diversifying beyond iron ore.\n•   Statement 3 is correct: NMDC maintains a state-of-the-art R&D center in Hyderabad, which has been\nrecognized as a Centre of Excellence by the United Nations Industrial Development Organization (UNIDO).\nThis center focuses on mineral processing, flow sheet development, and sustainable mining technologies.\n•   NMDC’s role is strategic because it supports the goal of reaching 300 MT steel production capacity by 2030.\nBy producing 50 million tonnes of iron ore in FY 2025–26, NMDC has demonstrated its capacity to meet the\ngrowing raw material demands of the domestic industrial sector while adhering to scientific mining practices."}, {"id": 227, "section": "Miscellaneous", "question": "The \"Kamalondo Depression\" and \"Lake Upemba\" are significant geographical features located in which of the\n   following countries?", "options": {"a": "Ethiopia", "b": "Democratic Republic of the Congo", "c": "Tanzania", "d": "Nigeria"}, "correct": "b", "explanation": "•   The Kamalondo Depression and Lake Upemba are core components of the Upemba National Park, which is\nlocated in the Democratic Republic of the Congo (DRC). Specifically, they are situated in the southeastern\nprovinces of the country, including Haut-Lomami and Lualaba.\n•   The Kamalondo Depression is a vast wetland area characterized by over 80 interconnected lakes, with Lake\nUpemba being the largest. This region is ecologically vital because it supports a high degree of fish endemism\nand serves as a major habitat for diverse bird species and aquatic life.\n•   Geographically, it is part of the upper Congo River basin, and the depression itself is a structural feature of\nthe African Rift system's western branches. The preservation of these wetlands is a primary goal of the\nnational park, as they regulate water flow and support the livelihoods of local communities while acting as a\nsanctuary for wildlife in one of Africa's most biodiverse yet politically unstable regions."}, {"id": 228, "section": "Miscellaneous", "question": "Consider the following statements regarding the Centre for Development of Telematics (C-DOT) and its recent\n    developments:\n       1. C-DOT has developed an AI-driven fraud detection solution named 'Fraud Pro'.\n       2. It functions as a public-private partnership (PPP) model where 51% of equity is held by private\n            telecom giants.\n       3. The organization played a crucial role in expanding rural telecommunication access through\n            indigenous rural exchanges.\n       4. It is currently involved in developing next-generation technologies like 5G and BharatNet\n            infrastructure.\nHow many of the above statements are correct?", "options": {"a": "Only one", "b": "Only two", "c": "Only three", "d": "All four"}, "correct": "c", "explanation": "•   C-DOT remains a pillar of India's technological sovereignty.\n•   Statement 1 is correct as C-DOT recently received global recognition at the Mobile World Congress 2026\nfor its AI-driven solution, 'Fraud Pro', which helps in detecting telecom-related frauds.\n•   Statement 2 is incorrect because C-DOT is not a PPP; it is an autonomous R&D organization under the\nDepartment of Telecommunications, Government of India. It is a 100% government-funded society.\n•   Statement 3 is correct; historically, C-DOT's greatest achievement was the design of digital switching\nsystems specifically for rural India, which could operate without air conditioning and handled the power\nfluctuations common in villages.\n•   Statement 4 is correct as C-DOT continues to lead national digital programmes, contributing to BharatNet\n(rural broadband), 5G development, and cybersecurity. Its technology transfer model is unique because\nit doesn't just build technology but shares the blueprints with Indian manufacturers, thus creating a self-\nreliant manufacturing ecosystem. This reduces the outflow of foreign exchange and ensures that India's\ncritical communication infrastructure is built on trusted, indigenous foundations."}, {"id": 229, "section": "Miscellaneous", "question": "With reference to the Centre for Development of Telematics (C-DOT), consider the following statements:\n       1. It is a statutory body established under the Telecom Regulatory Authority of India Act.\n       2. It operates as an autonomous research and development centre under the Department of\n            Telecommunications.\n       3. The organization is primarily focused on importing and adapting foreign telecom technologies for the\n            Indian market.\nHow many of the above statements are correct?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "a", "explanation": "•   The Centre for Development of Telematics (C-DOT) is the cornerstone of India's indigenous telecom\nrevolution. It was established in August 1984 with a specific mandate to foster self-reliance.\n• Statement 1 is incorrect because C-DOT is not a statutory body under the TRAI Act; rather, it is registered\nas a society under the Societies Registration Act, 1860. It is recognized as a Public Funded Research\nInstitution.\n• Statement 2 is correct as it functions as an autonomous telecom technology centre under the\nDepartment of Telecommunications (DoT), Ministry of Communications.\n• Statement 3 is incorrect because C-DOT's core mission is the opposite of importing technology; its goal is\nto design and develop indigenous telecom technologies to reduce dependence on foreign vendors.\nHistorically, C-DOT is credited with developing rural telecom exchanges that were rugged enough to\nsurvive India's diverse climatic conditions without expensive air conditioning.\nToday, it works on cutting-edge solutions like 5G, AI-based network management (such as the 'Fraud Pro'\nsolution), and IoT. By using a technology transfer model, C-DOT empowers domestic manufacturers, thereby\ncreating a robust local ecosystem for telecom infrastructure and supporting national programmes like Digital\nIndia and BharatNet."}, {"id": 230, "section": "Miscellaneous", "question": "In the context of Indian administration, \"The Blue Book\" is primarily concerned with:", "options": {"a": "Guidelines for the preparation of the Union Budget.", "b": "Procedures and protocols for the security and reception of high constitutional dignitaries.", "c": "Environmental standards for the decommissioning of coal-based power plants.", "d": "Rules of procedure and conduct of business in the Rajya Sabha."}, "correct": "b", "explanation": "•   The Blue Book is a crucial, though often confidential, manual in Indian governance. It is not related to\neconomics or environmental standards; rather, it is a security and protocol manual issued by the Union\nMinistry of Home Affairs (MHA). It outlines the exhaustive procedures to be followed during the visits of the\nPresident, Vice-President, and Prime Minister within the country.\n•   The manual covers everything from the reception protocol (who receives the dignitary at the airport) to\nlogistical details like transport, crowd management, and venue security.\n•   The Blue Book ensures that the dignity and safety of India's top three constitutional authorities are\nmaintained uniformly across all states. It is maintained at the district level by the District Magistrate and the\npolice chief to ensure seamless coordination between the State and the Centre during high-profile visits."}, {"id": 231, "section": "Miscellaneous", "question": "Consider the following statements regarding hydrogen fuel cells in the transport sector:\n       1. Hydrogen fuel cell vehicles produce zero emissions, emitting only water vapour as a by-product.\n       2. Hydrogen fuel cells offer a longer range and faster refuelling compared to battery electric vehicles.\n       3. Hydrogen fuel cells increase energy consumption compared to traditional combustion engines.\nHow many of the above statements is/are incorrect?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "a", "explanation": "Statements 1 and 2 are correct. Hydrogen fuel cells in vehicles produce zero emissions, making them\nenvironmentally friendly. They emit only water vapour as a by-product. Additionally, hydrogen fuel cells provide\nlonger driving ranges and faster refuelling times compared to battery electric vehicles.\nHowever, statement 3 is incorrect because hydrogen fuel cells increase energy efficiency compared to traditional\ncombustion engines, not energy consumption."}, {"id": 232, "section": "Miscellaneous", "question": "The \"Brahminy Duck\", recently seen in the news for its community-led protection in Ladakh, is the common\n    name for:", "options": {"a": "Bar-headed Goose", "b": "Ruddy Shelduck", "c": "Black-necked Crane", "d": "Great Crested Grebe"}, "correct": "b", "explanation": "•   The Ruddy Shelduck is widely known in the Indian subcontinent as the Brahminy duck. This species has\ngained recent attention due to the conservation efforts of the residents of Mudh village in Ladakh. For over\ntwenty years, the villagers have protected these birds, particularly during the breeding season. Since the\nducks nest in high-altitude areas, the villagers help \"escort\" the young fledglings safely to the Indus River to\nprotect them from predators and ensure their survival.\n•   This bird is easily identifiable by its distinctive orange-brown (ruddy) plumage and its creamy white head. It is\na large waterfowl that belongs to the family Anatidae. Although it is a migratory bird that winters in various\nparts of South Asia, Ladakh is its primary and only known breeding site within India. Its presence in high-\naltitude wetlands makes it an important indicator of ecosystem health. The bird also holds significant\nspiritual value in the region, appearing frequently in folklore and being protected due to its status as a symbol\nof fidelity in Buddhist traditions."}, {"id": 233, "section": "Miscellaneous", "question": "Consider the following statements regarding the use of helium in rockets:\n       1. Helium is used to pressurize fuel tanks in rockets because it remains a gas even at very low\n       temperatures.\n       2. Helium is highly reactive and ensures that the fuel burns efficiently in rocket engines.\n\n\n                                                                             3. Alternatives like argon and nitrogen are commonly used instead of helium due to their lower costs.\nHow many of the above statements is/are incorrect?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "b", "explanation": "•   Helium plays a crucial role in rocketry, particularly in pressurizing fuel tanks. Unlike most gases, helium\nremains in a gaseous state even at extremely low temperatures, making it ideal for maintaining pressure in\ncryogenic fuel tanks that store liquid hydrogen and liquid oxygen. This ensures a steady and controlled flow\nof fuel into the rocket engines, preventing tank collapse due to external pressure.\n•   Statement 2 is incorrect because helium is an inert gas—it does not react with fuel or contribute to\ncombustion. Its primary role is maintaining pressure and purging systems, not enhancing fuel efficiency.\n•   Statement 3 is also incorrect because, despite its high cost, helium remains the preferred choice in the space\nindustry due to its unique properties. While argon and nitrogen have been explored, they are less effective\nfor critical space applications."}];

// ── State ──
const STORAGE_KEY = 'insights_quiz_v1';
let answers = {}; // { qId: { chosen, correct } }
let lastQId = null;

function saveState() {
  const state = { answers, lastQId };
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch(e) { return null; }
}

// ── Build DOM ──
function buildQuiz() {
  const sections = {};
  QUESTIONS.forEach(q => {
    if (!sections[q.section]) sections[q.section] = [];
    sections[q.section].push(q);
  });

  const main = document.getElementById('quiz-main');
  const nav = document.getElementById('section-nav');
  const sectionKeys = Object.keys(sections);

  sectionKeys.forEach((sec, si) => {
    const qs = sections[sec];
    const secId = 'sec-' + si;

    // Sidebar nav
    const li = document.createElement('li');
    li.innerHTML = `<a href="#${secId}" id="nav-${secId}">
      <span style="font-size:0.7rem;opacity:0.5">${String(si+1).padStart(2,'0')}</span>
      ${sec}
      <span class="sec-count">${qs.length}</span>
    </a>`;
    nav.appendChild(li);

    // Section block
    const section = document.createElement('section');
    section.className = 'quiz-section';
    section.id = secId;
    section.setAttribute('data-section', sec);

    section.innerHTML = `
      <div class="section-heading">
        <div class="section-icon">${si+1}</div>
        <h2>${sec}</h2>
        <div class="sec-stats" id="stats-${secId}">0 / ${qs.length} answered</div>
      </div>`;

    qs.forEach(q => {
      const card = buildCard(q);
      section.appendChild(card);
    });

    main.appendChild(section);
  });

  // Intersection Observer for active sidebar nav
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        const id = e.target.id;
        document.querySelectorAll('.section-nav a').forEach(a => a.classList.remove('active'));
        const link = document.getElementById('nav-' + id);
        if (link) link.classList.add('active');
      }
    });
  }, { rootMargin: '-40% 0px -55% 0px' });

  document.querySelectorAll('.quiz-section').forEach(s => observer.observe(s));
}

function buildCard(q) {
  const card = document.createElement('div');
  card.className = 'q-card';
  card.id = 'q-' + q.id;

  const optionsHtml = Object.entries(q.options).map(([k, v]) =>
    `<button class="opt-btn" data-qid="${q.id}" data-opt="${k}" onclick="handleAnswer(${q.id},'${k}')">
      <span class="opt-label">${k.toUpperCase()}.</span>
      <span>${escHtml(v)}</span>
      <span class="indicator"></span>
    </button>`
  ).join('');

  card.innerHTML = `
    <div class="q-header">
      <div class="q-num">${q.id}.</div>
      <div class="q-text">${escHtml(q.question)}</div>
    </div>
    <div class="q-body">
      <div class="options" id="opts-${q.id}">${optionsHtml}</div>
      <div class="explanation" id="expl-${q.id}">
        <div class="explanation-label">Explanation</div>
        ${escHtml(q.explanation)}
      </div>
    </div>`;
  return card;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Answer Handling ──
function handleAnswer(qId, chosen) {
  const q = QUESTIONS.find(x => x.id === qId);
  if (!q) return;
  if (answers[qId]) return; // already answered

  const isCorrect = chosen === q.correct;
  answers[qId] = { chosen, correct: q.correct, isCorrect };
  lastQId = qId;
  saveState();

  // Style buttons
  const container = document.getElementById('opts-' + qId);
  container.querySelectorAll('.opt-btn').forEach(btn => {
    btn.disabled = true;
    const opt = btn.dataset.opt;
    if (opt === q.correct) {
      btn.classList.add(chosen === q.correct ? 'correct' : 'reveal-correct');
      btn.querySelector('.indicator').textContent = '✓';
    } else if (opt === chosen && !isCorrect) {
      btn.classList.add('wrong');
      btn.querySelector('.indicator').textContent = '✗';
    }
  });

  // Show explanation
  document.getElementById('expl-' + qId).classList.add('visible');

  // Update stats
  updateStats();
}

function updateStats() {
  const total = Object.keys(answers).length;
  const correct = Object.values(answers).filter(a => a.isCorrect).length;
  document.getElementById('score-display').textContent = `${correct}/${total}`;
  const pct = total / QUESTIONS.length * 100;
  document.getElementById('progress-bar').style.width = pct + '%';

  // Per-section stats
  const sections = {};
  QUESTIONS.forEach(q => {
    if (!sections[q.section]) sections[q.section] = { total: 0, done: 0 };
    sections[q.section].total++;
    if (answers[q.id]) sections[q.section].done++;
  });
  document.querySelectorAll('.quiz-section').forEach((sec, si) => {
    const sname = sec.getAttribute('data-section');
    const s = sections[sname];
    const el = document.getElementById('stats-' + sec.id);
    if (el && s) el.textContent = `${s.done} / ${s.total} answered`;
  });
}

function restoreAnswers(savedAnswers) {
  Object.entries(savedAnswers).forEach(([qIdStr, ans]) => {
    const qId = parseInt(qIdStr);
    const q = QUESTIONS.find(x => x.id === qId);
    if (!q) return;
    answers[qId] = ans;

    const container = document.getElementById('opts-' + qId);
    if (!container) return;
    container.querySelectorAll('.opt-btn').forEach(btn => {
      btn.disabled = true;
      const opt = btn.dataset.opt;
      if (opt === q.correct) {
        btn.classList.add(ans.chosen === q.correct ? 'correct' : 'reveal-correct');
        btn.querySelector('.indicator').textContent = '✓';
      } else if (opt === ans.chosen && !ans.isCorrect) {
        btn.classList.add('wrong');
        btn.querySelector('.indicator').textContent = '✗';
      }
    });
    document.getElementById('expl-' + qId)?.classList.add('visible');
  });
  updateStats();
}

// ── Resume Banner ──
function showRestoreBanner(lastId, count) {
  document.getElementById('restore-sub').textContent = `You've answered ${count} question${count!==1?'s':''}.`;
  document.getElementById('restore-q-num').textContent = lastId;
  const banner = document.getElementById('restore-banner');
  banner.style.display = 'block';
}

function resumeSession() {
  dismissBanner();
  if (lastQId) {
    const el = document.getElementById('q-' + lastQId);
    if (el) {
      setTimeout(() => {
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        el.style.transition = 'box-shadow 0.3s';
        el.style.boxShadow = '0 0 0 3px rgba(200,67,10,0.3)';
        setTimeout(() => el.style.boxShadow = '', 1800);
      }, 100);
    }
  }
}

function dismissBanner() {
  document.getElementById('restore-banner').style.display = 'none';
}

// ── Init ──
buildQuiz();

const saved = loadState();
if (saved && saved.answers && Object.keys(saved.answers).length > 0) {
  lastQId = saved.lastQId;
  restoreAnswers(saved.answers);
  const count = Object.keys(saved.answers).length;
  showRestoreBanner(lastQId, count);
}
</script>
