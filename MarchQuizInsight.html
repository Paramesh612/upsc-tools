 wax, artisans could achieve intricate details and fluid movement that were impossible with\nstone.\n•   Furthermore, the transition from stone to portable bronze icons was driven by the festival theology of the\nChola period. Unlike the stationary stone deities in the garbhagriha (sanctum), bronze icons were designed\nfor public darshan and elaborate temple processions. The technical mastery of the sthapathis allowed for the\ncreation of \"living ritual icons\" that were anatomically refined and balanced. This synergy between the\ntechnical affordances of the lost-wax process and the socio-religious demand for processional deities is what\ndefines the Chola culmination. Even today, centers like Swamimalai continue this hereditary tradition, linking\nmedieval craft with contemporary heritage economies through the same ancient casting methods."}, {"id": 178, "section": "History, Art and Culture", "question": "Consider the following statements regarding Megalithic culture in South India:\n       1. The rock-cut chambers were primarily used as primary burial sites for the newly deceased.\n       2. These structures demonstrate the early use of iron tools for carving hard rock surfaces.\n       3. The presence of a small circular hole (aperture) at the top of the chambers is a common feature.\nWhich of the statements given above are correct?", "options": {"a": "1 and 2 only", "b": "1 and 3 only", "c": "2 and 3 only", "d": "1, 2 and 3"}, "correct": "c", "explanation": "•   Statement 1 is incorrect because these chambers were primarily used for secondary burial. In this practice,\nthe body was first decomposed or buried elsewhere, and later the bones were collected and placed in these\nsubterranean laterite chambers.\n•   Statement 2 is correct. The ability to carve intricate circular chambers and shafts into laterite rock is evidence\nof the Megalithic communities' mastery over iron tools, marking the transition from the Neolithic to the Iron\nAge.\n•   Statement 3 is correct. Many of these finds, including the recent one in Panayal (Kerala), feature a small top\naperture (around 5 cm), which archaeologists believe served ritualistic purposes, such as making offerings to\nthe deceased or allowing the spirit to exit."}, {"id": 179, "section": "History, Art and Culture", "question": "Consider the following statements regarding the UNESCO Tentative List:\n       1. It is a mandatory step before a site can be nominated for the World Heritage List.\n       2. A country can only submit one site per year for inclusion in the Tentative List.\n       3. The Tentative List is reviewed every 10 years, allowing for modifications.\nHow many of the above statements is/are incorrect?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "a", "explanation": "Explanation:\n• Statement 1 is correct – A site must be on the Tentative List for at least one year before being officially\nnominated.\n• Statement 2 is incorrect – There is no limit on the number of sites a country can submit to the Tentative\nList.\n• Statement 3 is correct – The list undergoes periodic revisions every 10 years.\nWhat is the Tentative List?\n• An inventory of cultural and natural heritage sites that a country intends to nominate for UNESCO\nWorld Heritage status.\nHow Are Sites Added?\n• Countries submit Tentative Lists to the World Heritage Centre.\n• A site must demonstrate Outstanding Universal Value (OUV).\n• The list must be submitted at least one year before official nomination.\n• Periodic revisions are encouraged every 10 years."}, {"id": 180, "section": "Agriculture", "question": "Match the following tribal crafts/textiles associated with the RISA: Timeless Tribal brand with their respective\n    regions:\n Craft/Textile     Region\n1. Eri Silk           A. Ladakh\n2. Pashmina           B. Assam\n3. Dokhra Art         C. Tamil Nadu\n 4. Toda Embroidery D. Chhattisgarh\nSelect the correct answer using the code given below:", "options": {"a": "1-B, 2-A, 3-C, 4-D", "b": "1-A, 2-B, 3-C, 4-D", "c": "1-B, 2-A, 3-D, 4-C", "d": "1-D, 2-C, 3-B, 4-A"}, "correct": "c", "explanation": "The RISA: Timeless Tribal brand, launched by the Ministry of Tribal Affairs and implemented by TRIFED, aims to\nposition indigenous crafts in the premium global market. It involves specific regional specialties that have high\ncultural and commercial value.\n• Eri Silk (Assam): Often called the \"fabric of peace\" because the silk is processed without killing the\nsilkworm, it is a staple of Assamese tribal culture.\n• Pashmina (Ladakh): Known for its extreme fineness and warmth, Pashmina is harvested from the\nChangthangi goat in the high altitudes of Ladakh.\n• Dokhra Art (Chhattisgarh): This is a non-ferrous metal casting using the lost-wax casting technique,\nwhich has been used in India for over 4,000 years. It is synonymous with the tribal heartlands of\nChhattisgarh and Odisha.\n• Toda Embroidery (Tamil Nadu): Practiced by the Toda pastoral tribe in the Nilgiris, this unique\nembroidery involves distinct red and black geometric patterns on a white background.\nThe RISA initiative provides design intervention and modern packaging to these traditional crafts, ensuring that\nthe Vocal for Local movement translates into sustainable livelihoods for tribal women and artisans across these\ndiverse geographical clusters."}, {"id": 181, "section": "Agriculture", "question": "Which of the following best describes the nutraceutical significance of Assam’s GI-tagged Joha rice?", "options": {"a": "It contains high levels of Vitamin A specifically engineered to combat night blindness.", "b": "It acts as a primary source of gluten-free proteins used in the production of infant formula.", "c": "It is a salt-tolerant variety developed for the coastal regions of the Northeast.", "d": "It is characterized by the presence of essential fatty acids like omega-3 and omega-6, along with anti-\ndiabetic properties."}, "correct": "d", "explanation": "•   Joha rice is not merely a staple grain but a \"functional food\" due to its rich biochemical profile. Unlike\ncommon white rice, Joha rice is a short-grain aromatic variety that possesses unique nutraceutical\nproperties. Research has confirmed that it contains significant amounts of omega-3 and omega-6 fatty acids,\nwhich are typically associated with fish oils and are crucial for cardiovascular health. Furthermore, it is rich in\nantioxidants, flavonoids, and phenolic compounds.\n•   One of its most significant health benefits is its potential anti-diabetic and cardio-protective properties. This\nis attributed to bioactive compounds such as oryzanol, ferulic acid, and tocotrienols. These compounds help\nin managing blood glucose levels and protecting the heart from oxidative stress. Since it received the\nGeographical Indication (GI) status in 2017, its traditional cultivation in Assam has gained international\nrecognition.\n•   The rice is traditionally grown during the Sali (winter) season, primarily in Upper and Central Assam.\nPromoting such niche products in global markets, like the recent exports to the UK and Italy, not only helps in\nIndia's agricultural diplomacy but also ensures premium pricing for local farmers who maintain these\ntraditional agricultural systems."}, {"id": 182, "section": "Agriculture", "question": "With reference to jute trade and production, consider the following statements:\n      1. Jute is known as the 'golden fibre' due to its high commercial value.\n      2. Bangladesh has more acreage under jute cultivation than India.\n      3. The Jute Corporation of India (JCI) is responsible for promoting jute cultivation in India.\nHow many of the above statements is/are correct?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "c", "explanation": "Jute is referred to as the 'golden fibre' due to its versatility and economic importance, making statement 1\ncorrect.\nBangladesh has more acreage under jute cultivation, making statement 2 correct.\nThe Jute Corporation of India (JCI) plays a role in promoting jute production and ensuring farmers receive a fair\nprice, making statement 3 correct."}, {"id": 183, "section": "Agriculture", "question": "Consider the following statements regarding the use of green hydrogen in agriculture:\n      1. Green hydrogen can be used to produce carbon-free ammonia, reducing reliance on fossil fuels for\n      fertilizer production.\n      2. Green hydrogen-powered farm machinery, such as tractors and harvesters, can help reduce\n      greenhouse gas emissions in the agriculture sector.\n      3. Green ammonia produced from green hydrogen increases soil acidity, making it less efficient than\n      traditional fertilizers.\nHow many of the above statements is/are correct?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "b", "explanation": "Statements 1 and 2 are correct. Green hydrogen can be used to produce carbon-free ammonia, reducing the\nagricultural sector's dependence on fossil fuels for fertilizer production. This also helps in reducing greenhouse\ngas emissions. Additionally, green hydrogen can be used to power farm machinery, further decreasing the carbon\nfootprint.\nHowever, statement 3 is incorrect—green ammonia does not increase soil acidity but rather offers improved\nefficiency compared to traditional ammonia."}, {"id": 184, "section": "Agriculture", "question": "Consider the following statements regarding Karbi Anglong Ginger:\n      1. It has been granted a Geographical Indication (GI) tag.\n      2. It is cultivated primarily using the traditional Jhum and Tila methods.\n      3. The variety is characterized by low essential oil content and a mild aroma.\n      4. The Singhasan Hills in Assam serve as a major cultivation hub for this ginger.\nHow many of the above statements are correct?", "options": {"a": "Only one", "b": "Only two", "c": "Only three", "d": "All four"}, "correct": "c", "explanation": "•   Statement 1 is correct. Karbi Anglong Ginger is a high-quality agricultural product from Assam that has\nreceived the Geographical Indication (GI) tag.\n•   Statement 2 is incorrect. It is renowned for its strong pungency and distinct aroma, which stems from its\nhigh essential oil content. The ginger is highly sought after in the pharmaceutical and culinary industries\nprecisely because of these potent chemical properties.\n•   Statements 2 and 4 are correct. The cultivation is concentrated in the Karbi Anglong district, particularly\nwithin the Singhasan Hills. Farmers in this region largely adhere to organic and traditional farming practices,\nsuch as Jhum (shifting cultivation) and Tila cultivation. These age-old methods are credited with maintaining\nthe natural quality and medicinal value of the ginger.\n•   The recent trial export of this ginger to London signifies a major step in India’s strategy to promote region-\nspecific, value-added agricultural exports. By leveraging the GI tag, local farmers can ensure better price\nrealization in international markets, highlighting the role of traditional knowledge in modern global trade."}, {"id": 185, "section": "Agriculture", "question": "Consider the following statements regarding the APEDA’s export promotion initiatives:\n       1. APEDA provides financial assistance to exporters under the Agriculture Export Promotion Fund to\n       enhance international competitiveness.\n       2. APEDA promotes the Geographical Indication (GI) tagging of agricultural products for brand recognition\n       in global markets.\nWhich of the above statements is/are incorrect?", "options": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "correct": "d", "explanation": "Statement 1 is correct – APEDA provides financial assistance to exporters under various schemes, such as the\nAgriculture Export Promotion Fund and the Market Development Assistance (MDA) Scheme, to improve\ninternational competitiveness.\nStatement 3 is correct – APEDA promotes the Geographical Indication (GI) tagging of agricultural products such as\nAlphonso mangoes, Basmati rice, and Darjeeling tea to enhance their global market recognition and branding.\nWhat is APEDA?\n• APEDA (Agricultural and Processed Food Products Export Development Authority) is a statutory\nbody established under the APEDA Act, 1985.\n• It functions under the Ministry of Commerce & Industry, Government of India.\n• Headquarters: New Delhi, India.\nStructure of APEDA\n• Chairman: Appointed by the Government of India.\n• Advisory Board: Comprises exporters, farmers, industry experts, and government representatives.\n• Regional Offices: Located in Mumbai, Kolkata, Bangalore, Hyderabad, Guwahati to support exporters.\nFunctions of APEDA\n• Export Promotion & Development: Facilitates agricultural and processed food exports.\no Supports market research, branding, and export certification.\n• Quality Standards & Certification: Regulates quality control and packaging of export products.\no Implements Good Agricultural Practices (GAP) and Organic Farming Standards.\n• Financial Assistance to Exporters: Provides subsidies and incentives for exporters and food processors.\no Supports cold chain infrastructure development.\n• Market Expansion & Global Trade: Organizes international trade fairs and buyer-seller meets.\no Strengthens bilateral trade relations for agricultural exports."}, {"id": 186, "section": "Agriculture", "question": "Consider the following statements regarding Soil Fertility Mapping:\n      1. It involves the use of geospatial techniques, remote sensing, and AI-based models for soil analysis.\n      2. The mapping process focuses primarily on physical soil properties rather than nutrient composition.\n      3. It helps in the implementation of precision agriculture.\nHow many of the above statements is/are incorrect?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "a", "explanation": "Statement 1 is correct – Soil fertility mapping integrates remote sensing, geospatial tools, and AI-driven models\nfor high-accuracy soil health analysis.\nStatement 2 is incorrect – The mapping process prioritizes soil nutrient composition (NPK, sulfur, micronutrients)\nrather than just physical properties like texture and porosity.\nStatement 3 is correct – It supports precision agriculture by customizing fertilizer application based on real-time\nsoil fertility data.\nWhat is Soil Fertility Mapping?\n• It is a scientific method of assessing and visualizing soil nutrient composition across different regions.\n• Uses geospatial techniques, remote sensing, and AI-based tools to generate precise soil health data.\nBenefits of Soil Fertility Mapping\n• Precision Agriculture: Helps farmers identify nutrient deficiencies and surpluses.\no Enables targeted fertilizer application for better crop yield.\n• Cost-Efficient Farming: Reduces overuse and underuse of fertilizers, optimizing costs.\no Enhances soil productivity and economic returns for farmers.\n• Improved Soil Health Management: Encourages integrated nutrient management (INM).\no Promotes organic manures and bio-fertilizers for sustainable farming.\n• Environmental Sustainability: Minimizes soil degradation and nutrient depletion.\no Reduces chemical runoff and groundwater contamination.\n• Empowering Farmers: Soil Health Cards (SHC) provide customized recommendations.\no Farmers can download SHC data using mobile-based services."}, {"id": 187, "section": "Defence and Security", "question": "Which of the following best describes the primary operational advantage of the Tunguska Air Defence Missile\n    System (2K22M) over traditional single-armament systems?", "options": {"a": "It is the only system capable of engaging targets at altitudes exceeding 5,000 meters.", "b": "It functions as a man-portable system specifically for high-altitude mountain warfare.", "c": "It provides long-range ballistic missile defense for metropolitan strategic assets.", "d": "It utilizes a hybrid platform combining surface-to-air missiles and high-speed autocannons on a single\nchassis."}, "correct": "d", "explanation": "•   The Tunguska Air Defence Missile System (2K22M) is distinguished as a Soviet-origin, tracked, self-propelled\nanti-aircraft weapon system. Its primary innovation lies in its hybrid configuration, which integrates two\ndistinct types of weaponry: 9M311 missiles for long-range engagement (8–10 km) and twin 30 mm\nautocannons for close-in defense. This dual-armament approach allows it to provide comprehensive\nprotection to ground forces against a variety of threats, including attack helicopters, cruise missiles, and\nmodern tactical drones.\n•   Unlike systems that rely solely on missiles—which may have a \"dead zone\" at very close ranges—or guns—\nwhich have limited reach—the Tunguska fills the critical gap in low-altitude air defense. This makes it highly\neffective for protecting infantry and armored regiments while they are on the move. The system also\nfeatures a 360-degree radar and optical tracking backup, ensuring it can operate even under conditions of\nelectronic warfare jamming.\n•   It is not a man-portable system, nor is it designed for high-altitude ballistic defense; rather, it is a mobile\nshield for tactical army columns. India’s procurement of this system from Russia's JSC Rosoboronexport\nunderscores its strategic value in defending against modern swarm drone threats and precision-guided\nmunitions."}, {"id": 188, "section": "Defence and Security", "question": "Consider the following statements:\n        Statement-I: In India, the Central Excise duty on petrol and diesel is typically a specific-rate tax rather\nthan an ad valorem tax.\n\n\n                                                                               Statement-II: The Central Government adjusts excise duty to shield consumers and Oil Marketing\nCompanies (OMCs) from volatility in global crude prices.\nWhich one of the following is correct in respect of the above statements?", "options": {"a": "Both Statement-I and Statement-II are correct and Statement-II is the correct explanation for\nStatement-I", "b": "Both Statement-I and Statement-II are correct and Statement-II is not the correct explanation for\nStatement-I", "c": "Statement-I is correct but Statement-II is incorrect", "d": "Statement-I is incorrect but Statement-II is correct"}, "correct": "b", "explanation": "•   Statement-I is correct because the Central Excise Duty levied by the Union Government on fuel is usually a\nfixed-rate tax (a specific Rupee amount per litre), unlike the State Value Added Tax (VAT), which is ad\nvalorem (a percentage). This fixed nature means the tax revenue per litre remains constant for the center\nregardless of price fluctuations, unless the rate itself is changed.\n•   Statement-II is also correct; the government frequently slashes or increases this duty to manage the retail\nprice. For instance, the recent reduction of ₹10 per litre was intended to protect consumers and Oil\nMarketing Companies (OMCs) from rising global crude prices.\n•   However, Statement-II is not the explanation for Statement-I. The reason the tax is \"specific\" (Statement-I)\nrelates to administrative ease and revenue stability for the Union, whereas the \"adjustment of the tax\"\n(Statement-II) is a fiscal policy tool used for inflation management."}, {"id": 189, "section": "Defence and Security", "question": "In the context of Exercise Sea Dragon, consider the following statements:\n        1. It is a biennial land-based tactical exercise aimed at enhancing counter-insurgency operations.\n        2. The exercise primarily involves the use of long-range maritime patrol aircraft for anti-submarine\n             warfare.\n        3. Participation is restricted to the Quad nations (India, USA, Japan, and Australia) to ensure regional\n             security.\nHow many of the above statements are correct?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "a", "explanation": "•   Statement 1 is incorrect. Exercise Sea Dragon is an annual, not biennial, exercise. Furthermore, it is a\nmaritime anti-submarine warfare (ASW) exercise conducted in the Western Pacific, not a land-based\ncounter-insurgency drill. Its focus is on underwater surveillance and the detection of submarines.\n•   Statement 2 is correct. The hallmark of Sea Dragon is its focus on Maritime Patrol Aircraft (MPA).\nParticipants use advanced platforms like the P-8I (India), P-8A (USA), and P-1 (Japan). These aircraft are\nequipped with sophisticated sensors and sonobuoys to track simulated and live submarine targets. The\nexercise involves over 200 hours of flight training, emphasizing operational readiness in the aerial-\nmaritime interface.\n•   Statement 3 is incorrect. While the Quad nations (India, USA, Japan, and Australia) are regular\nparticipants, the exercise is not exclusively restricted to them. For instance, the Royal New Zealand Air\nForce also participates."}, {"id": 190, "section": "Defence and Security", "question": "Which of the following are the features of the \"Terminal High Altitude Area Defense\" (THAAD)?\n         1. It is a truck-mounted and highly mobile system.\n         2. It can engage targets both inside and outside the Earth’s atmosphere.\n         3. It integrates with other systems like Aegis and Patriot to create a multi-layered defense.\nSelect the correct answer using the code given below:", "options": {"a": "1 and 2 only", "b": "2 and 3 only", "c": "1 and 3 only", "d": "1, 2 and 3"}, "correct": "d", "explanation": "•   The THAAD system is designed for maximum flexibility and comprehensive protection.\n•   Statement 1 is correct because THAAD is truck-mounted, which makes it highly mobile. This allows the U.S.\nand its allies to rapidly deploy the system to various global flashpoints, such as West Asia or the Korean\nPeninsula, in response to emerging threats.\n•   Statement 2 is correct as it is an endo- and exo-atmospheric interceptor. This means it can hit missiles while\nthey are still high in space or as they re-enter the atmosphere, bridging the gap between low-altitude and\nhigh-altitude defense.\n•   Statement 3 is correct because THAAD is designed for interoperability. It can \"talk\" to and integrate with the\nPatriot (PAC-3) and Aegis systems. This integration creates a seamless, multi-layered \"defensive web,\" where\ndifferent systems cover different altitudes and ranges, ensuring that an incoming missile has a very low\nprobability of reaching its target. Such synergy is a cornerstone of modern integrated air and missile defense\n(IAMD) strategies."}, {"id": 191, "section": "Defence and Security", "question": "Consider the following statements regarding Operation Epic Fury:\n      1. It is a joint military campaign led by the European Union to secure maritime routes in the Persian\n           Gulf.\n      2. The operation specifically targets Iranian military infrastructure and strategic assets.\n      3. It was initiated in response to the operationalization of the Iron Beam defense system.\nHow many of the above statements are correct?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "a", "explanation": "•   Operation Epic Fury is a recent geopolitical development in West Asia.\n•   Statement 1 is incorrect because the operation is led by the United States (Pentagon) in coordination with\nIsrael, not the European Union. It represents a formalization of U.S. military strikes in the region.\n•   Statement 2 is correct; the campaign is aimed at neutralizing perceived threats from Iran’s military and\nmissile infrastructure, as well as constraining its nuclear capabilities.\n•   Statement 3 is incorrect; while the Iron Beam is part of the regional security context, Operation Epic Fury was\nnot \"caused\" by it. Instead, the operation is driven by long-standing disputes over Iran's nuclear program and\nregional influence. The operation highlights the escalating military confrontation between the U.S.–Israel\nalliance and Iran."}, {"id": 192, "section": "Defence and Security", "question": "Consider the following pairs:\n      | Defense System | Capability / Feature |\n      | 1. Iron Dome | Intercepts short-range rockets and mortars |\n      | 2. Arrow-3 | Operates within the atmosphere for mid-range threats |\n      | 3. Iron Beam | Uses high-energy lasers for low-cost interception |\n      | 4. David’s Sling | Designed for long-range intercontinental missiles |\nHow many of the above pairs are correctly matched?", "options": {"a": "Only one", "b": "Only two", "c": "Only three", "d": "All four"}, "correct": "b", "explanation": "•   Israel’s missile defense is a sophisticated multi-layered architecture.\n•   Pair 1 is correctly matched; the Iron Dome is the world's most famous short-range defense system.\n•   Pair 3 is also correctly matched; the Iron Beam is a newer directed-energy system that uses lasers to disable\nthreats like drones and rockets at a significantly lower cost per \"shot\" compared to traditional missiles.\n•   However, Pair 2 is incorrectly matched; while the Arrow system handles long-range threats, Arrow-3 is exo-\natmospheric (intercepts outside the atmosphere), whereas Arrow-2 operates within it.\n•   Pair 4 is incorrectly matched; David’s Sling is a mid-range interceptor (100–200 km) for cruise missiles and\naircraft, not for long-range intercontinental missiles (which are handled by the Arrow system)."}, {"id": 193, "section": "Defence and Security", "question": "In the context of Electronic Warfare, consider the following:\n        Statement-I: GPS spoofing is considered more dangerous and sophisticated than GPS jamming.\n        Statement-II: While jamming simply drowns out satellite signals with noise, spoofing deceives a receiver\n    into calculating a false location.\nWhich one of the following is correct in respect of the above statements?", "options": {"a": "Both Statement-I and Statement-II are correct and Statement-II is the correct explanation for\nStatement-I", "b": "Both Statement-I and Statement-II are correct and Statement-II is not the correct explanation for\nStatement-I", "c": "Statement-I is correct but Statement-II is incorrect", "d": "Statement-I is incorrect but Statement-II is correct"}, "correct": "a", "explanation": "•   Statement-I is correct. GPS spoofing is more dangerous because the operator of the vessel or aircraft may not\nimmediately realize the navigation data is compromised. In contrast, jamming creates a \"denial of service\"\nwhere the receiver simply stops working, alerting the operator to switch to manual navigation.\n•   Statement-II is the correct explanation for Statement-I. Jamming works by broadcasting high-power radio\nfrequency noise on the L1 and L2 bands, effectively \"blinding\" the receiver. Spoofing, however, involves\ntransmitting a fake GNSS signal that mimics the real one but with slight timing offsets. This leads the receiver\nto believe it is elsewhere—for example, a ship in the Strait of Hormuz might appear to be at an inland\nlocation. This deception can lead to fatal navigational errors or luring vessels into hostile waters, making it a\nhighly sophisticated tool of modern electronic warfare."}, {"id": 194, "section": "Defence and Security", "question": "With reference to the Terminal High Altitude Area Defense (THAAD), consider the following statements:\n      1. It is designed to intercept ballistic missiles specifically during their mid-course phase of flight.\n      2. The system employs hit-to-kill technology, relying on kinetic energy rather than explosive warheads\n           to destroy targets.\n\n\n\n                                                                              3. It serves as a defensive layer that bridges the operational gap between the Patriot and the Aegis\n            missile defense systems.\nWhich of the statements given above are correct?", "options": {"a": "1 and 2 only", "b": "1 and 3 only", "c": "2 and 3 only", "d": "1, 2 and 3"}, "correct": "c", "explanation": "•   The Terminal High Altitude Area Defense (THAAD) is a sophisticated surface-to-air missile system\ndeveloped by the United States.\n•   Statement 1 is incorrect because THAAD is specifically designed to intercept and destroy short, medium,\nand limited intermediate-range ballistic missiles during their terminal phase (the final stage of flight), not\nthe mid-course phase.\n•   Statement 2 is correct as THAAD utilizes \"hit-to-kill\" technology. This means the interceptor does not\ncarry a traditional fragmentation warhead; instead, it destroys the incoming threat through the sheer\nforce of impact (kinetic energy). This approach is preferred as it minimizes the risk of detonating\nconventional or nuclear payloads over populated areas.\n•   Statement 3 is correct because THAAD provides a multi-layered defense shield, engaging targets at higher\naltitudes than the Patriot system but lower than the exo-atmospheric Aegis system. It can engage targets\nboth inside and outside the Earth’s atmosphere (endo- and exo-atmospheric). This strategic placement\nfills a vital niche in the global ballistic missile defense architecture, ensuring that if a higher-tier system\nfails, THAAD serves as a robust secondary line of defense before the missile reaches the lower\natmosphere."}, {"id": 195, "section": "Defence and Security", "question": "The Kurds are widely described as:", "options": {"a": "The smallest ethnic group in Europe.", "b": "The world's largest stateless ethnic group.", "c": "A nomadic tribe found only in the Sahara Desert.", "d": "The primary ruling class of modern-day Turkey."}, "correct": "b", "explanation": "•   With a population of 30 to 40 million, the Kurds are considered the largest ethnic group in the world that\ndoes not have its own independent sovereign state. Their traditional homeland, Kurdistan, is split across four\ncountries: Turkey, Syria, Iraq, and Iran. While they have achieved some autonomy in Iraq (Kurdistan Regional\nGovernment), they remain a minority in the other nations, often leading to complex geopolitical struggles and\ndemands for self-determination."}, {"id": 196, "section": "Defence and Security", "question": "Which of the following describes the 'Gravity Bomb', recently mentioned in the news?", "options": {"a": "A self-propelled precision missile that uses internal engines to reach targets.", "b": "is the correct description. Unlike missiles (like the Tomahawk), which have engines to sustain\n    flight, a gravity bomb follows a ballistic trajectory determined by the release altitude, speed of the carrier\n    aircraft, and the force of gravity. In modern warfare, these are often converted into \"smart\" weapons using a\n    Joint Direct Attack Munition (JDAM) kit.\n\n\n\n                                                                                 •   The JDAM adds a GPS-guided tail section with steerable fins, allowing the bomb to glide toward precise\n    coordinates. The U.S. recently shifted toward using these (Mark 80 series) against targets where air defenses\n    are degraded, as they are significantly more cost-effective than missiles. For instance, a JDAM-equipped\n    bomb costs approximately $25,000, whereas a cruise missile can cost millions.\n•   These bombs come in various weights, such as the 500-lb Mk 82 for soft targets and the 2,000-lb Mk 84 for\n    \"bunker-busting\" operations. Their versatility and low cost allow for high-volume bombardment once air\n    supremacy is established by the attacking force.", "c": "A specialized underwater explosive used for degrading naval air defenses.", "d": "A high-altitude interceptor designed to neutralize satellite-based communication."}, "correct": "b", "explanation": "•   A gravity bomb, often termed a \"dumb bomb\" or free-fall bomb, is a munition that lacks an internal\npropulsion system.\n•   Statement (b) is the correct description. Unlike missiles (like the Tomahawk), which have engines to sustain\nflight, a gravity bomb follows a ballistic trajectory determined by the release altitude, speed of the carrier\naircraft, and the force of gravity. In modern warfare, these are often converted into \"smart\" weapons using a\nJoint Direct Attack Munition (JDAM) kit.\n•   The JDAM adds a GPS-guided tail section with steerable fins, allowing the bomb to glide toward precise\ncoordinates. The U.S. recently shifted toward using these (Mark 80 series) against targets where air defenses\nare degraded, as they are significantly more cost-effective than missiles. For instance, a JDAM-equipped\nbomb costs approximately $25,000, whereas a cruise missile can cost millions.\n•   These bombs come in various weights, such as the 500-lb Mk 82 for soft targets and the 2,000-lb Mk 84 for\n\"bunker-busting\" operations. Their versatility and low cost allow for high-volume bombardment once air\nsupremacy is established by the attacking force."}, {"id": 197, "section": "Defence and Security", "question": "Consider the following statements:\n         Statement I: Military action in international waters is generally restricted and must adhere to specific\nlegal justifications.\n         Statement II: Under the United Nations Convention on the Law of the Sea (UNCLOS), the high seas are\nreserved for peaceful purposes, though force may be used in self-defense.\nWhich one of the following is correct in respect of the above statements?", "options": {"a": "Both Statement-I and Statement-II are correct and Statement-II is the correct explanation for\nStatement-I", "b": "Both Statement-I and Statement-II are correct and Statement-II is not the correct explanation for\nStatement-I", "c": "Statement-I is correct but Statement-II is incorrect", "d": "Statement-I is incorrect but Statement-II is correct"}, "correct": "a", "explanation": "•   Both statements are correct and Statement II provides the legal rationale for Statement I. International\nwaters, or the High Seas, are areas beyond the 200-nautical-mile Exclusive Economic Zone where no state can\nclaim sovereignty. Because these areas are considered a Shared Global Commons, UNCLOS mandates under\nArticle 88 that they must be reserved for peaceful purposes. This creates a general restriction on military\naggression or the arbitrary use of force, supporting Statement I.\n•   Statement II explains the legal exceptions to this rule. While the principle is \"peaceful use,\" international law\nrecognizes the inherent right of self-defense and actions authorized by the UN Security Council. Therefore, a\nstate using force in international waters must justify its actions within these narrow legal corridors. The\ntension between the \"peaceful use\" mandate and real-world military strikes (such as the 2026 sinking of the\nIRIS Dena) raises significant questions about maritime security and the enforcement of UNCLOS. By defining\nthese zones and rights, UNCLOS seeks to prevent the oceans from becoming a theater of unregulated conflict,\nensuring that the Freedom of Navigation remains a reality for all nations."}, {"id": 198, "section": "Defence and Security", "question": "Consider the following statements regarding 'Operation Sankalp':\n       1. It was launched by the Indian Navy specifically to combat the rise of piracy in the Gulf of Guinea.\n       2. It provides a legal framework for the prosecution of pirates under the Maritime Anti-Piracy Act 2022.\n       3. It serves as a proactive measure to ensure the safe passage of Indian-flagged merchant vessels\n            through the Strait of Hormuz.\nHow many of the above statements are correct?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "a", "explanation": "•   Statement 1 is incorrect because Operation Sankalp is focused on the Gulf of Oman, the Strait of Hormuz,\nand the Gulf of Aden, rather than the Gulf of Guinea (which is off the coast of West Africa).\n•   Statement 2 is incorrect. While the operation is supported by the legal backing of the Maritime Anti-Piracy\nAct 2022, the operation itself is a military/maritime security initiative, not a law or a legal framework.\n•   Statement 3 is correct. Launched in 2019, the operation ensures the security of India's maritime trade,\nespecially oil imports (62% of which pass through this region). It positions the Indian Navy as a \"Preferred\nSecurity Partner\" and \"First Responder\" in the Indian Ocean Region. The deployment of destroyers and\nfrigates under this mission demonstrates India’s blue-water capability to protect national interests\nindependently amidst escalating regional tensions."}, {"id": 199, "section": "Defence and Security", "question": "With reference to the 'Shtil' missile system, consider the following statements:\n       1. It is a long-range surface-to-air missile system designed for land-based border defense.\n       2. It utilizes a Vertical Launch System (VLS), allowing for rapid-reaction engagements in multiple\n            directions.\n       3. The system is an indigenous development by DRDO to replace the aging Russian Buk missile family.\nHow many of the above statements are correct?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "a", "explanation": "•   Statement 1 is incorrect because Shtil is a medium-range naval surface-to-air missile (SAM) system, not a\nlong-range land-based system. It is specifically designed to protect frontline warships from aerial threats like\nanti-ship missiles and UAVs.\n•   Statement 2 is correct. The use of a Vertical Launch System (VLS) is a key feature, as it enables the missile to\nbe fired quickly without the need to rotate a launcher toward the target, which is critical for 360-degree\ndefense in modern maritime combat.\n•   Statement 3 is incorrect because the Shtil system was developed by Russian defense industries (based on the\nBuk missile family) and is not an indigenous DRDO product. India procures these to strengthen the layered air\ndefense of the Navy, complementing other systems like the Indo-Israeli Barak-8. This acquisition is vital for\nmaintaining security in the Indian Ocean Region (IOR)."}, {"id": 200, "section": "Defence and Security", "question": "Consider the following statements regarding the ‘Prahaar’ Anti-Terror Policy:\n       1. It marks India's transition to a reactive policing model for handling internal security threats.\n       2. It represents India’s first-ever integrated national counter-terrorism doctrine and strategy.\n       3. The policy is executed through a centralized mechanism that excludes the participation of state-level\n            security agencies.\nHow many of the above statements are correct?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "a", "explanation": "•   The Prahaar Anti-Terror Policy represents a landmark shift in India’s internal security architecture.\n•   Statement 1 is incorrect because the policy specifically marks a doctrinal shift from reactive policing to a\nproactive, intelligence-led model. Instead of simply responding to attacks after they occur, Prahaar focuses\non pre-emptive disruption of terror networks.\n•   Statement 2 is correct; it is indeed India’s first integrated national counter-terrorism policy, formalizing a\nunified framework for prevention, response, and recovery.\n•   Statement 3 is incorrect because the policy adopts a whole-of-government approach, which necessitates\nseamless coordination between central, state, and even district-level security agencies.\n•   The significance of Prahaar lies in its Seven-Pillar (PRAHAAR) framework, which addresses the entire lifecycle\nof terrorism, from radicalization and recruitment to financing and recovery. By targeting the terror ecosystem\n(logistics, cyber networks, and dark web), the policy acknowledges that modern terrorism is a hybrid threat. It\nintegrates human rights-based processes with technology-centric security to ensure that the rule of law is\nmaintained while neutralizing sophisticated threats like crypto-financing and drone warfare.\n•   This integrated strategy ensures that India’s response is no longer fragmented but structured under a single\nnational doctrine."}, {"id": 201, "section": "Defence and Security", "question": "What is the primary advantage of the Astra Beyond Visual Range Air-to-Air Missile (BVRAAM) over\n    conventional air-to-air missiles?", "options": {"a": "It is equipped with a nuclear warhead option, enhancing deterrence capabilities.", "b": "It can engage both aerial and ground targets using an advanced multi-mode seeker.", "c": "It has a longer range and higher speed, reducing the risk to the launching aircraft.", "d": "It has an unlimited range due to satellite-based guidance."}, "correct": "c", "explanation": "•   Option a is incorrect – Astra is not a nuclear-capable missile; it carries a high-explosive fragmentation\nwarhead.\n•   Option b is incorrect – Astra is strictly an air-to-air missile, and cannot engage ground targets.\n•   Option c is correct – Astra BVRAAM provides a stand-off capability, allowing the launching aircraft to\nengage targets from a safe distance beyond visual range.\n•   Option d is incorrect – The Astra missile has a range of 100+ km, but it is not unlimited; it relies on radar and\ninertial navigation systems, not satellites.\n•   What is Astra Missile?\no An advanced Beyond Visual Range Air-to-Air Missile (BVRAAM) designed for fighter aircraft.\no Enables aircraft to engage targets beyond 100 km without direct visual contact.\n•   Developed by:\no Defence Research and Development Organisation (DRDO), India.\no Manufactured by Bharat Dynamics Limited (BDL) under a ₹2,971 crore contract.\n•   Key Features:\no Altitude: Can engage targets at 20 km altitude.\no Range: Over 100 km, with high-speed precision targeting.\no Guidance System: Equipped with inertial navigation, mid-course updates, and active radar\nhoming for precise hits.\no Speed: Capable of Mach 4.5 (4.5 times the speed of sound).\no Integration: Already deployed on Su-30MKI, now being integrated with LCA Tejas & MiG-29.\no Combat Advantage: Provides large stand-off range, reducing pilot risk from enemy air defense."}, {"id": 202, "section": "Maps / Places", "question": "The 'Khondab' and 'Ardakan' facilities, recently in the news, are located in which country?", "options": {"a": "Israel", "b": "United Arab Emirates", "c": "Saudi Arabia", "d": "Iran"}, "correct": "d", "explanation": "•   The Khondab Heavy Water Complex and the Ardakan yellowcake plant are both critical components of\nIran’s nuclear program. Khondab, located near Arak in Central Iran, houses a heavy water production plant\nand a research reactor capable of producing plutonium.\n•   Ardakan, located in the Yazd Province, is Iran’s only facility for processing uranium ore into yellowcake\n(U3O8). These sites were recently targeted by Israeli Air Force strikes in an escalation of regional tensions.\n•   The strikes targeted the upstream components of the nuclear fuel cycle, aiming to delay Iran’s ability to\nproduce weapons-grade materials. This move was a shift from the usual \"shadow war\" of cyber-attacks to\ndirect kinetic strikes. International bodies like the IAEA (represented by Rafael Grossi) have expressed\nconcern over the safety of such attacks on nuclear-linked infrastructure. Despite the strikes, Iranian\nauthorities reported no radioactive leaks. Mapping these locations is important for understanding the Middle\nEast's geopolitical dynamics and the risks of a wider conflict involving proxies like Hezbollah and the Houthis."}, {"id": 203, "section": "Maps / Places", "question": "Match List-I (Mountain Pass/Location) with List-II (Strategic Connectivity):\n                  | List-I                 | List-II |\n         | A. Zojila Pass | 1. Connects Leh to the Nubra Valley |\n         | B. Fotu La | 2. Connects Kashmir Valley to Ladakh |\n         | C. Khardung La | 3. Highest point on the Srinagar–Leh Highway |\nSelect the correct answer using the code given below:", "options": {"a": "A-2, B-1, C-3", "b": "A-1, B-2, C-3", "c": "A-2, B-3, C-1", "d": "A-3, B-2, C-1"}, "correct": "c", "explanation": "•   Zojila Pass is a strategic high mountain pass in the Western Himalayas situated at an elevation of\napproximately 3,580 metres. It serves as the vital terrestrial link between the Kashmir Valley (Sonmarg) and\nthe Ladakh region (Dras and Kargil). Therefore, A matches with 2.\n•   Fotu La is located on the Srinagar–Leh Highway and is significant for being the highest point on that specific\nroute (at an elevation of 4,108 metres), surpassing Zojila in altitude. Thus, B matches with 3.\n•   Khardung La is traditionally known for connecting Leh to the Nubra and Shyok Valleys, making C match with\n1. Zojila, often called the \"mountain pass of blizzards,\" is historically significant due to Operation Bison in\n1948, where Indian forces used tanks at record-breaking altitudes to recapture it.\n•   Currently, the Zoji-la Tunnel (14 km) is under construction to provide all-weather connectivity, as the pass is\nusually closed for six months due to heavy snowfall and avalanches. The pass sits on the boundary between\nGanderbal (J&K) and Kargil (Ladakh) districts and acts as a crucial supply route for forces in Siachen and along\nthe Line of Actual Control (LAC)."}, {"id": 204, "section": "Maps / Places", "question": "Consider the following statements regarding Diego Garcia:\n         Statement-I: Diego Garcia serves as a critical strategic node for the projection of Western military power\nin the Indian Ocean.\n         Statement-II: The island is geologically part of the Chagos-Laccadive Ridge and features a deep-water\nlagoon capable of hosting large naval assets.\nWhich one of the following is correct in respect of the above statements?", "options": {"a": "Both Statement-I and Statement-II are correct and Statement-II is the correct explanation for\nStatement-I", "b": "Both Statement-I and Statement-II are correct and Statement-II is not the correct explanation for\nStatement-I", "c": "Statement-I is correct but Statement-II is incorrect", "d": "Statement-I is incorrect but Statement-II is correct"}, "correct": "a", "explanation": "•   Statement-I is correct because Diego Garcia is the largest atoll in the Chagos Archipelago and hosts a joint\nU.K.-U.S. military base. Its location allows for surveillance and rapid response across the Strait of Hormuz,\nMalacca Strait, and Bab-el-Mandeb, which are vital global trade chokepoints.\n•   Statement-II is also correct and provides the geological and logistical reason why the island is so valuable. As\npart of the Chagos-Laccadive Ridge, it is an atoll with a unique \"footprint\" shape. The central deep-water\nlagoon acts as a natural protected harbor, allowing the U.S. Navy to dock massive aircraft carriers and\nsubmarines. Furthermore, its geographic isolation provides a security buffer.\n•   The link between the two statements is direct: the physical geography (the lagoon and location on the ridge)\nis what enables the military strategic utility (projection of power).\n•   Therefore, Statement-II explains why Statement-I is possible."}, {"id": 205, "section": "Maps / Places", "question": "Consider the following pairs:\n Protected Area              Location/Country\n1. Upemba National Park        Democratic Republic of the Congo\n2. Kundelungu National Park Tanzania\n3. Lubudi–Sampwe Reserve Democratic Republic of the Congo\nHow many of the pairs given above are correctly matched?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "b", "explanation": "•   Pair 1 is correctly matched; Upemba National Park is a prominent park in the DRC.\n•   Pair 2 is incorrectly matched; Kundelungu National Park is also located in the Democratic Republic of the\nCongo, not Tanzania. It is situated close to Upemba and is part of the same broader ecological landscape.\n•   Pair 3 is correctly matched; the Lubudi–Sampwe hunting reserve is located in the DRC and serves as a vital\necological corridor connecting Upemba and Kundelungu National Parks. This corridor allows for the migration\nand movement of wildlife, such as elephants, between the two protected areas.\n•   Maintaining these corridors is essential for genetic diversity and the survival of large mammals in the Congo\nBasin. Errors in such matches often involve placing parks in neighboring countries like Tanzania or Zambia,\nwhich share similar savanna and forest landscapes but have distinct national park systems."}, {"id": 206, "section": "Maps / Places", "question": "With reference to Kharg Island, consider the following statements:\n       1. It is a coral island that possesses natural freshwater resources.\n       2. It served as a trading station for the Dutch East India Company in the 18th century.\n       3. The island is geologically characterized by coral limestone deposits.\n       4. It is the primary site for Iran’s nuclear enrichment facilities.\nHow many of the above statements are correct?", "options": {"a": "Only one", "b": "Only two", "c": "Only three", "d": "All four"}, "correct": "c", "explanation": "•   Statement 1 is correct: Unlike many arid islands in the Persian Gulf, Kharg has natural freshwater, which has\nsupported human life for millennia.\n•   Statement 2 is correct: The Dutch East India Company established a fortified trading post on the island in\n1753, although they were later expelled by local Persian forces.\n•   Statement 3 is correct: The island is a coral island, primarily composed of coral limestone that has risen\nabove sea level.\n•   Statement 4 is incorrect: Kharg Island is an oil export hub, not a nuclear enrichment site. Iran's major nuclear\nfacilities are located in places like Natanz, Fordow, and Bushehr (mainland). Kharg is critical for Iran's\neconomy because it handles the bulk of its crude oil loading.\n•   The island's geography—being five miles long and situated near deep-water channels—is what makes it an\nideal terminal for super-tankers. Its history is also rich, with archaeological evidence of rock-cut tombs from\nthe Achaemenid era, indicating its long-standing strategic and commercial importance in the Gulf's maritime\nhistory."}, {"id": 207, "section": "Maps / Places", "question": "Kharg Island, recently seen in the news due to regional conflicts, is located in:", "options": {"a": "The Gulf of Oman, near the Port of Chabahar.", "b": "The Caspian Sea, serving as a primary maritime hub for energy trade.", "c": "The Red Sea, guarding the Bab-el-Mandeb Strait.", "d": "The Northern Persian Gulf, northwest of the port of Bushehr."}, "correct": "d", "explanation": "•   Kharg Island is a critical strategic asset located in the northern Persian Gulf, approximately 50–55 km off the\nIranian coast and northwest of the city of Bushehr. It is a coral island formed from limestone deposits. Its\nprimary global significance lies in its role as Iran’s main crude oil export terminal, handling nearly 90% of the\ncountry's petroleum exports. Because it is positioned close to deep waters, it allows Very Large Crude\nCarriers (VLCCs) to dock, which is not possible at most mainland ports.\n•   Historically, the island has been a site of human activity since the Achaemenid period and was a major\nflashpoint during the Iran-Iraq War in the 1980s. Its proximity to the Strait of Hormuz, a vital global energy\nchokepoint, makes any military action on the island a matter of international concern, as it can lead to a\ndrastic spike in global oil prices.\n•   Unlike many other islands in the Gulf, Kharg possesses natural freshwater, which historically supported\nsettlements before its industrial transformation."}, {"id": 208, "section": "Maps / Places", "question": "Which of the following geographic features are located in Iran?\n         1. Zagros Mountains\n         2. Lake Urmia\n         3. Dasht-e Lut Desert\n         4. Karun River\nSelect the correct answer using the code given below:", "options": {"a": "1 and 2 only", "b": "3 and 4 only", "c": "1, 3 and 4 only", "d": "1, 2, 3 and 4"}, "correct": "d", "explanation": "•   Iran’s geography is diverse and strategically important.\n•   1 is correct; the Zagros Mountains are the country’s largest mountain range.\n•   2 is correct; Lake Urmia, located in the northwest, was once one of the largest saltwater lakes in the world.\n•   3 is correct; the Dasht-e Lut (Lut Desert) is a large salt desert and is one of the hottest places on Earth.\n•   4 is correct; the Karun River is Iran's most effluent and only navigable river, which is crucial for the region's\neconomy and agriculture. Additionally, Iran is a highly seismic region due to its location at the intersection of\nseveral tectonic plates, leading to frequent and often devastating earthquakes."}, {"id": 209, "section": "Maps / Places", "question": "Consider the following statements regarding the geographical features of the Gulf region:\n\n\n\n                                                                              1. The Persian Gulf is characterized by deep oceanic trenches that make it unsuitable for offshore\n           drilling.\n      2. Wadis are intermittent river valleys that remain dry for most of the year.\n      3. The region experiences extreme heat, with temperatures occasionally exceeding 50°C.\nHow many of the above statements are correct?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "b", "explanation": "•   Statement 1 is incorrect. The Persian Gulf is actually a shallow marginal sea, which is exactly what makes it\nan ideal environment for offshore oil and gas drilling. Its gentle slope and shallow waters allow for easier\nextraction compared to deep-sea oceanic regions.\n•   Statement 2 is correct. Wadis are a defining feature of the arid Arabian landscape; they are valleys that may\nflash flood during rare heavy rains but are otherwise dry.\n•   Statement 3 is correct. The climate is extremely arid and hot, with summer temperatures frequently crossing\nthe 50°C mark, necessitating advanced cooling infrastructure and making water security (via desalination) a\ntop priority for GCC nations. The combination of this harsh climate and the unique geology—the stable\nArabian Shield and the sedimentary lowlands—defines the socio-economic and strategic profile of the Gulf\nnations."}, {"id": 210, "section": "Maps / Places", "question": "Consider the following statements regarding the geography of the Gulf Nations:\n       1. The Arabian Shield is a stable Precambrian complex located in the eastern part of the peninsula.\n       2. The Rub’ al Khali is the world's largest continuous sand desert and sits atop ancient fossil-fuel-rich\n            lake beds.\n       3. The Strait of Hormuz is a strategic chokepoint through which nearly half of the global daily oil\n            shipments transit.\nHow many of the above statements are correct?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "a", "explanation": "•   Statement 1 is incorrect because the Arabian Shield is located in the west of the peninsula (primarily in Saudi\nArabia), while the eastern part consists of sedimentary layers where most oil reserves are found.\n•   Statement 2 is correct. The Rub’ al Khali (Empty Quarter) is a massive desert covering the southern part of\nthe peninsula. It is significant not just for its size but for its geological history; ancient lake beds beneath its\nsands are associated with the region's vast hydrocarbon reserves.\n•   Statement 3 is incorrect. While the Strait of Hormuz is arguably the world's most important chokepoint, it\naccounts for approximately 20% of global oil and 20% of LNG shipments daily, not half. The region's\ngeography, characterized by extreme aridity and \"wadis\" (dry riverbeds), has dictated human settlement\npatterns and the modern focus on desalination and energy-intensive infrastructure projects."}, {"id": 211, "section": "Maps / Places", "question": "Which of the following geographical features are associated with Malawi?\n         1. East African Rift Valley\n         2. Lake Nyasa\n         3. Shire River\n         4. Mulanje Mountain Massif\nSelect the correct answer using the code given below:", "options": {"a": "1 and 2 only", "b": "2 and 3 only", "c": "1, 3 and 4 only", "d": "1, 2, 3 and 4"}, "correct": "d", "explanation": "•   Malawi is a landlocked country in southeastern Africa with diverse geographical features.\n•   Statement 1 is correct as it lies along the East African Rift Valley, which defines its topography.\n•   Statement 2 is correct; Lake Malawi is also known as Lake Nyasa and covers a significant portion of the\ncountry's eastern boundary.\n•   Statement 3 is correct because the Shire River is the sole outlet of Lake Malawi, flowing into the Zambezi.\n•   Statement 4 is correct as the Mulanje Mountain Massif is the highest point in the country at over 3,000\nmeters. Malawi is currently facing a food crisis due to El Niño-induced drought, prompting humanitarian aid\nsuch as rice from India. The country's economy is heavily tied to agriculture, particularly in the fertile\nhighlands and plateaus."}, {"id": 212, "section": "Maps / Places", "question": "Consider the following statements regarding the geography of Chile:\n       1. It is a landlocked country located in western South America.\n       2. The Atacama Desert, located in the north, is considered the driest non-polar place on Earth.\n       3. The country’s central valley has a Mediterranean climate and is the most populated region.\nHow many of the above statements are correct?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "b", "explanation": "•   Chile's geography is unique due to its long, narrow shape.\n•   Statement 1 is incorrect because Chile is not landlocked. It has a massive coastline along the Pacific Ocean to\nthe west and is bordered by Peru, Bolivia, and Argentina. To the south lies the Drake Passage.\n•   Statement 2 is correct; the Atacama Desert in northern Chile is globally famous for its extreme aridity,\nreceiving almost no rainfall, which makes it the driest non-polar region on the planet.\n•   Statement 3 is correct. The Central Valley provides a stark contrast to the desert north and the icy south. Its\nMediterranean climate (cool, wet winters and warm, dry summers) makes it highly suitable for agriculture\nand viticulture. Consequently, this region, which includes the capital city of Santiago, houses the vast majority\nof the country's population."}, {"id": 213, "section": "Maps / Places", "question": "Consider the following statements regarding the geography of Lebanon:\n       1. It is bordered by Syria to the north and east, and Israel to the south.\n       2. The Bekaa Valley, a major agricultural region, is situated between the Lebanon and Anti-Lebanon\n            mountain ranges.\n       3. The country has a long coastline along the Red Sea, facilitating its role as a commercial crossroads.\nHow many of the above statements are incorrect?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "a", "explanation": "•   Statement 1 is correct. Lebanon shares land borders with only two countries: Syria and Israel.\n•   Statement 2 is correct. The Bekaa Valley is a fertile plateau that forms part of the Great Rift Valley system\nand lies between the two parallel mountain ranges (Mount Lebanon and Anti-Lebanon).\n•   Statement 3 is incorrect because Lebanon is located on the eastern shore of the Mediterranean Sea, not the\nRed Sea. Its coastal plain includes major ancient ports like Beirut and Sidon, which have historically made it a\ncultural and commercial hub between the Levant and Europe."}, {"id": 214, "section": "Maps / Places", "question": "Consider the following statements regarding the Strait of Hormuz:\n       1. It serves as the primary maritime link between the Red Sea and the Gulf of Aden.\n       2. It is situated between the coastlines of Saudi Arabia to the south and Iran to the north.\n       3. It is currently the busiest oil transit chokepoint in the world, surpassing the Strait of Malacca.\nHow many of the above statements are correct?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "d", "explanation": "•   Statement 1 is incorrect because the strait connects the Persian Gulf to the Gulf of Oman and the Arabian\nSea, not the Red Sea.\n•   Statement 2 is incorrect because the waterway lies between Iran (to the north) and Oman (to the south).\nSpecifically, the Musandam Peninsula of Oman forms the southern coast of the strait. Saudi Arabia does not\nshare a coastline with the Strait of Hormuz.\n•   Statement 3 is incorrect because, while it is a critical energy corridor carrying roughly 20% of the world's oil\nsupply, it is technically ranked as the second-busiest oil transit chokepoint, with the Strait of Malacca usually\nseeing higher total volumes of oil and commercial traffic.\n•   However, its strategic importance is unparalleled because there are limited pipeline alternatives for the oil\nand LNG produced by Gulf nations like Qatar and Kuwait. At its narrowest, the shipping lanes are only about 3\nkm wide in each direction, making it a highly vulnerable \"global chokepoint.\""}, {"id": 215, "section": "Maps / Places", "question": "Azerbaijan is strategically located between which major bodies of water?", "options": {"a": "The Red Sea and the Arabian Sea", "b": "The Caspian Sea and the Persian Gulf", "c": "The Caspian Sea and the Black Sea", "d": "The Black Sea and the Mediterranean Sea"}, "correct": "c", "explanation": "Explanation:\n• Option a is incorrect – The Red Sea and Arabian Sea are much farther south, near the Arabian Peninsula.\n• Option b is incorrect – The Persian Gulf is far south, and Azerbaijan does not reach it.\n• Option c is correct – Azerbaijan is situated between the Caspian Sea and the Black Sea, making it a\ncritical transit hub for trade and energy exports.\n• Option d is incorrect – Azerbaijan does not border the Mediterranean Sea.\nAbout Azerbaijan:\n• Location: Located in eastern Transcaucasia.\n• Bordered by: Russia, Georgia, Armenia, Iran, and Caspian Sea.\n• Capital: Baku, a major oil-rich city on the Caspian Sea coast.\n• Geographic Features:\no Mountains: The Greater Caucasus Mountains dominate the north, with Mount Bazardüzü (4,466\nmeters) as the highest peak.\no Rivers: Major rivers include the Kura and Aras, supporting agriculture and hydroelectric power.\no Caspian Sea Coastline: Azerbaijan has a large coastline along the Caspian Sea, playing a crucial\nrole in trade and energy exports."}, {"id": 216, "section": "Maps / Places", "question": "Armenia is a landlocked country located in which geographical region?", "options": {"a": "The South Caucasus", "b": "The Central Asian Steppe", "c": "The Levant", "d": "The Balkans"}, "correct": "a", "explanation": "Explanation:\n• Option a is correct – Armenia is part of the South Caucasus region, bordered by Turkey, Georgia,\nAzerbaijan, and Iran.\n• Option b is incorrect – Armenia is not part of Central Asia, as it lies west of the Caspian Sea.\n• Option c is incorrect – The Levant covers countries like Lebanon, Syria, Jordan, and Israel, not Armenia.\n• Option d is incorrect – The Balkans refer to Southeastern Europe, while Armenia is located in Eurasia.\nAbout Armenia:\n• Location: A landlocked country in the South Caucasus.\n• Border nations: Turkey, Georgia, Azerbaijan, and Iran\n• Capital:\n• Geographic Features:\no Mountains: A highly mountainous country, dominated by the Lesser Caucasus Mountains.\no Highest Peak: Mount Aragats (4,090 meters).\no Rivers: The Aras River, forming the southern border with Turkey and Iran.\no Lakes: Lake Sevan, one of the largest freshwater lakes in the region."}, {"id": 217, "section": "Maps / Places", "question": "Consider the following statements regarding Greenland.\n       1. Greenland is an autonomous territory under the Kingdom of Denmark but has full control over its\n       foreign affairs and defence policies.\n       2. The island is strategically located between the Arctic and Atlantic Oceans, making it crucial for global\n       shipping and military operations.\nWhich of the above statements is/are correct?", "options": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "correct": "b", "explanation": "Statement 1 is incorrect: Greenland is an autonomous territory of Denmark, but Denmark retains control over\nforeign affairs, defence, and security. Greenland has self-governance in domestic matters, including resource\nmanagement and local policies.\nStatement 2 is correct: Greenland's strategic location between the Arctic and Atlantic Oceans makes it critical for\nglobal trade routes and military positioning. It hosts the Thule Air Base, a key U.S. military installation.\nAbout Greenland:\n• Location: World’s largest island, situated between the Arctic and Atlantic Oceans.\n•   Capital: Nuuk.\n•   Political Status: An autonomous territory within the Kingdom of Denmark.\n•   Population: Approximately 57,000 people.\n•   Geographic Features:\no Ice Sheet: Covers around 80% of Greenland.\no Mountains: Watkins Range, including Gunnbjørn Fjeld (tallest mountain in the Arctic).\no Major Water Bodies: Scoresby Sound (world’s largest fjord), Ilulissat Icefjord (UNESCO World\nHeritage Site).\n• Economy:\no Primary Sectors: Fishing (accounts for 90% of exports), tourism, and small-scale mining.\no Potential Growth Areas: Rare earth minerals, uranium, and other strategic metals.\nWhy is Greenland in the Spotlight?\n• Push for Independence: All major political parties support the idea of breaking away from Danish rule.\no Greenland currently receives an annual subsidy of $565 million from Denmark, about 20% of its\nGDP.\nGeopolitical Interests:\n• Trump’s Renewed Interest: First proposed purchasing Greenland in 2019, leading to diplomatic tensions.\no Recently, Trump revived his ambition, claiming Greenland should join the US for “prosperity and\nsecurity.”\n• Resource Race in the Arctic: Greenland is rich in rare earth elements, uranium, and critical\nminerals needed for global industries."}, {"id": 218, "section": "Maps / Places", "question": "The North Sea is bordered by which of the following water bodies?\n         1. English Channel\n         2. Norwegian Sea\n         3. Baltic Sea\n         4. Bay of Biscay\nSelect the correct answer using the codes below:", "options": {"a": "1, 2, and 3", "b": "1 and 3", "c": "2 and 4", "d": "All of the above"}, "correct": "a", "explanation": "The North Sea is connected to the Norwegian Sea, the English Channel, and the Baltic Sea.\nThe Bay of Biscay is located southwest of France and is not connected to the North Sea."}, {"id": 219, "section": "Miscellaneous", "question": "Consider the following statements regarding the SRY gene and the International Olympic Committee's (IOC)\n   recent policy change:\n       1. The SRY gene is a segment of DNA usually found on the Y chromosome that acts as a master switch\n            for male physical development.\n       2. The screening process uses a saliva sample or cheek swab to detect the presence of the gene.\n       3. Athletes with Complete Androgen Insensitivity Syndrome (CAIS) are automatically disqualified if they\n            test positive for the SRY gene.\n       4. The policy applies to all levels of sports, including grassroots and community-led leisure activities.\nHow many of the statements given above are correct?", "options": {"a": "Only one", "b": "Only two", "c": "Only three", "d": "All four"}, "correct": "b", "explanation": "•   Statement 1 is correct: SRY stands for Sex-determining Region Y, a gene that triggers the development of\ntestes and male levels of testosterone.\n•   Statement 2 is also correct: The screening involves a simple saliva sample or cheek swab, with results\ntypically issued in one week.\n•   However, Statement 3 is incorrect because the policy includes exceptions for rare DSDs (Differences in Sex\nDevelopment). Specifically, athletes with Complete Androgen Insensitivity Syndrome (CAIS)—where the\nbody cannot process testosterone—may still be eligible for the female category even if they are SRY-positive.\n•   Statement 4 is incorrect because the IOC mandates this screening only for elite-level international athletes\n(such as those in the Olympics or World Championships) and explicitly states it does not apply to grassroots\nor leisure sports. The significance of this policy lies in the shift from self-identification to a biological/genetic\nmodel for gender classification.\n•   The IOC cites data showing a 10% to 100% performance advantage for male-developed athletes. This\nmandatory screening aims to protect the integrity of the female category by ensuring competitors do not\nhave the physiological advantages associated with male puberty, such as increased bone density and\nexplosive muscle power."}, {"id": 220, "section": "Miscellaneous", "question": "The PRISM-SG portal, launched by the Union Government in 2026, is primarily associated with which of the\n   following?", "options": {"a": "Digitization of land records in rural areas.", "b": "Managing the recruitment process for the Indian Railways.", "c": "Providing real-time weather updates to farmers.", "d": "Streamlining approvals for Steel Girders in bridge construction."}, "correct": "d", "explanation": "•   The PRISM-SG Portal (Portal for Rail-Road Inspection & Stages Management – Steel Girders) is a specialized\ndigital platform. Its primary objective is to eliminate technical bottlenecks in the construction of Road Over\nBridges (ROBs) where highways and railways intersect. Before this portal, the approval process for steel\ngirders—which requires high structural precision and complex welding specifications—was largely manual\nand fragmented between different departments. By moving the process online, the government aims to\nreduce the approval cycle by 70%, moving from a standard one-year wait to approximately 100 days.\n•   Key features include a digital dashboard for real-time monitoring, allowing contractors and railway officials to\ntrack every stage of fabrication and inspection. It also ensures an unalterable audit trail, which enhances\ntransparency and prevents administrative delays. This portal works in tandem with the RRCAS system,\ncreating a comprehensive digital ecosystem for infrastructure.\n•   Ultimately, it ensures that critical highway projects are not stalled at railway crossings due to paperwork,\nthereby saving capital for the exchequer and ensuring structural integrity through automated scheduling of\ninspections and digital uploads of test results."}, {"id": 221, "section": "Miscellaneous", "question": "The \"Cadila Healthcare Ltd v Cadila Pharmaceuticals Ltd\" case is frequently cited in the context of the Trade\n   Marks Act, 1999 to support which of the following principles?", "options": {"a": "The protection of unregistered marks through the common law remedy of passing off.", "b": "The mandatory requirement of a 500-metre drug-free zone around educational institutions.", "c": "is correct because the\n    Supreme Court ruled that a higher threshold must be applied when comparing trademarks for medicines. The\n    court emphasized that unlike other consumer goods (where a mistake might only lead to financial loss), a\n    mistake in medicinal products can be life-threatening.\n•   Therefore, even if there is a minor phonetic or visual similarity, the mark should be barred to prevent any\n    possibility of consumer confusion or deception. This is particularly relevant in the recent dispute where Novo\n    Nordisk alleged that Dr. Reddy’s \"Olymviq\" was deceptively similar to \"Ozempic.\" The Trade Marks Act, 1999\n    is designed to protect both the commercial R&D investment of innovators and the safety of the public.\n•   This \"exacting standard\" ensures that in India’s multilingual and often low-awareness settings, the risk of\n    wrong drug dispensing is minimized.", "d": "The prohibition of using AI tokens for the automated registration of pharmaceutical trademarks."}, "correct": "c", "explanation": "•   In Indian trademark law, the Cadila Healthcare case is a seminal judgment. Option (c) is correct because the\nSupreme Court ruled that a higher threshold must be applied when comparing trademarks for medicines. The\ncourt emphasized that unlike other consumer goods (where a mistake might only lead to financial loss), a\nmistake in medicinal products can be life-threatening.\n•   Therefore, even if there is a minor phonetic or visual similarity, the mark should be barred to prevent any\npossibility of consumer confusion or deception. This is particularly relevant in the recent dispute where Novo\nNordisk alleged that Dr. Reddy’s \"Olymviq\" was deceptively similar to \"Ozempic.\" The Trade Marks Act, 1999\nis designed to protect both the commercial R&D investment of innovators and the safety of the public.\n•   This \"exacting standard\" ensures that in India’s multilingual and often low-awareness settings, the risk of\nwrong drug dispensing is minimized."}, {"id": 222, "section": "Miscellaneous", "question": "Consider the following statements regarding Small Hydro Power (SHP) projects.\n       Statement-I: Small Hydro Power (SHP) projects are considered more environmentally sustainable than\n       large-scale hydro projects.\n       Statement-II: SHP projects typically avoid large-scale land acquisition, massive deforestation, and the\n       displacement of local communities.\nWhich one of the following is correct in respect of the above statements?", "options": {"a": "Both Statement-I and Statement-II are correct and Statement-II is the correct explanation for\nStatement-I", "b": "Both Statement-I and Statement-II are correct and Statement-II is not the correct explanation for\nStatement-I", "c": "Statement-I is correct but Statement-II is incorrect", "d": "Statement-I is incorrect but Statement-II is correct"}, "correct": "a", "explanation": "•   The distinction between Small Hydro Power (1-25 MW) and Large Hydro is central to India's renewable energy\nstrategy.\n•   Statement-I is a widely accepted environmental premise: SHPs are \"run-of-the-river\" or small-head projects\nthat have a much smaller ecological footprint.\n•   Statement-II provides the specific reasons why they are more sustainable. Large hydro projects often involve\nbuilding massive dams that create huge reservoirs. These reservoirs submerge thousands of hectares of forest\nland (deforestation) and force the relocation of entire villages (displacement). In contrast, SHPs use the\nnatural flow of water or smaller diversions, requiring minimal land.\n•   Furthermore, SHPs reduce the need for long-distance transmission lines, further lowering the environmental\nimpact of infrastructure expansion in sensitive zones like the Himalayas or the Western Ghats."}, {"id": 223, "section": "Miscellaneous", "question": "With reference to the Small Hydro Power (SHP) Development Scheme, consider the following statements:\n      1. It focuses on the installation of hydro power projects with a capacity between 1 MW and 25 MW.\n      2. The scheme provides higher Central Financial Assistance (CFA) to North-Eastern and Border States\n           compared to other states.\n      3. To promote indigenous manufacturing, projects must use at least 50% of plant and machinery from\n           domestic sources.\nHow many of the above statements are incorrect?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "a", "explanation": "•   The Small Hydro Power (SHP) Development Scheme is a significant push towards decentralized renewable\nenergy.\n•   Statement 1 is correct as it targets projects within the 1–25 MW range. These are distinct from large hydro\nprojects and are often situated in remote or hilly terrains where grid connectivity is challenging.\n•   Statement 2 is correct. The scheme utilizes a differential funding model. NE and Border States receive a\nhigher subsidy of ₹3.6 crore/MW (max ₹30 crore), recognizing the higher construction costs and strategic\nimportance of these regions. In contrast, other states receive ₹2.4 crore/MW (max ₹20 crore).\n•   Statement 3 is incorrect. The scheme has a very strict Atmanirbhar Bharat requirement: to qualify for\nsupport, projects must leverage 100% of plant and machinery from indigenous sources, not just 50%. This is\ndesigned to build a robust domestic supply chain for hydro turbines and components. A key advantage of SHP\nprojects mentioned in the scheme is that they avoid the environmental and social pitfalls of large dams, such\nas large-scale land acquisition or massive deforestation, while reducing transmission losses by generating\npower closer to the point of consumption."}, {"id": 224, "section": "Miscellaneous", "question": "Which of the following is not a characteristic feature of the Indian Ocean Region (IOR)?", "options": {"a": "is correct; the Monsoon\n    system creates a unique reversal of surface currents twice a year, which is not seen in the Atlantic or Pacific.\n    This affects navigation and climate across the littoral states.\n•   Statement", "b": "is correct regarding biodiversity. The IOR is home to roughly 25% of global coral reefs, making\n    it a critical zone for marine ecology and local fishing economies, which provide a significant portion of the\n    global catch.\n\n\n\n\n                                                                                    •   Statement", "c": "is correct. There are 36 littoral nations bordering the ocean, and its maritime routes are the\n    lifeblood for 14 landlocked countries that depend on these ports for trade.\n•   Statement", "d": "is incorrect. The Indian Ocean is the third-largest ocean in the world, not the largest (the Pacific\n    is the largest). It does connect to the Atlantic and Pacific via key choke points (like the Malacca Strait and the\n    Cape of Good Hope) and borders the Southern Ocean to the south."}, "correct": "d", "explanation": "•   The Indian Ocean Region is geographically and strategically unique. Statement (a) is correct; the Monsoon\nsystem creates a unique reversal of surface currents twice a year, which is not seen in the Atlantic or Pacific.\nThis affects navigation and climate across the littoral states.\n•   Statement (b) is correct regarding biodiversity. The IOR is home to roughly 25% of global coral reefs, making\nit a critical zone for marine ecology and local fishing economies, which provide a significant portion of the\nglobal catch.\n•   Statement (c) is correct. There are 36 littoral nations bordering the ocean, and its maritime routes are the\nlifeblood for 14 landlocked countries that depend on these ports for trade.\n•   Statement (d) is incorrect. The Indian Ocean is the third-largest ocean in the world, not the largest (the Pacific\nis the largest). It does connect to the Atlantic and Pacific via key choke points (like the Malacca Strait and the\nCape of Good Hope) and borders the Southern Ocean to the south."}, {"id": 225, "section": "Miscellaneous", "question": "In the context of Force Majeure recently invoked in the
