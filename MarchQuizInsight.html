ecurity challenges (Statement-I) along this rugged, mountainous frontier."}, {"id": 131, "section": "Polity", "question": "Consider the following statements regarding the FRBM Act, 2003, and its amendments:\n      1. The FRBM Act was enacted to eliminate the revenue deficit and reduce the fiscal deficit.\n      2. States are not required to enact their own fiscal responsibility laws under the FRBM framework.\n      3. The FRBM Amendment Act, 2018, set a combined debt target of 60% of GDP for the Centre and States.\nHow many of the above statements are correct?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "b", "explanation": "The FRBM Act, 2003, was introduced to institutionalize fiscal discipline and enhance transparency in fiscal\nmanagement. It aimed to eliminate the revenue deficit and reduce the fiscal deficit, ensuring long-term\nmacroeconomic stability, which makes Statement 1 correct.\nHowever, the Act requires both the Centre and states to implement fiscal responsibility laws. Many states have\nenacted their fiscal responsibility legislation to align with the principles of the FRBM framework, making\nStatement 2 incorrect.\nThe FRBM Amendment Act, 2018, updated the framework to address changing economic realities. It introduced a\nspecific target for the overall public debt: a combined debt-to-GDP ratio of 60%, split as 40% for the Centre and\n20% for the states. This makes Statement 3 correct."}, {"id": 132, "section": "Polity", "question": "Consider the following statements about CSR eligibility and compliance under the Companies Act, 2013:\n      1. CSR becomes mandatory for companies with a net worth of ₹500 crore or more.\n      2. Companies failing to meet CSR obligations may face monetary penalties, but responsible officers are\n      not personally liable.\n      3. The law requires unspent CSR funds to be carried forward indefinitely if not utilized in the specified\n      year.\nHow many of the above statements are correct?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "a", "explanation": "Only Statement 1 is correct.\nCSR compliance is mandatory for companies with a net worth of ₹500 crore or more, an annual turnover of\n₹1,000 crore or more, or a net profit of ₹5 crore or more.\nStatement 2 is incorrect because both the company and responsible officers may face penalties for non-\ncompliance. Officers can be fined or even face imprisonment for failing to meet CSR obligations.\nStatement 3 is also incorrect as per the 2019 amendment; unspent CSR funds must be transferred to a specified\nfund by the end of the fiscal year and utilized within three years. If unutilized, these funds must be deposited\ninto a government-specified fund, ensuring timely and effective CSR expenditure."}, {"id": 133, "section": "Polity", "question": "Consider the following statements about minority educational institutions:\n      1. The National Commission for Minority Educational Institutions Act, 2004, provides minority institutions\n      with absolute immunity from state interference.\n      2. Only institutions established post-Independence are eligible for minority status under the Constitution.\n      3. The Supreme Court in T.M.A Pai Foundation v. State of Karnataka (2002) laid down guidelines to\n      identify minority status and autonomy in administration.\nHow many of the above statements are correct?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "a", "explanation": "Only statement 3 is correct. In T.M.A Pai Foundation v. State of Karnataka (2002), the Supreme Court laid down\nguidelines to determine the minority status of institutions and the extent of their administrative autonomy.\nStatement 1 is incorrect as the National Commission for Minority Educational Institutions Act, 2004, provides\nsafeguards and legal recognition but does not grant absolute immunity from state regulation.\nStatement 2 is also incorrect because institutions established before the Constitution came into force can also\nclaim minority status if they meet the criteria."}, {"id": 134, "section": "Polity", "question": "Consider the following statements regarding the powers of a Joint Parliamentary Committee (JPC):\n       Statement I: A JPC has the authority to summon any person, including government officials, to give\n       evidence or produce documents.\n       Statement II: The recommendations of a JPC are legally binding on the Government of India.\n       Statement III: A JPC can be authorized to investigate matters related to financial irregularities and\n       statutory loopholes.\nWhich one of the following is correct in respect of the above statements?", "options": {"a": "Both Statement II and Statement III are correct and both of them explain Statement I", "b": "Both Statement II and Statement III are correct but only one of them explains Statement I", "c": "Only one of the Statements II and III is correct and that explains Statement I", "d": "Neither Statement II nor Statement III is correct"}, "correct": "c", "explanation": "•   Statement I is correct; the JPC has extensive powers to collect evidence and summon experts or officials.\n•   Statement II is incorrect; like most parliamentary committees, the JPC's recommendations are not legally\nbinding on the government. The government is expected to take them seriously and submit an \"Action Taken\nReport,\" but it is not a legal mandate.\n•   Statement III is correct; JPCs are frequently set up for fact-finding missions regarding scams or regulatory\nfailures. In the given options, Statement III is the correct statement that aligns with the investigative nature\nmentioned in Statement I.\n•   The JPC serves as a crucial link in the chain of accountability. While its findings are advisory, the political and\nmoral weight of a bi-partisan report is significant. It allows for expert deliberation on complex bills, such as\n'One Nation, One Election', where technical and constitutional nuances require more than just a floor debate.\nBy summoning officials, the committee can uncover administrative lapses or regulatory gaps that led to a\nparticular issue. This investigative process ensures that when the final report is submitted, it contains a\nbalanced perspective from across the political spectrum. The committee system, strengthened in 1993,\nremains a hallmark of the Indian Parliament’s ability to conduct in-depth scrutiny of the Executive's actions\nand proposed legislations."}, {"id": 135, "section": "Polity", "question": "With reference to the Appropriation Bill 2026, which of the following statements are correct?\n         1. It includes both \"voted\" expenditures and \"charged\" expenditures upon the Consolidated Fund of\n              India.\n         2. The Rajya Sabha has the power to reject the Bill if it finds the budgetary allocations unrealistic.\n         3. No amendment can be proposed to this Bill in either House that alters the destination of any grant\n              already voted upon.\n         4. The Bill is introduced in the Lok Sabha only after the voting on Demands for Grants is completed.\nSelect the correct answer using the code given below:", "options": {"a": "1, 2 and 3", "b": "2, 3 and 4", "c": "1, 2 and 4", "d": "1, 3 and 4"}, "correct": "d", "explanation": "•   Statement 1 is correct. The Appropriation Bill covers the entire gamut of government spending from the\nConsolidated Fund of India (CFI). This includes voted expenditures (those requiring a vote in the Lok Sabha)\nand charged expenditures (which are not voted upon, such as the salaries of the President, Supreme Court\nJudges, and interest payments on national debt).\n•   Statement 2 is incorrect. Because the Appropriation Bill is a Money Bill, the Rajya Sabha cannot reject or\namend it. It can only make recommendations, and if it does not return the bill within 14 days, it is deemed to\nhave been passed by both Houses in the form it was passed by the Lok Sabha.\n•   Statement 3 is correct. A unique feature of the Appropriation Bill is that no amendment can be proposed in\neither House that would vary the amount or alter the destination of any grant previously voted upon by the\nLok Sabha. This maintains the sanctity of the voting on Demands for Grants.\n•   Statement 4 is correct. The sequence of the Budgetary Process is strictly followed: Presentation -> General\nDiscussion -> Voting on Demands for Grants -> Introduction of the Appropriation Bill. The Bill provides the\nlegal \"teeth\" to the grants already approved. This process ensures transparency and fiscal discipline in\ngovernment spending."}, {"id": 136, "section": "Polity", "question": "Match the Following:\n Constitutional Provision Subject Matter\nA. Article 110            1. Appropriation Bills\nB. Article 114            2. Supplementary, Additional or Excess Grants\nC. Article 115            3. Money Bills\n D. Article 116              4. Votes on Account\nSelect the correct answer using the code given below:", "options": {"a": "A-3, B-1, C-2, D-4", "b": "A-1, B-3, C-4, D-2", "c": "A-3, B-4, C-2, D-1", "d": "A-1, B-4, C-3, D-2"}, "correct": "a", "explanation": "•   Article 110 defines Money Bills. This is a foundational article because it determines the special legislative\nprocedure where the Lok Sabha has overriding powers. The Appropriation Bill is classified under this article.\n•   Article 114 specifically mandates Appropriation Bills. It states that no money shall be withdrawn from the\nConsolidated Fund of India except under appropriation made by law.\n•   Article 115 deals with Supplementary, Additional, or Excess Grants. If the amount authorized by the\nAppropriation Act for a particular service is found to be insufficient, or if a need arises for additional\nexpenditure, the government approaches Parliament under this article.\n•   Article 116 provides for Votes on Account, Votes of Credit, and Exceptional Grants. This allows the Lok Sabha\nto authorize the withdrawal of funds from the CFI for a part of the financial year pending the completion of\nthe budgetary process."}, {"id": 137, "section": "Polity", "question": "With reference to the Joint Parliamentary Committee (JPC), consider the following statements:\n       1. A JPC is a permanent body established to ensure continuous executive accountability to the\n            Parliament.\n       2. The motion to form a JPC can only be initiated in the Lok Sabha.\n       3. The strength of a JPC is fixed by the Rules of Procedure of the respective Houses.\nHow many of the above statements are correct?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "d", "explanation": "•   Statement 1 is incorrect because a JPC is an ad-hoc (temporary) committee, not a permanent/standing\ncommittee. It is dissolved once it submits its report.\n•   Statement 2 is incorrect; while the motion is typically moved in the Lok Sabha, there is no constitutional bar\npreventing the process from starting in either House, provided the other House agrees.\n•   Statement 3 is incorrect because the size and composition of a JPC are not fixed; they depend entirely on the\nspecific motion passed by the Parliament at the time of its creation.\n•   The JPC is a powerful tool for parliamentary oversight. Its significance lies in its bi-partisan nature, including\nmembers from both the treasury and opposition benches. Typically, the membership ratio follows a 2:1\npattern (twice as many members from Lok Sabha as from Rajya Sabha). The committee has significant\npowers, including the authority to summon individuals and call for confidential documents.\n•   In the context of the 'One Nation, One Election' proposal, the JPC provides a platform for expert deliberation\nand in-depth scrutiny that the full House might lack time for. This ensures that complex legislation undergoes\nrigorous fact-finding and technical discussion before becoming law, thereby upholding the principle of\nlegislative scrutiny over the Executive."}, {"id": 138, "section": "Polity", "question": "Consider the following statements regarding the Appropriation Bill:\n        Statement-I: The government cannot withdraw any money from the Consolidated Fund of India without\nthe passage of the Appropriation Bill.\n        Statement-II: The Appropriation Bill is classified as a Money Bill under Article 110 of the Constitution of\nIndia.\nWhich one of the following is correct in respect of the above statements?", "options": {"a": "Both Statement-I and Statement-II are correct and Statement-II is the correct explanation for\nStatement-I", "b": "Both Statement-I and Statement-II are correct and Statement-II is not the correct explanation for\nStatement-I", "c": "Statement-I is correct but Statement-II is incorrect", "d": "Statement-I is incorrect but Statement-II is correct"}, "correct": "b", "explanation": "•   Statement-I is correct. According to Article 114 of the Constitution, no money shall be withdrawn from the\nConsolidated Fund of India (CFI) except under appropriation made by law. This ensures legislative control\nover the executive, preventing any unauthorized expenditure of public funds. Even after the Budget is\npresented and the Demands for Grants are voted upon, the government lacks legal authority to spend until\nthe Appropriation Bill is enacted into an Act.\n•   Statement-II is also correct. The Appropriation Bill is classified as a Money Bill under Article 110. This\nclassification grants the Lok Sabha predominant power, while the Rajya Sabha has limited powers—it can\nonly make recommendations and must return the bill within 14 days.\n•   However, Statement-II is not the correct explanation for Statement-I. Statement-I is a requirement mandated\nspecifically by Article 114 (Appropriation Bills), which establishes the necessity of the law for withdrawal. The\nfact that it is a Money Bill (Article 110) relates to the procedure of its passage and the relative powers of the\ntwo Houses, rather than the fundamental constitutional requirement that money cannot be withdrawn\nwithout a specific law. Thus, while both are true, the procedural classification is not the reason for the\nwithdrawal restriction itself. Executive accountability to the legislature is the core principle behind Article\n114."}, {"id": 139, "section": "Polity", "question": "Consider the following statements regarding the Customs Act, 1962:\n            1. It empowers the central government to prohibit imports for reasons including public health and\n                conservation.\n            2. The Act allows immediate confiscation of imported goods even if proper documentation is\n                submitted.\n            3. The Act provides a warehousing mechanism for imported goods before duty is paid.\nWhich of the above statements are correct?", "options": {"a": "1 and 2 only", "b": "1 and 3 only", "c": "2 and 3 only", "d": "1, 2 and 3"}, "correct": "b", "explanation": "•   Statement 1 is correct – The Act gives the central government the authority to prohibit or restrict imports or\nexports to protect national interests like public health, morality, wildlife conservation, and security.\n•   Statement 3 is also correct – A distinctive feature of the Act is the warehousing provision, which permits\nimported goods to be stored in licensed warehouses without immediate payment of duties, until cleared for\nhome consumption or re-export.\n•   Statement 2 is incorrect – confiscation of goods generally arises from violations such as misdeclaration,\nundervaluation, or smuggling, not when documentation is properly furnished.\n• What is the Customs Act of 1962?\no The Customs Act, 1962 regulates the import and export of goods in India.\no It safeguards the economy, controls smuggling, and promotes legal international trade.\n• Implementing Agency: Administered by the Central Board of Indirect Taxes and Customs (CBIC) under\nthe Ministry of Finance.\n• Key Provisions of the Act:\no Customs Duty: Imposes duties on imported and exported goods based on the Customs Tariff Act,\n1975.\no Prohibitions and Restrictions: Empowers the government to ban or restrict certain\nimports/exports for national security and public health.\no Clearance Procedures: Mandates proper documentation, duty payment, and adherence to\ncustoms protocols before clearance.\no Warehousing Provisions: Allows imported goods to be stored without immediate duty\npayment until released for consumption or export.\n• Exemptions Allowed for Passengers (International Arrivals):\no General Duty-Free Allowance: ₹50,000 worth of goods for international passengers.\no Gold Allowance:\n▪ Male passengers: 20 gm of gold (value up to ₹50,000).\n▪ Female passengers: 40 gm of gold (value up to ₹1,00,000).\n▪ NRIs: Can bring up to 10,000 gm once in six months (duty applicable beyond exemption).\no Other Allowances:\n▪ One laptop per adult passenger.\n▪ Alcohol: 2 litres.\n▪ Tobacco: 100 cigarettes or equivalent.\n•   Cash Carrying Limit:\no Passengers can carry up to ₹25,000 in Indian currency without declaration.\no Must declare foreign currency if exceeding $5,000 or $10,000 equivalent in total foreign\nexchange.\n•   Fines and Punishment for Smuggling:\no Imprisonment: Jail term between 3 to 7 years, based on severity.\no Fines: Penalties may extend up to three times the value of smuggled goods."}, {"id": 140, "section": "Polity", "question": "Consider the following statements regarding the CAG’s audit powers:\n       1. The CAG can audit only those financial transactions that involve tax revenues.\n       2. The CAG conducts three types of audits: compliance audit, financial audit, and propriety audit.\n       3. The CAG directly advises the Prime Minister on financial matters related to policy decisions.\nHow many of the above statements are incorrect?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "b", "explanation": "Explanation:\n• Statement 1 is incorrect – The CAG audits all government expenditure, including non-tax revenues and\ndebt transactions.\n• Statement 2 is correct – The CAG conducts compliance audits, financial audits, and propriety audits.\nStatement 3 is incorrect – The CAG does not advise the PM on policy matters; it is only responsible for auditing\nfinancial records."}, {"id": 141, "section": "Polity", "question": "Consider the following statements regarding the Representation of the People Act, 1950 (RPA 1950):\n       1. It provides for the preparation of electoral rolls and the qualifications of voters.\n       2. It deals with the conduct of elections and the removal of disqualified members from legislatures.\n       3. It lays down provisions related to the allocation of seats in Parliament and State Legislatures.\nWhich of the above statements are correct?", "options": {"a": "3 only", "b": "1 and 3 only", "c": "2 and 3 only", "d": "1, 2 and 3"}, "correct": "b", "explanation": "Explanation:\n• Statement 1 is correct – The Representation of the People Act, 1950 primarily deals with the preparation\nof electoral rolls, voter qualifications, and seat allocation for Parliament and state legislatures.\n• Statement 2 is incorrect – The conduct of elections, corrupt practices, and disqualification of members\nfall under the Representation of the People Act, 1951, not the 1950 Act.\n• Statement 3 is correct – The RPA 1950 also provides for the allocation of seats in the Lok Sabha and\nState Assemblies, as well as delimitation of constituencies."}, {"id": 142, "section": "Polity", "question": "Consider the following statements regarding Secret Sitting in Parliament:\n       1. The Constitution of India explicitly provides for secret sittings of both Houses of Parliament.\n       2. Lok Sabha Rules of Procedure permits secret sittings when recommended by the Leader of the House\nand approved by the Speaker.\n       3. The proceedings of secret sittings are published in the official records only if the House resolves to do\n\n\n\n                                                                                   so.\nWhich of the above statements are correct?", "options": {"a": "3 only", "b": "1 and 3 only", "c": "2 and 3 only", "d": "1, 2 and 3"}, "correct": "c", "explanation": "•   Statement 1 is incorrect — The Constitution of India does not explicitly provide for secret sittings. Instead, it\nallows Parliament to make its own rules of procedure under Article 118, under which the Rules of Procedure\nand Conduct of Business for both Houses have been framed.\n•   Statement 2 is correct — Under Rule 248 of the Lok Sabha Rules, the Leader of the House may request a\nsecret sitting, and the Speaker may approve it.\n•   Statement 3 is also correct — the proceedings of a secret sitting are not automatically published; they are\nonly published if the House later resolves to make them public.\nAbout Secret Sitting of Lok Sabha:\n• What it is\no A secret sitting is a closed-door parliamentary session where discussions are held confidentially,\nwithout public or media access.\n• Constitutional Provision:\no The Constitution of India does not directly mention secret sittings, but it empowers Parliament to\nframe its own rules under Article 118.\n▪ Chapter 25 of the Rules of Procedure and Conduct of Business in Lok Sabha,\nspecifically Rule 248 mention about Secret Sitting.\n• History:\no Though permitted by law, India has never conducted a secret sitting.\no In 1962, during the Chinese aggression, the proposal for secret sitting was suggested but declined\nby PM Jawaharlal Nehru.\n• Who can declare a secret sitting:\no The Leader of the House can request it.\no The Speaker of the Lok Sabha has the authority to approve and schedule the secret sitting.\no Secret sitting is allowed in Rajya Sabha as well.\n▪ It is provided under Rule 266 of the Rules of Procedure and Conduct of Business in\nthe Council of States (Rajya Sabha), where the Chairman can permit a secret sitting on a\nrequest made by the Leader of the House.\n• Features of Secret Sitting:\no No visitors or outsiders are allowed in the chamber, lobby, or galleries.\no Proceedings are recorded and published only with the Speaker’s approval.\no Any unauthorized disclosure is considered a gross breach of privilege.\n• Limits:\no Participants cannot keep notes or publish any part of the discussion.\n▪ Revealing secret sitting proceedings is considered a gross breach of privilege of the\nHouse, leading to disciplinary action.\n▪ Only with the Speaker’s consent and a passed motion can such information be officially\ndisclosed."}, {"id": 143, "section": "Polity", "question": "Consider the following statements regarding Form 17C used in the Indian electoral process:\n          1. Form 17C is legally required to be signed by both polling agents and the presiding officer at the close of\npolling.\n          2. It contains information about tendered votes and discrepancies in voter turnout.\n          3. Form 17C is governed by the Representation of the People Act, 1950.\nHow many of the above statements is/are incorrect?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "a", "explanation": "•   Statements 1 and 2 are correct. Form 17C Part I records key polling day data such as votes cast, EVM serial\nnumbers, tendered votes, and any discrepancies observed. It must be signed by the Presiding Officer and\npolling agents for validity, ensuring transparency and consensus on the recorded numbers.\n•   Statement 3 is incorrect — Form 17C is governed under the Conduct of Election Rules, 1961, framed under\nthe Representation of the People Act, 1951, not 1950.\nAbout Form 17C:\n• What it is:\no Form 17C is a mandatory election document that records booth-wise voter turnout and election\nresults.\n• Its parts:\no Part 1: Account of Votes Recorded — includes booth-wise data on the number of electors, votes\ncast, Electronic Voting Machine (EVM) identification, tendered ballots, and discrepancies.\no Part 2: Result of Counting — provides candidate-wise vote counts obtained by pressing the result\nbutton on the EVM.\n• Law governed under:\no Governed by the Conduct of Election Rules, 1961, framed under the Representation of the\nPeople Act, 1951.\n• Procedures laid down:\no Part 1 is filled by the Presiding Officer after polling, signed by polling agents, and sealed in a\n‘Strong Room.’\no Part 2 is filled by the Returning Officer on counting day, verified, signed by counting agents, and\nofficially declared.\n• Functions and powers of Form 17C:\no Ensures transparency and accountability of votes recorded and counted.\no Enables cross-verification of voter turnout and vote counts.\no Helps address discrepancies and strengthens trust in the electoral process.\no Legally binding for polling and counting officials, with signatures mandatory for validation."}, {"id": 144, "section": "Polity", "question": "Consider the following statements regarding Section 301 of the Trade Act of 1974:\n        Statement-I: It empowers the United States to unilaterally impose trade sanctions and tariffs on foreign\nnations without prior approval from the World Trade Organization (WTO).\n        Statement-II: The Office of the United States Trade Representative (USTR) uses this mechanism to address\n\"unreasonable\" or \"discriminatory\" trade practices that burden U.S. commerce.\nWhich one of the following is correct in respect of the above statements?", "options": {"a": "Both Statement-I and Statement-II are correct and Statement-II is the correct explanation for\nStatement-I", "b": "Both Statement-I and Statement-II are correct and Statement-II is not the correct explanation for\nStatement-I", "c": "Statement-I is correct but Statement-II is incorrect", "d": "Statement-I is incorrect but Statement-II is correct"}, "correct": "a", "explanation": "Explanation:\n• Both statements are correct. Statement-I accurately describes the unilateral nature of Section 301, which\nhas historically been a point of contention in international trade because it allows the U.S. to act as \"judge\nand jury\" before seeking multilateral consensus via the WTO.\n•   Statement-II provides the underlying legal justification and objective for such power: the USTR’s\nmandate to investigate and eliminate foreign barriers—such as intellectual property theft or excess\nmanufacturing capacity—that harm American interests.\n•   Statement-II explains why the U.S. maintains such a broad, unilateral tool (Statement-I), as it views these\n\"unreasonable\" practices as requiring a swift domestic response to protect its domestic industry,\nespecially when international bodies are seen as slow or ineffective."}, {"id": 145, "section": "Polity", "question": "Which of the following is/are the discretionary function(s) of the Governor?\n         1. Selecting the Chief Minister when no party has a clear majority in the State Legislative Assembly.\n         2. Dismissing the Council of Ministers if it loses the confidence of the Assembly but refuses to resign.\n         3. Reserving a bill for the consideration of the President of India.\nSelect the correct answer using the code given below:", "options": {"a": "1 and 3 only", "b": "2 only", "c": "1, 2 and 3", "d": "None of the above"}, "correct": "c", "explanation": "•   While the Governor generally acts on the \"aid and advice\" of the Council of Ministers, the Constitution grants\ncertain discretionary powers.\n•   Statement 1 is correct; in a \"hung assembly,\" the Governor uses their discretion to invite the leader of the\nparty or coalition most likely to command a majority.\n•   Statement 2 is correct; if a government loses a vote of no-confidence and the Chief Minister refuses to step\ndown, the Governor can exercise discretion to dismiss the ministry.\n•   Statement 3 is also correct; deciding whether a bill should be reserved for the President under Article 200 is a\ndiscretionary power (except for the mandatory reservation regarding High Courts). These powers are\nintended to ensure the constitutional machinery of the state functions correctly during political crises.\nHowever, the use of these powers has often been a point of friction between the Center and States.\n•   The Supreme Court has ruled that such discretion should not be arbitrary and must be based on objective\nfacts. This \"discretionary\" role is what distinguishes the Governor's office from that of the President, who has\nvirtually no constitutional discretion."}, {"id": 146, "section": "Polity", "question": "Which of the following functions are performed by the Governor of a State in India?\n         1. Appointing the Chairman and members of the State Public Service Commission.\n         2. Granting pardons for offenses against Central laws.\n         3. Promulgating ordinances when the State Legislature is not in session.\n         4. Consulting with the President regarding the appointment of judges to the State High Court.\nSelect the correct answer using the code given below:", "options": {"a": "1, 2 and 3 only", "b": "1, 3 and 4 only", "c": "2, 3 and 4 only", "d": "1, 2, 3 and 4"}, "correct": "b", "explanation": "•   Statement 1 is correct; the Governor appoints the Chairman and members of the State Public Service\nCommission (SPSC), although they can only be removed by the President.\n•   Statement 2 is incorrect. Under Article 161, the Governor’s pardoning power is limited to offenses against\nState laws. They do not have the power to pardon offenses against Central laws or death sentences (except\nfor suspension, remission, or commutation).\n•   Statement 3 is correct; Article 213 empowers the Governor to promulgate ordinances when the assembly is\nin recess, provided the circumstances require immediate action.\n•   Statement 4 is also correct; while the President formally appoints High Court judges, the Governor is\nconsulted as part of the process. Additionally, the Governor has significant discretionary powers, such as the\nselection of a Chief Minister in a hung assembly or recommending the imposition of President's Rule (Article\n356).\n•   All executive actions of the state government are formally taken in the name of the Governor. This multi-\ndimensional role makes the Governor both a constitutional head and a representative of the Union."}, {"id": 147, "section": "Polity", "question": "In the context of Constitutional Morality, consider the following:\n         | Feature | Objective |\n         | 1. Institutional Restraint | Preventing any branch of government from overstepping its bounds |\n         | 2. Non-Arbitrariness | Ensuring state actions are based on reasoned law |\n         | 3. Protection of Minorities | Safeguarding rights against majoritarian impulses |\nWhich of the above matches is/are correct?", "options": {"a": "1 and 2 only", "b": "2 and 3 only", "c": "1 and 3 only", "d": "1, 2 and 3"}, "correct": "d", "explanation": "•   Constitutional morality is comprised of several key pillars that ensure a healthy democracy.\n•   Match 1 is correct; Institutional Restraint is essential to the \"Separation of Powers,\" ensuring the Executive,\nLegislature, and Judiciary operate within their constitutional limits.\n•   Match 2 is correct; Non-Arbitrariness is a core component of the \"Rule of Law,\" requiring that the\ngovernment acts based on clear, reasoned laws rather than the personal whims of leaders.\n•   Match 3 is correct; a vital function of constitutional morality is the Protection of Minorities, which prevents\nthe \"Tyranny of the Majority\" by upholding fundamental rights regardless of popular sentiment."}, {"id": 148, "section": "Polity", "question": "Regarding the Essential Commodities Act (ECA) 1955, consider the following statements:\n       1. The Act provides a permanent, fixed list of essential commodities that cannot be changed by the\n            Central Government.\n       2. While the Act is enacted by the Centre, its enforcement, including raids and seizures, is primarily\n            carried out by State Governments.\n       3. The 2020 amendment allows for the regulation of agricultural foodstuffs only under extraordinary\n            circumstances like war or famine.\nHow many of the above statements are incorrect?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "a", "explanation": "•   Statement 1 is incorrect. The ECA does not have a fixed definition or a permanent list. Instead, the Schedule\nof the Act contains a list that the Central Government can expand or shrink via notified orders based on the\nprevailing market situation. For instance, masks and sanitizers were added during the COVID-19 pandemic\nand later removed.\n•   Statement 2 is correct. This is a classic example of cooperative federalism in economic regulation. The Centre\nnotifies the orders and sets the broad policy, but the actual implementation—monitoring stock limits,\nconducting raids on hoarders, and seizures—is delegated to the State Governments.\n•   Statement 3 is correct. The 2020 Amendment sought to provide more freedom to farmers and traders by\nstipulating that agricultural items (like cereals, pulses, and onions) can only be regulated under extraordinary\nconditions. These include war, famine, extraordinary price rises (100% for perishables or 50% for non-\nperishables), or natural calamities. This was intended to encourage investment in storage infrastructure by\nreducing the \"inspector raj\" and the fear of arbitrary stock limits."}, {"id": 149, "section": "Polity", "question": "Consider the following statements regarding Commission on the Status of Women (CSW):\n       Statement I: The Commission on the Status of Women (CSW) is the principal global intergovernmental\nbody dedicated to gender equality.\n       Statement II: It functions as a specialized agency of the United Nations, operating independently of the\nEconomic and Social Council (ECOSOC).\nWhich one of the following is correct in respect of the above statements?", "options": {"a": "Both Statement-I and Statement-II are correct and Statement-II is the correct explanation for\n       Statement-I", "b": "Both Statement-I and Statement-II are correct and Statement-II is not the correct explanation for\n       Statement-I", "c": "Statement-I is correct but Statement-II is incorrect", "d": "Statement-I is incorrect but Statement-II is correct"}, "correct": "c", "explanation": "•   The Commission on the Status of Women (CSW) is the primary global intergovernmental body for gender\nequality, making Statement I correct. It serves as a vital forum where member states, NGOs, and UN agencies\ngather annually to evaluate progress and set global standards.\n•   However, Statement II is incorrect because the CSW is not an independent specialized agency (like the WHO\nor FAO). Instead, it is a functional commission of the United Nations Economic and Social Council (ECOSOC).\nIt was established in 1946 to prepare recommendations and reports to ECOSOC on promoting women's rights\nin political, economic, civil, social, and educational fields.\n•   While UN Women provides the secretariat support for the CSW, the commission remains under the\nadministrative and reporting umbrella of ECOSOC.\n•   Its primary role involves monitoring the implementation of the Beijing Declaration and Platform for Action\nand shaping the international legal norms that protect the rights of women and girls worldwide."}, {"id": 150, "section": "Polity", "question": "Consider the following statements:\n         Statement I: Other Election Commissioners (ECs) can be removed by the President only on the\n    recommendation of the Chief Election Commissioner.\n         Statement II: The Constitution of India provides the same protection against removal to the Election\n    Commissioners as it does to the Chief Election Commissioner.\n         Statement III: A special majority in Parliament is required to remove an Election Commissioner from\n    office.\nWhich one of the following is correct in respect of the above statements?", "options": {"a": "Both Statement II and Statement III are correct and both of them explain Statement I", "b": "Both Statement II and Statement III are correct but only one of them explains Statement I", "c": "Only one of the Statements II and III is correct and that explains Statement I", "d": "is the right choice."}, "correct": "d", "explanation": "•   Statement I is a correct factual premise. According to the Constitution, other ECs or Regional Commissioners\ncan be removed by the President on the recommendation of the CEC.\n•   However, Statement II is incorrect because the Constitution does not provide the same protection to ECs as it\ndoes to the CEC. While the CEC requires a process equivalent to a Supreme Court judge, the other ECs do not\nhave this constitutional security of tenure.\n•   Statement III is incorrect because no special majority in Parliament is required for the removal of an EC; the\nPresident can act simply on the CEC's recommendation. Since both Statements II and III are incorrect, option\n(d) is the right choice."}, {"id": 151, "section": "Polity", "question": "Consider the following statements:\n        Statement-I: The Chief Election Commissioner (CEC) of India cannot be removed from office except in a\n    manner similar to a Judge of the Supreme Court.\n        Statement-II: The Constitution of India grants the CEC security of tenure to ensure the independence of\n    the Election Commission from executive interference.\nWhich one of the following is correct in respect of the above statements?", "options": {"a": "Both Statement-I and Statement-II are correct and Statement-II is the correct explanation for\nStatement-I", "b": "Both Statement-I and Statement-II are correct and Statement-II is not the correct explanation for\nStatement-I", "c": "Statement-I is correct but Statement-II is incorrect", "d": "Statement-I is incorrect but Statement-II is correct"}, "correct": "a", "explanation": "•   Statement-I is correct and is rooted in Article 324(5) of the Constitution. It stipulates that the CEC can only be\nremoved on the grounds of \"proved misbehavior or incapacity\" through a rigorous parliamentary process\ninvolving a special majority. This mirrors the removal process of a Supreme Court Judge.\n•   Statement-II is also correct and provides the underlying rationale for Statement-I. The framers of the\nConstitution intended the Election Commission to be a bedrock of democracy, free from the whims of the\nruling executive. By providing security of tenure that requires a quasi-judicial investigation and a difficult\nlegislative vote, the Constitution ensures that the CEC can make impartial decisions regarding elections.\n•   Thus, Statement-II directly explains why the stringent removal procedure in Statement-I exists."}, {"id": 152, "section": "Polity", "question": "Consider the following statements regarding the structure of the Law Commission of India:\n       1. The Law Commission consists only of full-time members appointed by the President of India.\n       2. The Chairperson of the Law Commission is always a retired Chief Justice of India.\n       3. Ex officio members of the Law Commission include the Secretaries of Legal Affairs and Legislative\n       Affairs.\nHow many of the above statements is/are correct?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "a", "explanation": "The Law Commission includes not only full-time members but also part-time members (Statement 1 is\nincorrect).\nThe Chairperson is usually a retired judge or legal expert, but it is not mandatory for the person to be a retired\nChief Justice of India (Statement 2 is incorrect).\nEx officio members include the Secretaries of Legal Affairs and Legislative Affairs (Statement 3 is correct)."}, {"id": 153, "section": "Polity", "question": "With reference to the National Commission for Women (NCW), consider the following statements:\n       1. NCW is a non-statutory body that works toward raising awareness about gender-based violence.\n       2. One of its roles is to address workplace harassment faced by women.\n       3. The NCW has the power to legislate policies to protect women’s rights.\nWhich of the above statements is/are correct?", "options": {"a": "2 only", "b": "1 and 2 only", "c": "2 and 3 only", "d": "1, 2 and 3"}, "correct": "a", "explanation": "The NCW plays a vital role in advocating for women’s rights, raising awareness on issues like gender-based\nviolence, and contributing to policy changes such as the Protection of Women from Domestic Violence Act. Its\nmain focus is not legal representation in courts but rather addressing systemic issues related to gender\ndiscrimination and inequality.\nNCW is indeed a statutory body formed under the 1990 Act, and one of its roles is to address workplace\nharassment through advocacy, awareness, and support mechanisms. However, the NCW does not have the\nauthority to legislate policies. It can only recommend and advocate for changes to existing laws."}, {"id": 154, "section": "Polity", "question": "In the context of the Essential Commodities Act (ECA), 1955, consider the following statements:\n         1. The Act was invoked during the COVID-19 pandemic to regulate the prices of masks and sanitizers.\n         2. The government can fix the quantity of a commodity any person can hold in stock under this Act.\n         3. Contravention of orders under the Act can lead to imprisonment in addition to fines.\nHow many of the above statements are correct?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "c", "explanation": "•   The Essential Commodities Act (ECA) is a powerful tool for market intervention.\n•   Statement 1 is correct; during the COVID-19 pandemic, the government added hand sanitizers and masks to\nthe Schedule of the Act to prevent profiteering and ensure these critical items remained affordable and\navailable to the general public.\n•   Statement 2 is correct; the power to fix stock limits is a core feature of the Act. It allows the government to\nspecify exactly how much of an essential item (like wheat, pulses, or oilseeds) a trader or wholesaler can\nstore. This is meant to discourage the practice of holding onto stocks to create a \"supply crunch\" that\nartificially drives up prices.\n•   Statement 3 is correct; the legal teeth of the ECA are significant. Under Section 3, contravention of\ngovernment orders can result in a prison term ranging from three months to seven years, in addition to fines.\nFurthermore, authorities have the power to seize and confiscate the commodities, along with any vehicles,\nvessels, or animals used in the transport of the illegal stock, ensuring a strong deterrent against black\nmarketing."}, {"id": 155, "section": "Polity", "question": "With reference to the Essential Commodities Act (ECA), 1955, consider the following statements:\n       1. The Act enables the Central Government to regulate the production and distribution of commodities\n            listed in its Schedule.\n       2. Commodities can be added to or removed from the Schedule only through a Constitutional\n            Amendment.\n       3. The Act can be invoked to fix stock limits for traders to prevent hoarding during extraordinary price\n            rises.\nHow many of the above statements are correct?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "b", "explanation": "•   The Essential Commodities Act, 1955, is a vital legislative tool used to protect consumers from artificial\nscarcity and price volatility.\n•   Statement 1 is correct; it empowers the government to control the supply, distribution, and pricing of items\ndeemed essential.\n•   Statement 2 is incorrect. The Central Government has the power to amend the Schedule to add or remove\ncommodities through a simple executive notification in the Official Gazette, usually in consultation with State\nGovernments. It does not require a Constitutional Amendment.\n•   Statement 3 is correct. One of the primary mechanisms of the ECA is the imposition of stock limits, which\nprevents wholesalers and retailers from hoarding goods to create speculative price hikes. The Act is typically\ntriggered during wars, famines, or natural calamities. For instance, it was used during the COVID-19\npandemic for masks and is invoked if retail prices of non-perishable agricultural produce rise by 50% or\nhorticultural produce by 100%. Violations can lead to imprisonment for up to seven years and the\nconfiscation of the commodities and the vehicles used for their transport."}, {"id": 156, "section": "Polity", "question": "Consider the following statements:\n         Statement I: The Governor of a state has the power to reserve certain bills passed by the State Legislature\nfor the consideration of the President.\n         Statement II: The Governor must reserve any bill that endangers the position of the State High Court.\n         Statement III: The Governor’s power to reserve bills is purely discretionary and cannot be questioned in a\ncourt of law.\nWhich one of the following is correct in respect of the above statements?", "options": {"a": "Both Statement II and Statement III are correct and both of them explain Statement I", "b": "Both Statement II and Statement III are correct but only one of them explains Statement I", "c": "Only one of the Statements II and III is correct and that explains Statement I", "d": "Neither Statement II nor Statement III is correct"}, "correct": "c", "explanation": "•   Statement I is a correct factual statement regarding the veto powers of the Governor.\n•   Statement II is also correct; under the Constitution, the Governor is obligated (mandatory reservation) to\nreserve a bill for the President’s consideration if it threatens the independence or constitutional position of\nthe State High Court. This serves as an explanation for Statement I by providing a specific, mandatory\ninstance of that power.\n•   However, Statement III is incorrect. While the Governor has discretionary powers under Article 200, these\npowers are not absolute or beyond judicial review if exercised mala fide or on irrelevant grounds.\n•   The Supreme Court has clarified in various judgments that the Governor should act as a constitutional guide\nand not use the power of reservation to unnecessarily obstruct state legislation. Other grounds for\nreservation include bills that are ultra vires to the Constitution, opposed to Directive Principles of State Policy,\nor against the larger national interest."}, {"id": 157, "section": "Polity", "question": "Consider the following statements regarding the Census 2027:\n       1. It marks the first instance where the Indian census will be conducted through a entirely digital process\n            using mobile applications.\n       2. The 'Self-Enumeration' facility allows citizens to fill out their details in any of the 22 languages listed in\n            the Eighth Schedule.\nWhich of the above statements are correct?", "options": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "correct": "a", "explanation": "•   Statement 1 is correct because Census 2027 is officially designated as India's first fully digital census, moving\naway from traditional paper-based methods to secure mobile apps and web portals. This transition aims to\nensure real-time data processing and higher accuracy.\n•   Statement 2 is incorrect because, while self-enumeration is a major feature, the portal currently supports 16\nlanguages, not all 22 scheduled languages. This facility allows residents to provide information before the\nenumerator’s visit, enhancing privacy and convenience."}, {"id": 158, "section": "Polity", "question": "In the context of the Indian Constitution, consider the following statements:\n         Statement-I: The Governor of a State can be appointed as the Governor of an adjacent Union Territory or\n    another State simultaneously.\n         Statement-II: The Seventh Constitutional Amendment Act of 1956 facilitates the appointment of the\n    same person as Governor for two or more States.\nWhich one of the following is correct in respect of the above statements?", "options": {"a": "Both Statement-I and Statement-II are correct and Statement-II is the correct explanation for\nStatement-I", "b": "Both Statement-I and Statement-II are correct and Statement-II is not the correct explanation for\nStatement-I", "c": "Statement-I is correct but Statement-II is incorrect", "d": "Statement-I is incorrect but Statement-II is correct"}, "correct": "a", "explanation": "•   Statement-I is correct as it describes a common constitutional practice where a single individual holds the\ngubernatorial office for multiple jurisdictions.\n•   Statement-II is also correct and provides the legal basis for this arrangement. Originally, Article 153 of the\nConstitution provided for a Governor for each state. However, the 7th Constitutional Amendment Act, 1956,\ninserted a provision that allows the President to appoint one person as the Governor of two or more states.\nThis is often done for administrative convenience or during transitional periods.\n•   The Governor acts as the Constitutional Head of the state and a vital link between the Center and the States.\nWhile the Governor is appointed by the President under Article 155, they hold office during the pleasure of\nthe President (Article 156). Although the Governor is the executive head, they generally act on the aid and\nadvice of the Council of Ministers.\n•   However, in the capacity of an Administrator of a Union Territory, they may act independently of the state\ncouncil. This dual role ensures federal stability and coordination between different administrative units."}, {"id": 159, "section": "Polity", "question": "With reference to the Indian Judiciary, consider the following statements:\n       1. Article 50 of the Constitution is a Directive Principle that mandates the separation of the judiciary\n            from the executive.\n       2. Article 227 grants the High Court the power of superintendence over all courts and tribunals\n            throughout the territories in relation to which it exercises jurisdiction.\n       3. The procedure for the investigation of judicial misbehaviour is solely mentioned in the Constitution of\n            India.\nWhich of the above statements are correct?", "options": {"a": "2 and 3 only", "b": "1 and 3 only", "c": "1 and 2 only", "d": "1, 2 and 3"}, "correct": "c", "explanation": "•   Statement 1 is correct. Article 50 (DPSP) directs the State to take steps to separate the judiciary from the\nexecutive in the public services, a cornerstone of the rule of law.\n•   Statement 2 is correct. Article 227 provides the High Court with the power of superintendence, ensuring\nsubordinate courts act within their legal bounds.\n•   Statement 3 is incorrect. While the Constitution (Articles 124 and 217) mentions the \"grounds\" for removal\n(proved misbehaviour or incapacity), the detailed procedure for investigation and proof is provided by the\nJudges (Inquiry) Act, 1968.\n•   The Constitution allows Parliament to regulate this procedure by law. This distinction is crucial: the right to\nremove is Constitutional, but the process of inquiry is statutory."}, {"id": 160, "section": "Polity", "question": "Consider the following statements:\n       Statement I: The Supreme Court in the Veeraswami case (1991) mandated that no FIR can be registered\n       against a judge of the superior judiciary without the prior sanction of the Chief Justice of India.\n       Statement II: Judicial officers are considered \"public servants\" under the Prevention of Corruption Act,\n       1988.\nWhich one of the following is correct in respect of the above statements?", "options": {"a": "Both Statement-I and Statement-II are correct and Statement-II is the correct explanation for\n       Statement-I", "b": "Both Statement-I and Statement-II are correct and Statement-II is not the correct explanation for\n       Statement-I", "c": "Statement-I is correct but Statement-II is incorrect", "d": "Statement-I is incorrect but Statement-II is correct"}, "correct": "b", "explanation": "•   Both statements are correct, but Statement II does not explain why Statement I exists.\n•   Statement II identifies that judicial officers fall under the ambit of the Prevention of Corruption Act, 1988, as\nthey perform public duties. However, Statement I refers to a specific procedural safeguard created by the\njudiciary to protect its independence. In the K. Veeraswami v. Union of India case, the court held that to\nprevent the executive from using the threat of criminal investigation to harass judges, the prior consent of\nthe Chief Justice of India (CJI) is mandatory before registering an FIR or conducting an investigation against a\nsitting judge of a High Court or the Supreme Court. While they are public servants, their unique role requires\nthis additional layer of protection. The explanation for Statement I is the \"independence of the judiciary,\" not\nmerely the status of being a public servant."}, {"id": 161, "section": "Polity", "question": "Consider the following statements regarding the removal of judges in India:\n       1. The procedure for the removal of a Supreme Court judge is governed by Article 124(4) of the\n            Constitution and the Judges (Inquiry) Act, 1968.\n       2. A High Court judge can be removed by the Governor of the respective state on the grounds of proved\n            misbehaviour or incapacity.\n       3. The administrative control of the High Court over subordinate courts under Article 235 includes the\n            power to take disciplinary action against judicial officers.\nWhich of the above statements are correct?", "options": {"a": "1 and 2 only", "b": "1, 2 and 3", "c": "2 and 3 only", "d": "1 and 3 only"}, "correct": "d", "explanation": "•   Statement 1 is correct. Article 124(4) provides the constitutional basis, while the Judges (Inquiry) Act, 1968,\nelaborates on the investigation process for both Supreme Court and High Court judges.\n•   Statement 2 is incorrect because High Court judges are removed by the President, not the Governor. The\nprocess for removing a High Court judge is the same as that of a Supreme Court judge, requiring a special\nmajority in both Houses of Parliament.\n•   Statement 3 is correct. Article 235 vests the High Court with \"control\" over subordinate courts, which the\nSupreme Court has interpreted to include disciplinary jurisdiction over judicial officers, ensuring the\nindependence of the lower judiciary from executive interference. This reflects the constitutional mandate\nunder Article 50 to separate the judiciary from the executive. While Article 227 provides the power of\nsuperintendence, Article 235 specifically handles administrative and disciplinary control, forming a robust\nframework for judicial accountability and independence."}, {"id": 162, "section": "Polity", "question": "Consider the following:\n       Statement I: MPs enjoy absolute immunity under Article 105(2) for anything said inside the Parliament.\n       Statement II: The Union Government can move a privilege notice against a member for making\nmisleading statements.\n       Statement III: Courts are barred from questioning the validity of any proceedings in Parliament on the\ngrounds of procedural irregularity.\nWhich one of the following is correct in respect of the above statements?", "options": {"a": "Both Statement II and Statement III are correct and both of them explain Statement I", "b": "Both Statement II and Statement III are correct but only one of them explains Statement I", "c": "Only one of the Statements II and III is correct and that explains Statement I", "d": "Neither Statement II nor Statement III is correct"}, "correct": "b", "explanation": "•   Statement I is a core fact: Article 105(2) provides that no MP shall be liable to any proceedings in any court in\nrespect of anything said or any vote given in Parliament.\n•   Statement II is correct; while members are immune from courts, they are not immune from the House itself.\nIf a member (like the LoP) makes baseless or misleading statements, the government or any other member\ncan move a Privilege Notice. This ensures internal accountability.\n•   Statement III is correct; Article 122 protects the \"sanctity of the house\" by preventing judicial interference in\ninternal proceedings. Regarding the explanation: Statement III explains Statement I because the immunity\nfrom courts is bolstered by the fact that courts cannot even look into \"procedural irregularities\" within the\nHouse."}, {"id": 163, "section": "Polity", "question": "Consider the following statements regarding the tenure and removal of the State Election Commissioner:\n       1. The tenure of the SEC is determined by the Election Commission of India.\n       2. The SEC can be removed only in the same manner as a High Court judge.\n       3. The conditions of the SEC’s service can be varied to their disadvantage after appointment.\nHow many of the above statements is/are incorrect?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "b", "explanation": "Statement 2 is correct. The SEC can be removed only in the manner and on the grounds prescribed for a High\nCourt judge, ensuring their independence.\nStatement 1 is incorrect because the tenure of the SEC is determined by the Governor, not the Election\nCommission of India.\nStatement 3 is incorrect because the conditions of the SEC’s service cannot be varied to their disadvantage after\ntheir appointment."}, {"id": 164, "section": "Polity", "question": "Consider the following statements regarding the legal provisions for foreigners in India:\n       1. The Foreigners Act, 1946, empowers the government to regulate the entry, exit, and presence of\n       foreigners in India.\n       2. The Passport (Entry into India) Act, 1920, defines the conditions under which foreigners can obtain\n       Indian citizenship.\n       3. The Citizenship Act, 1955, provides for naturalization, registration, and birthright citizenship as modes\n       of acquiring Indian citizenship.\nHow many of the above statements are correct?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "b", "explanation": "•   Statement 1 is correct – The Foreigners Act, 1946, gives broad powers to the government to regulate, detain,\nand deport foreigners.\n•   Statement 2 is incorrect – The Passport (Entry into India) Act, 1920, deals with visa and entry regulations,\nnot citizenship acquisition.\n•   Statement 3 is correct – The Citizenship Act, 1955, provides five pathways for citizenship: by birth, descent,\nregistration, naturalization, and incorporation of territory.\nProvisions for Immigration in India\n• The Citizenship Act, 1955: Governs acquisition, renunciation, and termination of Indian citizenship.\n• The Foreigners Act, 1946: Regulates the entry and exit of foreigners in India.\n• The Visa Regulations: Issued under the Passport Act, 1920, defining entry conditions.\n• Refugee Policies: Though India is not a signatory to the 1951 Refugee Convention, it provides asylum on\na case-by-case basis (e.g., Tibetans, Sri Lankan Tamils, Rohingyas)."}, {"id": 165, "section": "History, Art and Culture", "question": "Consider the following statements regarding Bhimbetka rock shelters:\n      1. They depict hunting scenes, social life, and rituals through rock paintings.\n      2. They are located in the Vindhya Range, near the Narmada Valley.\n      3. Bhimbetka was first excavated during the Indus Valley Civilization period.\nHow many of the above statements is/are incorrect?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "a", "explanation": "Statement 3 is incorrect.\nThe Bhimbetka rock shelters, a UNESCO World Heritage Site, are an archaeological treasure showcasing\nprehistoric art and human evolution.\nStatement 1 is correct, as the rock paintings depict a variety of scenes, including hunting, social life, rituals, and\nanimals, offering insight into early human culture and activities.\nStatement 2 is also correct, as Bhimbetka is located in the Vindhya Range near the Narmada Valley in Madhya\nPradesh, an area known for its archaeological and geological significance.\nStatement 3, however, is incorrect. The Bhimbetka rock shelters were discovered in the 20th century by Dr.\nVishnu Wakankar and date back to the Mesolithic period and earlier. They are unrelated to the Indus Valley\nCivilization, which is a distinct and later Bronze Age culture."}, {"id": 166, "section": "History, Art and Culture", "question": "Which of the following are correct about Mahatma Jyotiba Phule’s contributions?\n      1. He coined the term “Dalit” and was the first to use it for oppressed communities.\n      2. He founded India’s first school for girls and was opposed to widow remarriage.\n      3. He co-founded the Bombay Millhands Association and wrote Gulamgiri.\n\n\n\n                                                                               4. He advocated using military labor for rural infrastructure development.\nSelect the correct answer using the code given below:", "options": {"a": "1 and 2 only", "b": "1, 3, and 4 only", "c": "1, 2 and 3 only", "d": "1, 2, 3 and 4"}, "correct": "b", "explanation": "•   Jyotiba Phule was the first leader to use the term “Dalit” for oppressed communities, laying the foundation\nfor anti-caste movements.\n•   He co-founded the Bombay Millhands Association with Narayan Meghaji Lokhande for workers’ rights and\nauthored Gulamgiri, a powerful critique of caste oppression.\n•   He also proposed the use of military labor for building bunds and dams to alleviate rural distress.\n•   Statement 2 is incorrect—Phule supported widow remarriage and established orphanages for widows’\nchildren.\n•   He also founded India’s first school for girls in 1848 along with Savitribai Phule."}, {"id": 167, "section": "History, Art and Culture", "question": "Consider the following statements regarding the spread and evolution of Buddhism:\n      1. Nalanda was founded during Ashoka’s reign as the first Buddhist university.\n      2. Mahayana Buddhism emphasized individual liberation through strict asceticism.\n      3. Ashoka sent missionaries to Sri Lanka, West Asia, and Southeast Asia.\n      4. Vajrayana Buddhism integrates Tantric practices with Mahayana philosophy.\nHow many of the above statements are correct?", "options": {"a": "Only one", "b": "Only two", "c": "Only three", "d": "All four"}, "correct": "b", "explanation": "•   Ashoka’s missionary effort was pivotal: his son Mahendra and daughter Sanghamitra spread Buddhism\nto Sri Lanka, while emissaries went to Greece, Egypt, and Southeast Asia.\n•   Vajrayana Buddhism, which emerged in 8th-century Bengal and Bihar, blended esoteric rituals (mantras,\nmandalas) with Mahayana concepts like compassion and the Bodhisattva path.\n•   Statement 1 is incorrect—Nalanda was founded during the Gupta period, not Ashoka’s reign.\n•   Statement 2 is incorrect—it describes Theravada, while Mahayana focuses on universal salvation.\nOrigins of Buddhism in India:\n• Founded by Siddhartha Gautama (563–483 BCE): Born in Lumbini (Nepal), attained enlightenment\nin Bodh Gaya, and preached the Four Noble Truths & Eightfold Path.\n• Reaction to Vedic Ritualism: Rejected caste hierarchy and Brahminical rituals, emphasizing individual\nenlightenment.\n• Early Patronage: Magadha rulers (Bimbisara, Ajatashatru) supported Buddhism as an alternative to\nBrahmanism.\n• First Buddhist Council (483 BCE): Held at Rajgir to preserve Buddha’s teachings after his death.\n• Ashoka’s Role (3rd Century BCE): Spread Buddhism across India and beyond through edicts and\nmissionaries.\nEvolution & Development of Buddhism\n• Theravada vs. Mahayana: Theravada (original teachings) vs. Mahayana (universal salvation, Bodhisattva\nideal).\n• Monastic Universities: Nalanda, Vikramshila, Taxila became global centers of Buddhist learning.\n• Vajrayana (Tantric Buddhism): Emerged in Bengal & Bihar, blending esoteric rituals with Mahayana\nphilosophy.\n•   Spread Beyond India: Sri Lanka (Ashoka’s son Mahendra), China (via Silk Road), Southeast Asia.\n•   Art & Architecture: Sanchi Stupa, Ajanta Caves, Gandhara Art reflect Buddhist influence."}, {"id": 168, "section": "History, Art and Culture", "question": "Consider the following statements about early Buddhist councils:\n       1. The First Council compiled the Tripitaka after Buddha’s death.\n       2. The Fourth Council under Kanishka formalized the split between Theravada and Mahayana.\n       3. The Second Council at Vaishali introduced the concept of Bodhisattvas.\nWhich of the above statements are correct?", "options": {"a": "1 and 2 only", "b": "1 and 3 only", "c": "2 and 3 only", "d": "1, 2 and 3"}, "correct": "a", "explanation": "Statements 1 and 2 are correct.\n• The First Buddhist Council (483 BCE) was held at Rajgir under Mahakassapa, where Ananda and Upali\nrecited the Buddha’s teachings, forming the Sutta and Vinaya Pitakas.\n• The Fourth Council, convened by Kanishka in Kashmir (1st–2nd century CE), saw the schism between\nTheravada and Mahayana, with Mahayana emphasizing Bodhisattvas and universal salvation.\n• Statement 3 is incorrect—the Second Council at Vaishali (~383 BCE) dealt with monastic discipline, not\ndoctrinal developments like Bodhisattvas."}, {"id": 169, "section": "History, Art and Culture", "question": "Consider the following statements about Maulana Abul Kalam Azad’s contributions to education in India:\n      1. He played a major role in establishing the Indian Institutes of Technology (IITs).\n      2. He founded the Indian Statistical Institute.\n      3. He advocated for liberal and universal education in post-independent India.\nHow many of the above statements is/are incorrect?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "a", "explanation": "Statement 2 is incorrect.\nMaulana Abul Kalam Azad was instrumental in the establishment of premier educational institutions like the\nIITs and also promoted liberal, universal education for a progressive India.\nHowever, he was not the founder of the Indian Statistical Institute, which was founded by Prasanta Chandra\nMahalanobis. Azad’s efforts in education significantly shaped India’s academic landscape."}, {"id": 170, "section": "History, Art and Culture", "question": "Consider the following statements about Sardar Patel’s contributions to the Indian administration and civil\n   services:\n       1. He was instrumental in the creation of the Indian Administrative Service (IAS).\n       2. Patel envisioned the IAS as a robust administrative framework to maintain governance stability in\n            India.\n       3. He viewed the civil services as temporary structures for post-independence governance.\n       4. Patel’s model of civil services was inspired by the British administrative structure but aimed to serve\n            India’s needs.\nWhich of the above statements are correct?", "options": {"a": "1 and 2 only", "b": "1, 3, and 4 only", "c": "1, 2 and 4 only", "d": "1, 2, 3 and 4"}, "correct": "c", "explanation": "•   Statement 1 is correct. Sardar Vallabhbhai Patel played a decisive role in establishing the Indian\nAdministrative Service (IAS) and the Indian Police Service (IPS) as successors to the colonial civil services,\nensuring administrative continuity after independence.\n•   Statement 2 is correct. Patel strongly advocated for a strong, independent, and merit-based civil service,\nfamously calling it the “steel frame” of India, essential for maintaining unity, stability, and efficient\ngovernance in a newly independent nation.\n•   Statement 3 is incorrect. He did not consider civil services as temporary. Instead, he emphasized their\npermanent and indispensable role in nation-building and governance.\n•   Statement 4 is correct. While inspired by the British Indian Civil Service (ICS) structure, Patel adapted it to\nsuit India’s democratic and developmental needs, ensuring accountability to elected representatives while\npreserving administrative neutrality."}, {"id": 171, "section": "History, Art and Culture", "question": "Regarding Savitribai Phule's literary and social contributions, consider the following statements:\n       Statement I: Savitribai Phule used poetry as a medium to promote education and social awareness.\n       Statement II: Her works like Kavya Phule and Bavan Kashi Subodh Ratnakar were written in Sanskrit to\n       reach the scholarly elite.\nWhich one of the following is correct in respect of the above statements?", "options": {"a": "Both Statement-I and Statement-II are correct and Statement-II is the correct explanation for\nStatement-I", "b": "Both Statement-I and Statement-II are correct and Statement-II is not the correct explanation for\nStatement-I", "c": "Statement-I is correct but Statement-II is incorrect", "d": "Statement-I is incorrect but Statement-II is correct"}, "correct": "c", "explanation": "•   Statement-I is correct. Savitribai Phule is often called the \"Mother of modern Marathi poetry.\" She used her\nverses to criticize the caste system and encourage the marginalized to seek education.\n•   Statement-II is incorrect. Her works were written in Marathi, the language of the common people in her\nregion, precisely because her goal was to reach the masses and oppressed communities, not the \"scholarly\nelite\" who typically used Sanskrit.\n•   Writing in the vernacular was a revolutionary act in itself, as it broke the monopoly of the upper castes over\nknowledge and literature. Her poetry collections, such as Kavya Phule (1854), are seminal texts in the history\nof Indian social reform literature. They reflect her deep commitment to rationalism and her belief that\neducation was the \"third eye\" through which the oppressed could see the reality of their condition and work\ntoward liberation."}, {"id": 172, "section": "History, Art and Culture", "question": "Consider the following statements regarding \"Jhumka\" jewellery and its heritage:\n       1. It is a three-dimensional, bell-shaped earring that originated during the Mughal era in Northern India.\n       2. These designs are ineligible for patent protection under current Intellectual Property regimes because\n            they lack a single identifiable creator.\n       3. The design of Jhumkas is deeply rooted in ancient temple sculptures and flourished during the Chola\n            dynasty.\nWhich of the statements given above is/are correct?", "options": {"a": "1 and 2 only", "b": "3 only", "c": "2 and 3 only", "d": "1, 2 and 3"}, "correct": "c", "explanation": "•   Statement 1 is incorrect because the origin of the Jhumka dates back significantly further than the Mughal\nera. It is traced to around 300 BCE, with its roots in South Indian temple traditions.\n•   Statement 2 is correct. Heritage crafts like Jhumkas, Bandhani, or Chikankari are collective traditions passed\ndown through generations. Since patent laws require a \"new and original invention\" by a specific entity, these\ncenturies-old communal designs cannot be patented.\n•   Statement 3 is correct. The Jhumka’s evolution is closely tied to Chola metallurgy and temple jewellery,\nwhere it was originally used to adorn deities before becoming popular among royalty and the public. The\ncurrent global debate on cultural appropriation highlights the vulnerability of these traditional cultural\nexpressions (TCEs), as existing IP frameworks often fail to protect the collective ownership of indigenous\ncommunities against commercial exploitation by global luxury brands."}, {"id": 173, "section": "History, Art and Culture", "question": "With reference to Savitribai Phule, consider the following statements:\n      1. She was the first woman to be professionally trained as a teacher in India.\n      2. She established the Mahila Seva Mandal mainly to advocate for the abolition of the caste system\n           specifically among women.\n      3. The Satyashodhak Samaj, which she actively supported, focused on the social liberation of depressed\n           classes.\nHow many of the above statements are correct?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "b", "explanation": "•   Statement 1 is correct. After being educated by her husband, Jyotirao Phule, Savitribai Phule underwent\nteacher training in Pune and Ahmednagar, making her the first Indian woman to hold such a qualification.\n•   Statement 2 is incorrect in its specific objective; while she founded the Mahila Seva Mandal in 1852, its\nprimary focus was women's rights, awareness about social status, and discussing issues like widowhood,\nrather than being limited to \"abolishing the caste system among women.\"\n•   Statement 3 is correct. The Satyashodhak Samaj (Truth Seekers' Society) was founded by Jyotirao Phule to\nfight caste oppression and promote equality for Dalits and other marginalized sections; Savitribai was an\nintegral leader of this movement. Her life was a testament to the intersectionality of gender and caste\nreform. She also authored Kavya Phule, one of the earliest modern Marathi poetry collections, which served\nas a tool for social awakening."}, {"id": 174, "section": "History, Art and Culture", "question": "Consider the following statements about Periyar’s Self Respect Movement:\n       1. It was primarily aimed at empowering women and promoting gender equality.\n       2. The movement sought to eliminate caste-based discrimination and promote rational thinking.\n       3. The Self Respect Movement encouraged individuals to reject rituals and superstitions.\nHow many of the above statements is/are correct?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "b", "explanation": "Statement 1 is incorrect.\nThe Self Respect Movement, founded by Periyar in 1925, was aimed at eliminating caste-based discrimination,\npromoting rationalism, and encouraging people to reject rituals and superstitions associated with religion and\ncaste.\nAlthough gender equality was a part of the movement, its primary focus was to uplift the non-Brahmin and\nbackward castes. The movement challenged the hegemony of Brahmins and religious\northodoxy, emphasizing the need for social justice and individual dignity through rational thought and self-\nrespect."}, {"id": 175, "section": "History, Art and Culture", "question": "Consider the following statements:\n       1. The \"Dancing Girl\" from Mohenjodaro is the earliest evidence of lost-wax casting in India.\n       2. The Daimabad bronzes belong to the Gupta period and depict refined Buddhist iconography.\n       3. The Pala-Sena schools in Eastern India were known for their distinct regional bronze traditions.\nWhich of the above statements are correct?", "options": {"a": "1 and 2 only", "b": "1, 2 and 3", "c": "2 and 3 only", "d": "1 and 3 only"}, "correct": "d", "explanation": "•   Statements 1 and 3 are correct. The \"Dancing Girl\" found at Mohenjodaro (c. 2500 BCE) is an iconic\nmasterpiece that proves the Indus Valley Civilization had mastered the lost-wax casting technique over four\nmillennia ago. This establishes a long-standing tradition of metalworking in India. Later, during the regional\nflowering phase, the Pala and Sena dynasties in Bihar and Bengal developed highly influential bronze schools,\nprimarily focusing on Buddhist and Hindu deities, which even influenced Himalayan and Southeast Asian art.\n•   Statement 2 is incorrect. While the Daimabad bronzes (c. 1500 BCE) are notable large bronzes showing\nadvanced casting, they belong to the Chalcolithic/Late Harappan period, not the Gupta period. The Gupta\nperiod is known for its own \"classical refinement\" in North India, but Daimabad represents a much earlier\nstage of ritual or ceremonial metal usage. The evolution of bronze art in India moved from the Harappan\nphase (tools and masterworks) to the Early Historic phase (portable icons aiding worship mobility) and finally\nreached its Chola culmination in the South. This historical trajectory shows how bronze became the supreme\nmedium for ritual icons that were durable, portable, and capable of extreme detail."}, {"id": 176, "section": "History, Art and Culture", "question": "Which one of the following best describes the \"lost-wax casting\" (Madhuchista Vidhan) technique used in\n    Indian bronze art?", "options": {"a": "A process where molten metal is poured into a stone-carved cavity to create a relief.", "b": "A method of layering metal sheets over a wooden core to form a hollow icon.", "c": "A technique where a wax model is replaced by molten metal inside a clay mould.", "d": "A cold-forging process where copper and brass are hammered into ritual shapes."}, "correct": "c", "explanation": "•   The lost-wax casting technique, also known as Cire perdue or Madhuchista Vidhan, is the cornerstone of\nIndian bronze sculpture. The process begins with a detailed wax model of the figure. This model is then\ncoated with layers of fine clay to create a solid mould. When the mould is heated, the wax melts and flows\nout (hence \"lost wax\"), leaving a hollow cavity that perfectly preserves the details of the original sculpture.\nMolten metal (typically a copper-based alloy like bronze or the panchaloha tradition) is then poured into this\ncavity. Once the metal cools and solidifies, the clay mould is broken away to reveal the metal icon.\n•   This technique is revolutionary because it allows for fluidity and anatomical precision that subtractive\nmethods (like stone carving) cannot achieve. It has been used since the Harappan phase (e.g., the Dancing\nGirl) and reached its height during the Chola period. The finishing involves filing, polishing, and the ritual\nopening of the eyes."}, {"id": 177, "section": "History, Art and Culture", "question": "Consider the following statements.\n       Statement-I: The Chola period is considered the \"classical peak\" of bronze casting in South India.\n       Statement-II: The Cire perdue technique allowed Chola artisans to create icons with fluid movement and\n       refined anatomy that could be used for temple processions.\nWhich one of the following is correct in respect of the above statements?", "options": {"a": "Both Statement-I and Statement-II are correct and Statement-II is the correct explanation for\n       Statement-I", "b": "Both Statement-I and Statement-II are correct and Statement-II is not the correct explanation for\n        Statement-I", "c": "Statement-I is correct but Statement-II is incorrect", "d": "Statement-I is incorrect but Statement-II is correct"}, "correct": "a", "explanation": "•   Statement I is correct as the Chola dynasty (9th–13th century CE) presided over an era where bronze\nsculpture reached unparalleled aesthetic and technical heights. These bronzes, particularly the Nataraja, are\nglobally celebrated for their elegance and spiritual depth.\n•   Statement II is also correct and directly explains why this period was the \"peak.\" The lost-wax casting (Cire\nperdue or Madhuchista Vidhan) was the core technique that enabled such sophistication. By sculpting the\noriginal figure in
