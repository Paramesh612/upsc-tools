<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INSIGHTS Current Affairs Quiz — March 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Source+Serif+4:ital,wght@0,300;0,400;0,600;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1814;
    --paper: #faf8f4;
    --cream: #f3efe6;
    --accent: #c8430a;
    --gold: #b8960c;
    --correct: #1a6b3c;
    --correct-bg: #edf7f1;
    --wrong: #c0341a;
    --wrong-bg: #fdf1ee;
    --muted: #7a736a;
    --border: #ddd9d0;
    --tag-bg: #ede8df;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Source Serif 4', Georgia, serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
  }

  /* ── Header ── */
  header {
    background: var(--ink);
    color: var(--paper);
    padding: 28px 40px 22px;
    display: flex;
    align-items: baseline;
    gap: 16px;
    position: sticky;
    top: 0;
    z-index: 100;
    border-bottom: 3px solid var(--accent);
  }
  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: 1.45rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    line-height: 1;
  }
  header .subtitle {
    font-size: 0.78rem;
    font-weight: 300;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #b0a898;
    margin-top: 4px;
  }
  .header-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 20px;
  }
  .score-badge {
    font-family: 'Playfair Display', serif;
    font-size: 1rem;
    color: var(--paper);
    opacity: 0.85;
    white-space: nowrap;
  }
  .score-badge span {
    color: #e8c87a;
    font-weight: 600;
  }
  .progress-wrap {
    width: 160px;
    height: 4px;
    background: rgba(255,255,255,0.15);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.4s ease;
  }

  /* ── Layout ── */
  .layout {
    display: flex;
    max-width: 1200px;
    margin: 0 auto;
    min-height: calc(100vh - 73px);
  }

  /* ── Sidebar ── */
  aside {
    width: 240px;
    flex-shrink: 0;
    padding: 28px 0;
    border-right: 1px solid var(--border);
    position: sticky;
    top: 73px;
    height: calc(100vh - 73px);
    overflow-y: auto;
  }
  aside::-webkit-scrollbar { width: 4px; }
  aside::-webkit-scrollbar-track { background: transparent; }
  aside::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .sidebar-title {
    font-size: 0.65rem;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 0 24px 12px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 8px;
  }
  .section-nav {
    list-style: none;
  }
  .section-nav li a {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 24px;
    font-size: 0.82rem;
    color: var(--muted);
    text-decoration: none;
    transition: all 0.15s;
    border-left: 3px solid transparent;
    line-height: 1.3;
  }
  .section-nav li a:hover {
    color: var(--ink);
    background: var(--cream);
    border-left-color: var(--border);
  }
  .section-nav li a.active {
    color: var(--accent);
    background: var(--cream);
    border-left-color: var(--accent);
    font-weight: 600;
  }
  .sec-count {
    margin-left: auto;
    font-size: 0.7rem;
    background: var(--tag-bg);
    padding: 2px 7px;
    border-radius: 10px;
    color: var(--muted);
    flex-shrink: 0;
  }

  /* ── Main Content ── */
  main {
    flex: 1;
    padding: 40px 48px;
    overflow-y: auto;
  }

  /* ── Section ── */
  .quiz-section {
    margin-bottom: 64px;
  }
  .section-heading {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 32px;
    padding-bottom: 16px;
    border-bottom: 2px solid var(--border);
  }
  .section-icon {
    width: 40px;
    height: 40px;
    background: var(--ink);
    color: var(--paper);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Playfair Display', serif;
    font-size: 1.1rem;
    font-weight: 700;
    flex-shrink: 0;
  }
  .section-heading h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1.55rem;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .section-heading .sec-stats {
    margin-left: auto;
    font-size: 0.78rem;
    color: var(--muted);
  }

  /* ── Question Card ── */
  .q-card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 2px;
    margin-bottom: 24px;
    overflow: hidden;
    transition: box-shadow 0.2s;
  }
  .q-card:hover {
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }

  .q-header {
    display: flex;
    align-items: flex-start;
    gap: 16px;
    padding: 22px 24px 18px;
    background: var(--cream);
    border-bottom: 1px solid var(--border);
  }
  .q-num {
    font-family: 'Playfair Display', serif;
    font-size: 0.9rem;
    font-weight: 700;
    color: var(--accent);
    line-height: 1.6;
    flex-shrink: 0;
    min-width: 28px;
  }
  .q-text {
    font-size: 0.93rem;
    line-height: 1.7;
    font-weight: 400;
    white-space: pre-wrap;
  }

  .q-body {
    padding: 18px 24px;
  }

  /* ── Options ── */
  .options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 0;
  }
  .opt-btn {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 12px 16px;
    border: 1.5px solid var(--border);
    border-radius: 2px;
    background: var(--paper);
    cursor: pointer;
    text-align: left;
    font-family: 'Source Serif 4', serif;
    font-size: 0.865rem;
    line-height: 1.5;
    color: var(--ink);
    transition: all 0.15s;
  }
  .opt-btn:hover:not(:disabled) {
    border-color: var(--ink);
    background: var(--cream);
  }
  .opt-btn .opt-label {
    font-weight: 700;
    font-family: 'Playfair Display', serif;
    color: var(--muted);
    flex-shrink: 0;
    min-width: 18px;
    transition: color 0.15s;
  }
  .opt-btn:disabled {
    cursor: default;
  }
  .opt-btn.correct {
    border-color: var(--correct);
    background: var(--correct-bg);
    color: var(--correct);
  }
  .opt-btn.correct .opt-label {
    color: var(--correct);
  }
  .opt-btn.wrong {
    border-color: var(--wrong);
    background: var(--wrong-bg);
    color: var(--wrong);
  }
  .opt-btn.wrong .opt-label {
    color: var(--wrong);
  }
  .opt-btn.reveal-correct {
    border-color: var(--correct);
    background: var(--correct-bg);
    color: var(--correct);
    opacity: 0.7;
  }
  .opt-btn.reveal-correct .opt-label {
    color: var(--correct);
  }
  .indicator {
    margin-left: auto;
    font-size: 1rem;
    flex-shrink: 0;
  }

  /* ── Explanation ── */
  .explanation {
    display: none;
    margin-top: 16px;
    padding: 16px 18px;
    background: #f8f6f1;
    border-left: 3px solid var(--gold);
    border-radius: 0 2px 2px 0;
    font-size: 0.84rem;
    line-height: 1.75;
    white-space: pre-wrap;
    color: #3a342c;
    animation: fadeIn 0.3s ease;
  }
  .explanation.visible {
    display: block;
  }
  .explanation-label {
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 8px;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ── Status dot in sidebar ── */
  .q-status-strip {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    padding: 8px 24px 16px;
  }
  .dot {
    width: 10px;
    height: 10px;
    border-radius: 1px;
    background: var(--border);
    display: inline-block;
    cursor: pointer;
    transition: background 0.2s;
  }
  .dot.correct { background: var(--correct); }
  .dot.wrong { background: var(--wrong); }
  .dot.current { outline: 2px solid var(--ink); outline-offset: 1px; }

  /* ── Restore banner ── */
  #restore-banner {
    display: none;
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--ink);
    color: var(--paper);
    padding: 14px 20px;
    border-radius: 2px;
    font-size: 0.84rem;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    z-index: 200;
    border-left: 4px solid var(--gold);
    max-width: 340px;
    animation: slideUp 0.3s ease;
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  #restore-banner .banner-title {
    font-family: 'Playfair Display', serif;
    font-size: 0.92rem;
    font-weight: 600;
    margin-bottom: 4px;
  }
  #restore-banner .banner-sub {
    color: #b0a898;
    font-size: 0.78rem;
    margin-bottom: 12px;
  }
  .banner-btns { display: flex; gap: 10px; }
  .btn-resume {
    padding: 7px 16px;
    background: var(--accent);
    color: #fff;
    border: none;
    font-family: 'Source Serif 4', serif;
    font-size: 0.8rem;
    cursor: pointer;
    border-radius: 1px;
  }
  .btn-dismiss {
    padding: 7px 16px;
    background: transparent;
    color: var(--paper);
    border: 1px solid rgba(255,255,255,0.3);
    font-family: 'Source Serif 4', serif;
    font-size: 0.8rem;
    cursor: pointer;
    border-radius: 1px;
  }

  /* ── Stats bar ── */
  .stats-bar {
    display: flex;
    gap: 28px;
    padding: 12px 24px;
    background: var(--cream);
    border-bottom: 1px solid var(--border);
    font-size: 0.78rem;
    color: var(--muted);
  }
  .stats-bar strong { color: var(--ink); }

  /* ── Responsive ── */
  @media (max-width: 768px) {
    aside { display: none; }
    main { padding: 24px 20px; }
    .options { grid-template-columns: 1fr; }
    header { padding: 18px 20px; }
  }
</style>
</head>

<header>
  <div>
    <h1>INSIGHTS Current Affairs Quiz</h1>
    <div class="subtitle">March 2026 Compilation</div>
  </div>

</div>

<div class="layout">

    <ul class="section-nav" id="section-nav"></ul>
  </aside>
  <main id="quiz-main"></main>
</div>

<script>
const QUESTIONS = [{"id": 1, "section": "Economy", "question": "Consider the following regarding the accommodative policy stance and its fiscal-monetary linkages:\n      1. Accommodative stance supports fiscal consolidation by reducing interest expenditure.\n      2. It can trigger crowding out of private investment by raising interest rates.\n      3. It is maintained only during revenue surplus years by the government.\nHow many of the above statements are correct?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "a", "explanation": "•   Statement 1 is correct. By lowering bond yields and borrowing costs, accommodative stance reduces\ninterest payments on public debt, aiding fiscal management.\n•   Statement 2 is incorrect. Crowding out happens under tight monetary policy, not accommodative.\n•   Statement 3 is incorrect. Fiscal deficits are often high during accommodative periods; the stance is not\ncontingent on revenue surplus.\n•   What is an Accommodative Stance?\no An accommodative stance is a monetary policy approach adopted by central banks like the RBI\nto stimulate economic activity. It generally involves keeping interest rates low and ensuring\nample liquidity in the system.\n•   When is it Adopted?\no When economic growth slows or is below potential.\no When inflation is low or within target range.\no During periods needing boosts in consumption, investment, and employment.\no In response to financial shocks or global economic uncertainties.\n•   Objectives of the Accommodative Stance:\no Promote credit flow and private investment.\no Encourage borrowing and spending by lowering the cost of capital.\no Revive demand in the economy.\no Ensure liquidity support to stressed sectors.\n•   Tools Used by RBI under Accommodative Stance:\no Reducing Repo Rate: Lowers borrowing cost for commercial banks.\no Open Market Operations (OMOs): RBI purchases government securities to inject liquidity.\no Long-Term Repo Operations (LTROs): Provide longer-term liquidity at low rates.\no Cash Reserve Ratio (CRR) adjustments: Temporarily reduce CRR to enhance bank liquidity.\no Moral Suasion & Regulatory Forbearance: RBI nudges banks to increase lending.\n•   Implications on the Indian Economy:\no Boosts consumption and investment, driving GDP growth.\no Reduces interest burden on borrowers.\no May lead to asset price inflation if excess liquidity persists.\no If prolonged, it may fuel inflationary pressures and weaken the rupee.\no Supports employment generation in the short term."}, {"id": 2, "section": "Economy", "question": "Consider the following statements:\n      1. India’s Strategic Petroleum Reserve (SPR) Phase-I consists of three locations: Visakhapatnam,\n          Mangaluru, and Padur.\n      2. The 90-day net import reserve recommended by the IEA can only be met through government-owned\n          SPRs.\n      3. India is a full-time member of the International Energy Agency (IEA).\nHow many of the above statements are correct?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "a", "explanation": "•   Statement 1 is correct. India’s Phase-I SPR program consists of three underground rock cavern facilities:\nVisakhapatnam (Andhra Pradesh), Mangaluru (Karnataka), and Padur (Karnataka), with a total capacity of\n5.33 MMT.\n•   Statement 2 is incorrect. The IEA recommendation that member nations maintain emergency oil stocks\nequivalent to 90 days of net imports does not dictate that the stocks must be solely in government-owned\nSPRs. They can be a combination of government-owned strategic stocks, stocks held by public sector\nrefineries, and even stocks held by private oil companies (commercial stocks). In India’s case, while the SPRs\ncover about 9.5 days, the combined stocks with oil companies bring the total cover significantly higher.\n•   Statement 3 is incorrect. India is an Associate Member of the IEA, not a full-time member. Full membership\nrequires meeting specific criteria, including the 90-day reserve requirement. However, India collaborates\nclosely with the IEA as part of its broader Energy Security Strategy.\n•   Energy sovereignty is crucial for India, as it imports over 88% of its crude requirement. SPRs act as a\n\"specialized insurance policy\" to protect the economy from price shocks triggered by geopolitical wars or\nnatural disasters."}, {"id": 3, "section": "Economy", "question": "Consider the following statements about the Accommodative Stance of the RBI:\n      1. It aims to support economic growth by maintaining higher real interest rates.\n      2. It involves increasing liquidity through tools like long-term repo operations (LTROs) and Open Market\n           Operations (OMOs).\n      3. It is typically maintained during periods of demand-side inflationary pressures.\nHow many of the above statements are correct?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "a", "explanation": "•   Statement 1 is incorrect. Accommodative stance involves lowering real interest rates, not raising them.\n•   Statement 2 is correct. Instruments like Long-Term Repo Operations (LTROs) and Open Market\nOperations (OMOs) inject liquidity, aligning with accommodative policy.\n•   Statement 3 is incorrect. It is used during weak growth and supply-side shocks, not demand-side\ninflation, which requires tightening to prevent overheating.\n• What is an Accommodative Stance?\no An accommodative stance is a monetary policy approach adopted by central banks like the RBI\nto stimulate economic activity. It generally involves keeping interest rates low and ensuring\nample liquidity in the system.\n• When is it Adopted?\no When economic growth slows or is below potential.\no When inflation is low or within target range.\no During periods needing boosts in consumption, investment, and employment.\no In response to financial shocks or global economic uncertainties.\n• Objectives of the Accommodative Stance:\no Promote credit flow and private investment.\no Encourage borrowing and spending by lowering the cost of capital.\no Revive demand in the economy.\no Ensure liquidity support to stressed sectors.\n•   Tools Used by RBI under Accommodative Stance:\no Reducing Repo Rate: Lowers borrowing cost for commercial banks.\no Open Market Operations (OMOs): RBI purchases government securities to inject liquidity.\no Long-Term Repo Operations (LTROs): Provide longer-term liquidity at low rates.\no Cash Reserve Ratio (CRR) adjustments: Temporarily reduce CRR to enhance bank liquidity.\no Moral Suasion & Regulatory Forbearance: RBI nudges banks to increase lending.\n•   Implications on the Indian Economy:\no Boosts consumption and investment, driving GDP growth.\no Reduces interest burden on borrowers.\no May lead to asset price inflation if excess liquidity persists.\no If prolonged, it may fuel inflationary pressures and weaken the rupee.\no Supports employment generation in the short term."}, {"id": 4, "section": "Economy", "question": "Consider the following statements:\n      1. India’s Strategic Petroleum Reserve (SPR) Phase-I consists of three locations: Visakhapatnam,\n           Mangaluru, and Padur.\n      2. The 90-day net import reserve recommended by the IEA can only be met through government-owned\n           SPRs.\n      3. India is a full-time member of the International Energy Agency (IEA).\nHow many of the above statements are correct?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "a", "explanation": "•   Statement 1 is correct. India’s Phase-I SPR program consists of three underground rock cavern facilities:\nVisakhapatnam (Andhra Pradesh), Mangaluru (Karnataka), and Padur (Karnataka), with a total capacity of\n5.33 MMT.\n•   Statement 2 is incorrect. The IEA recommendation that member nations maintain emergency oil stocks\nequivalent to 90 days of net imports does not dictate that the stocks must be solely in government-owned\nSPRs. They can be a combination of government-owned strategic stocks, stocks held by public sector\nrefineries, and even stocks held by private oil companies (commercial stocks). In India’s case, while the SPRs\ncover about 9.5 days, the combined stocks with oil companies bring the total cover significantly higher.\n•   Statement 3 is incorrect. India is an Associate Member of the IEA, not a full-time member. Full membership\nrequires meeting specific criteria, including the 90-day reserve requirement. However, India collaborates\nclosely with the IEA as part of its broader Energy Security Strategy.\n•   Energy sovereignty is crucial for India, as it imports over 88% of its crude requirement. SPRs act as a\n\"specialized insurance policy\" to protect the economy from price shocks triggered by geopolitical wars or\nnatural disasters."}, {"id": 5, "section": "Economy", "question": "With reference to the Raajmarg Infra Investment Trust (RIIT), which of the following statements are correct?\n         1. It is registered under the Indian Trusts Act, 1882, as an irrevocable trust.\n         2. The day-to-day management of the assets is handled directly by the National Highways Authority of\n              India (NHAI).\n         3. The listing of RIIT on the Bombay Stock Exchange (BSE) allows retail investors to participate in\n              infrastructure ownership.\nSelect the correct answer using the code given below:", "options": {"a": "1 and 2 only", "b": "2 and 3 only", "c": "1 and 3 only", "d": "1, 2 and 3"}, "correct": "c", "explanation": "•   Statement 1 is correct. RIIT is constituted as an irrevocable trust under the Indian Trusts Act, 1882, and is\nregistered with SEBI. This legal structure ensures that the assets are held for the benefit of the unit holders\nand are protected from the liabilities of the sponsor.\n•   Statement 2 is incorrect. While NHAI is the sponsor, the day-to-day management is handled by a specialized\nentity called Raajmarg Infra Investment Managers Private Limited (RIIMPL). In an InvIT structure, the\n\"Investment Manager\" is responsible for operational decisions, toll collection management, and optimizing\nthe portfolio, ensuring a professional separation between the government body and the trust's commercial\noperations.\n•   Statement 3 is correct. One of the primary significances of listing RIIT on the BSE is the democratization of\ninfrastructure investment. Previously, large-scale assets like national highways were only accessible to\ninstitutional giants or sovereign wealth funds. Listing allows individual retail investors to buy units, effectively\nowning a piece of India’s highway infrastructure. This helps the NHAI unlock equity from completed roads\n(Asset Monetization) and reinvest those funds into greenfield projects or expressways, reducing the\ngovernment's reliance on high-interest bank loans or the union budget."}, {"id": 6, "section": "Economy", "question": "In the context of fuel pricing in India, what does 'Refinery Transfer Price' (RTP) specifically include?", "options": {"a": "Only the cost of the raw crude oil imported from international markets.", "b": "The commission paid to dealers for the sale of petrol and diesel.", "c": "The total retail price of fuel after adding Central Excise and State VAT.", "d": "The price charged by refineries to OMCs, including refining costs, ocean freight, and port charges."}, "correct": "d", "explanation": "•   The Refinery Transfer Price (RTP) is a critical intermediate step in fuel price derivation. It is the price that\nrefineries (like those owned by Reliance or IOCL) charge to Oil Marketing Companies (OMCs). This price is not\njust the cost of crude oil; it includes the actual cost of refining (processing crude into petrol or diesel) plus the\nlogistics involved in getting the crude to the refinery, such as ocean freight, insurance, and port charges.\n•   Because India imports roughly 85% of its oil, the RTP is highly susceptible to global benchmarks and currency\nfluctuations. Once the OMCs receive the fuel at the RTP, they add their own operational margins and\ntransportation costs before the Central Excise Duty and State VAT are applied.\n•   The Dealer Commission is added last. Understanding the RTP is essential for analyzing why domestic fuel\nprices might remain high even if global crude prices drop slightly, as the costs of refining and freight are also\nvariable."}, {"id": 7, "section": "Economy", "question": "In the context of the AI industry's shift toward \"Tokenomics,\" which of the following best describes the\n   significance of a \"Context Window\"?", "options": {"a": "and", "b": "describes a \"sandbox\" or \"firewall,\" not a\n    context window. In the current global competition, models with larger context windows and lower cost-per-\n    token are highly attractive for developers building automated systems that process vast amounts of\n    background data daily.", "c": "is correct because the context window defines how many tokens (units of data) the model can\n    \"see\" or \"remember\" at any given moment. For example, if a model has a 128k token context window, it can\n    process a very long document or a lengthy conversation history in one go.\n•   However, once the conversation exceeds this limit, the model starts losing track of the earlier parts of the\n    interaction because those tokens fall outside the \"window.\" This is directly related to the statelessness of AI\n    models; they do not have long-term memory of users unless the history is contained within the current\n    context window. This limit affects the complexity of tasks an AI Agent can perform.\n\n\n\n\n                                                                                 •   Options", "d": "are incorrect because speed is measured in tokens-per-second (throughput), and data\n    sovereignty relates to hosting, not the window size. Option"}, "correct": "c", "explanation": "•   The term \"Context Window\" is a fundamental constraint and feature of Large Language Models (LLMs). As\nthe AI industry shifts toward tokenomics, understanding this limit is crucial.\n•   Option (c) is correct because the context window defines how many tokens (units of data) the model can\n\"see\" or \"remember\" at any given moment. For example, if a model has a 128k token context window, it can\nprocess a very long document or a lengthy conversation history in one go.\n•   However, once the conversation exceeds this limit, the model starts losing track of the earlier parts of the\ninteraction because those tokens fall outside the \"window.\" This is directly related to the statelessness of AI\nmodels; they do not have long-term memory of users unless the history is contained within the current\ncontext window. This limit affects the complexity of tasks an AI Agent can perform.\n•   Options (a) and (d) are incorrect because speed is measured in tokens-per-second (throughput), and data\nsovereignty relates to hosting, not the window size. Option (b) describes a \"sandbox\" or \"firewall,\" not a\ncontext window. In the current global competition, models with larger context windows and lower cost-per-\ntoken are highly attractive for developers building automated systems that process vast amounts of\nbackground data daily."}, {"id": 8, "section": "Economy", "question": "Consider the following statements regarding tariffs and their implications:\n      1. Tariffs are imposed only at the consumer level and never affect businesses directly.\n      2. Anti-dumping tariffs are used to protect domestic industries from unfair pricing practices.\n      3. Specific tariffs are charged per unit of a good, regardless of its price.\nHow many of the above statements are correct?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "b", "explanation": "Statement 1 is incorrect.\n•   Tariffs are paid at the border by importers, which are often businesses. These businesses may absorb the\ncost, pass it on to consumers, or adjust supply chains. Thus, businesses are directly affected.\n•   Statement 2 is correct. Anti-dumping duties are imposed when foreign producers sell goods below market\nvalue (sometimes below cost) to gain market share. This undermines domestic industries, and the tariffs\nrestore fair competition.\n•   Statement 3 is also correct. A specific tariff is a flat fee charged per quantity (e.g., $5 per kilogram), making it\nindependent of the product’s value."}, {"id": 9, "section": "Economy", "question": "Consider the following statements regarding the significance of Central Value Added Tax (CENVAT):\n      1. It simplifies the taxation system for manufacturers and service providers.\n      2. It increases the overall cost of goods and services due to additional compliance.\n      3. It encourages reinvestment in production and innovation by reducing tax burdens.\nHow many of the above statements are correct?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "b", "explanation": "Statement 1 is correct as CENVAT simplifies the taxation process by allowing credit for input taxes.\nStatement 2 is incorrect because CENVAT reduces costs by eliminating cascading taxes.\nStatement 3 is correct as businesses save costs, which can be reinvested into production and innovation.\nSignificance of CENVAT:\n• Avoids double taxation: Prevents repeated taxation on the same value addition.\n• Simplifies taxation: Reduces the tax burden on manufacturers and service providers.\n• Promotes competitiveness: Encourages businesses to reinvest savings in production and innovation.\n• Consumer benefit: Reduces the overall cost of goods and services by eliminating cascading taxes."}, {"id": 10, "section": "Economy", "question": "Consider the following statements regarding India’s Strategic Petroleum Reserves:\n       1. The reserves are managed by the Indian Strategic Petroleum Reserve Limited (ISPRL), a subsidiary of\n           the Ministry of Power.\n\n\n\n\n                                                                               2. India uses hydrostatic containment in underground rock caverns to store crude oil safely and cost-\n            effectively.\n       3. As an Associate Member of the International Energy Agency (IEA), India is recommended to maintain\n            a 90-day reserve of its net oil imports.\n       4. Phase-II expansion of SPRs includes the construction of new facilities at Chandikhol and Padur.\nWhich of the statements given above are correct?", "options": {"a": "1, 2 and 3 only", "b": "1, 3 and 4 only", "c": "2, 3 and 4 only", "d": "1, 2, 3 and 4"}, "correct": "c", "explanation": "•   Statement 1 is incorrect. While the ISPRL (Indian Strategic Petroleum Reserve Limited) does manage the\nreserves, it was created under the Oil Industry Development Board (OIDB), which falls under the Ministry of\nPetroleum and Natural Gas, not the Ministry of Power.\n•   Statement 2 is correct. India’s SPRs utilize underground rock caverns. This method is safer than above-\nground tanks as it is protected from external strikes and natural disasters. Hydrostatic containment uses the\npressure of surrounding groundwater to ensure the oil remains trapped within the unlined cavern, preventing\nleaks.\n•   Statement 3 is correct. India is an Associate Member of the IEA. The IEA standard for energy security\nsuggests that member nations should hold emergency oil stocks equivalent to at least 90 days of net imports.\nCurrently, India’s own SPR capacity covers about 9.5 days, supplemented by stocks held by domestic\nrefineries.\n•   Statement 4 is correct. Phase-I included Visakhapatnam, Mangaluru, and Padur. The Phase-II expansion\nfocuses on adding capacity at Chandikhol in Odisha and additional capacity at Padur in Karnataka to enhance\nthe nation's energy sovereignty against global supply shocks."}, {"id": 11, "section": "Economy", "question": "With reference to the Raajmarg Infra Investment Trust (RIIT), consider the following statements:\n       1. It is an investment vehicle registered with SEBI that allows for the monetization of greenfield highway\n            projects before their completion.\n       2. The trust is mandated by law to distribute a minimum of 90% of its net cash flows to its unit holders.\n       3. RIIT acts as a collective investment vehicle, similar to a mutual fund, but is specifically tailored for\n            infrastructure assets.\nHow many of the above statements are correct?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "b", "explanation": "•   Statement 1 is incorrect. Infrastructure Investment Trusts (InvITs) like RIIT are primarily designed to monetize\ncompleted, income-generating assets. The core purpose is to transfer \"toll-ready\" roads from the NHAI to the\nTrust to raise upfront capital. Greenfield projects (new constructions) involve high risk and no immediate cash\nflow, making them unsuitable for the primary monetization function of an InvIT until they are operational.\n•   Statement 2 is correct. Under SEBI (Infrastructure Investment Trusts) Regulations, 2014, these trusts are\nrequired to distribute a significant portion (typically at least 90%) of their net distributable cash flows to the\nunit holders. This ensures a steady stream of income for investors, making it an attractive long-term\ninvestment.\n•   Statement 3 is correct. An InvIT is essentially a collective investment vehicle that pools money from various\ninvestors (both retail and institutional) to invest in infrastructure. It operates on a structure similar to a\nMutual Fund or a Real Estate Investment Trust (REIT), providing liquidity to the infrastructure sector while\nallowing individual investors to own units of massive assets like National Highways. This helps the\ngovernment unlock equity to reinvest in further infrastructure development."}, {"id": 12, "section": "Economy", "question": "Consider the following statements regarding Economic Stabilisation Fund set up by the Government of India:\n        Statement I: The Finance Minister can utilize the Economic Stabilisation Fund to meet unanticipated\nexpenditures caused by global supply chain disruptions.\n        Statement II: The Economic Stabilisation Fund provides the government with fiscal headroom without\nrequiring immediate legislative approval for every emergency disbursement.\n        Statement III: The expenditure from the Economic Stabilisation Fund is designed to be deficit-neutral by\nmanaging it alongside additional receipts.\nWhich one of the following is correct in respect of the above statements?", "options": {"a": "Both Statement II and Statement III are correct and both of them explain Statement I", "b": "Both Statement II and Statement III are correct but only one of them explains Statement I", "c": "Only one of the Statements II and III is correct and that explains Statement I", "d": "Neither Statement II nor Statement III is correct"}, "correct": "a", "explanation": "•   Statement I is correct. The Economic Stabilisation Fund (ESF) is a specialized fiscal mechanism introduced by\nthe Ministry of Finance to help India navigate global headwinds, such as oil price shocks or supply chain\ndisruptions. It acts as a financial buffer against volatile external factors.\n•   Statement II is correct and explains Statement I. The primary purpose of such a fund is to provide fiscal\nheadroom, allowing the government the flexibility to respond to emergencies immediately. Without such a\nmechanism, the government might face legislative delays when quick action is needed to stabilize the\neconomy during a crisis.\n•   Statement III is also correct and explains Statement I. A major concern with emergency spending is its\nimpact on the fiscal deficit. The ESF is managed alongside additional receipts, ensuring that the fiscal deficit\ntarget (4% of GDP for 2025-26) remains unaffected. By being deficit-neutral, the fund allows the government\nto spend on stabilization measures (Statement I) without compromising long-term macroeconomic stability.\n•   Since both the need for flexibility (Statement II) and the ability to maintain fiscal targets (Statement III) are\nthe foundational reasons why the Finance Minister can effectively use this fund for global shocks, both\nstatements explain the utility mentioned in Statement I."}, {"id": 13, "section": "Economy", "question": "Consider the following statements regarding Anti-Dumping Duties (ADD) in India:\n         1. The authority to recommend anti-dumping duties lies with the Directorate General of Trade Remedies\n(DGTR).\n         2. These duties are imposed when imports are priced below the normal value and cause material injury\nto domestic industry.\nWhich of the above statements is/are correct?", "options": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "correct": "c", "explanation": "Statement 1 is correct — the DGTR, under the Ministry of Commerce and Industry, is the nodal agency that\nconducts investigations and recommends ADD to the Ministry of Finance.\nStatement 2 is correct — ADD is imposed when an imported product is sold at a price lower than its normal\nvalue (typically the domestic market price of the exporting country) and such imports cause injury to domestic\nproducers.\nAbout Anti-Dumping Duties:\n• What it is\no Anti-dumping duty is a protectionist tariff imposed on imports priced below their normal value in\nthe exporting country.\no It aims to protect domestic industries from injury caused by unfairly priced imports.\n• Authority to impose in India\no The Directorate General of Trade Remedies (DGTR) under the Ministry of Commerce and Industry\nrecommends anti-dumping duties.\no The Ministry of Finance notifies and levies these duties based on DGTR’s investigation and\nrecommendation.\n• When it is imposed:\no Imposed after evidence of material injury to domestic industry from cheap imports sold at below\nmarket price.\no Duties are typically levied for a period of up to five years and periodically reviewed.\n• Does it violate WTO rules?\no No, it is permitted under Article 6 of the General Agreement on Tariffs and Trade (GATT), 1994.\no The WTO Anti-Dumping Agreement allows members to impose duties to ensure fair trade\npractices."}, {"id": 14, "section": "Economy", "question": "Consider the following statements.\n       Statement-I: LNG is transported in specialized cryogenic ships rather than standard tankers.\n       Statement-II: Natural gas must be cooled to below –160°C to turn it into a liquid state for efficient long-\n       distance maritime transport.\nWhich one of the following is correct in respect of the above statements?", "options": {"a": "Both Statement-I and Statement-II are correct and Statement-II is the correct explanation for\n        Statement-I", "b": "Both Statement-I and Statement-II are correct and Statement-II is not the correct explanation for\n        Statement-I", "c": "Statement-I is correct but Statement-II is incorrect", "d": "Statement-I is incorrect but Statement-II is correct"}, "correct": "a", "explanation": "•   Natural gas in its gaseous state occupies a vast volume, making it economically unfeasible to transport across\noceans in large quantities. To overcome this, it is converted into Liquified Natural Gas (LNG).\n• Statement-II is correct; the liquefaction process involves cooling the gas to approximately –161°C (–258°F) at\natmospheric pressure. This reduces its volume by about 600 times, allowing for much denser energy storage.\nStatement-I is also correct and is directly explained by Statement-II. Because the LNG must be maintained at\nthese extreme sub-zero temperatures throughout the voyage to prevent it from turning back into gas (boil-off), it\ncannot be carried in standard oil tankers. Instead, it requires specialized cryogenic ships equipped with heavily\ninsulated tanks (often spherical or membrane-type). These ships act like giant \"thermos flasks.\" The high cost of\nbuilding and operating these specialized vessels, combined with the energy required for the liquefaction and\nregasification processes, is a major factor in the final price of LNG."}, {"id": 15, "section": "Economy", "question": "With reference to the price determination of Liquified Natural Gas (LNG) and Liquified Petroleum Gas (LPG) in\n    India, consider the following statements:\n        1. India meets more than half of its total LPG requirement through domestic production by Oil\n             Marketing Companies.\n        2. The price of LNG in the spot market is often influenced by the Japan Korea Marker (JKM) index.\n        3. Domestic LPG and LNG prices are generally indexed to or float alongside global crude oil prices.\n        4. Natural gas price spikes have a direct impact on the production cost of urea due to its use in ammonia\n             synthesis.\nHow many of the above statements are correct?", "options": {"a": "Only one", "b": "Only two", "c": "Only three", "d": "All four"}, "correct": "c", "explanation": "•   The pricing of gaseous fuels in India is a complex interplay of global benchmarks and domestic logistics.\n•   Statement 1 is incorrect because 60% of India’s LPG supply is imported, primarily from Saudi Arabia and\nQatar, while only 40% is produced domestically by OMCs like IOC and BPCL.\n•   Statement 2 is correct; the Japan Korea Marker (JKM) is the leading price benchmark for LNG delivered to\nNortheast Asia and is heavily utilized in spot market transactions involving Indian entities.\n•   Statement 3 is correct as both LNG and LPG prices globally are typically indexed to crude oil prices. When\ncrude prices surge due to geopolitical tensions (like the West Asia conflict), gas prices usually follow suit.\n•   Statement 4 is correct because nearly 30% of natural gas is utilized as a feedstock to produce ammonia,\nwhich is a critical component for fertilizers like urea. Therefore, high gas prices can inflate agricultural input\ncosts. Furthermore, India’s reliance on specialized cryogenic ships for LNG transport means that rising\ninsurance premiums during wartime further increase the landed cost of the fuel."}, {"id": 16, "section": "Economy", "question": "Which of the following outcomes is/are correctly matched with their respective WTO Ministerial\n    Conferences?\n       1. Bali Package (2013): Agreement on Trade Facilitation and the 'Peace Clause' for food security.\n       2. Nairobi Package (2015): Elimination of agricultural export subsidies.\n       3. Geneva Package (2022): Landmark deal on curbing harmful fisheries subsidies and a partial TRIPS\n           waiver.\n\n\n\n                                                                                  Select the correct answer using the code given below:", "options": {"a": "1 only", "b": "2 and 3 only", "c": "1 and 3 only", "d": "1, 2 and 3"}, "correct": "d", "explanation": "•   All three pairs are correctly matched. MC9 (Bali) was historic for the Trade Facilitation Agreement (TFA) and\nthe \"Peace Clause,\" which protects developing nations like India from legal challenges regarding their public\nstockholding programs for food security.\n•   MC10 (Nairobi) saw a major win for developing nations with the commitment to abolish agricultural export\nsubsidies, preventing developed nations from artificially lowering prices.\n•   MC12 (Geneva) addressed the global pandemic and environment by agreeing to a TRIPS waiver for COVID-19\nvaccines and a fisheries agreement to curb Illegal, Unreported, and Unregulated (IUU) fishing.\n•   These conferences represent the evolution of the WTO from the controversial \"Singapore Issues\" toward a\nmore development-oriented agenda, though structural challenges like the non-functional Appellate Body\nremain a concern for MC14."}, {"id": 17, "section": "Economy", "question": "Consider the following regarding WTO Ministerial Conference:\n       Statement I: The WTO Ministerial Conference is required to meet at least once every two years.\n       Statement II: The Ministerial Conference is the highest decision-making body of the WTO, established\n    under the Marrakesh Agreement.\nWhich one of the following is correct in respect of the above statements?", "options": {"a": "Both Statement-I and Statement-II are correct and Statement-II is the correct explanation for\n       Statement-I", "b": "Both Statement-I and Statement-II are correct and Statement-II is not the correct explanation for\n       Statement-I", "c": "Statement-I is correct but Statement-II is incorrect", "d": "Statement-I is incorrect but Statement-II is correct"}, "correct": "b", "explanation": "•   Both statements are correct. Statement II correctly identifies the status and origin of the Ministerial\nConference as the supreme body of the WTO, formed after the Marrakesh Agreement replaced GATT.\nStatement I correctly identifies the mandatory frequency of these meetings as per the WTO Agreement.\n•   However, being the \"highest decision-making body\" is not the reason why it must meet every two years; the\nbiennial frequency is a specific administrative rule to ensure regular multilateral dialogue. For Statement II to\nexplain Statement I, it would need to show a causal link (e.g., \"Because it is the highest body, it must meet\nfrequently to resolve urgent trade disputes\").\n•   In WTO law, these are two independent factual requirements. The upcoming MC14 in Cameroon (2026) will\nfocus on critical issues like the Appellate Body restoration and food security."}, {"id": 18, "section": "Economy", "question": "Consider the following statements:\n       Statement-I: The National Monetisation Pipeline 2.0 (NMP 2.0) primarily targets the divestment of equity\n       in Public Sector Undertakings (PSUs) to meet fiscal targets.\n       Statement-II: Asset recycling under NMP 2.0 aims to unlock value from operational brownfield assets to\n       finance fresh infrastructure creation.\nWhich one of the following is correct in respect of the above statements?", "options": {"a": "Both Statement-I and Statement-II are correct and Statement-II is the correct explanation for\n       Statement-I", "b": "Both Statement-I and Statement-II are correct and Statement-II is not the correct explanation for\n       Statement-I", "c": "Statement-I is correct but Statement-II is incorrect", "d": "Statement-I is incorrect but Statement-II is correct"}, "correct": "d", "explanation": "•   Statement-I is incorrect because the National Monetisation Pipeline (NMP) 2.0 is fundamentally different\nfrom disinvestment or privatization. While disinvestment involves selling government equity in PSUs, NMP\nfocuses on monetising operational public infrastructure assets without transferring ownership. The\ngovernment retains the title to the assets, while the private sector is given the right to operate them for a\nfixed period through models like InvITs (Infrastructure Investment Trusts) or PPP concessions.\n•   Statement-II is correct and represents the core philosophy of the NMP: Asset Recycling. The objective is to\nunlock the \"idle\" capital tied up in brownfield assets (existing, operational projects like highways or power\nplants) and reinvest those proceeds into greenfield projects (new infrastructure). This mechanism allows the\ngovernment to accelerate capital expenditure (CAPEX) without significantly increasing the fiscal deficit or\ndirect budgetary burden.\n•   By providing a medium-term roadmap (FY 2026–2030), NMP 2.0 offers visibility to global and domestic\ninvestors, strengthening the overall PPP ecosystem. The focus is on transferring the \"operating risk\" to the\nprivate sector, which is often more efficient in managing such assets, while the public sector focuses on\nbuilding new core infrastructure for the nation."}, {"id": 19, "section": "Ecology and Environment", "question": "Which of the following are features of Blue Category industries under India’s environmental regulation\n    regime?\n         1. They must not generate any hazardous waste or toxic effluents.\n         2. They receive automatic environmental clearance under the EIA Notification, 2006.\n         3. They are regulated under the Environment (Protection) Act, 1986.\n         4. Their classification is intended to support India’s Sustainable Waste Management Rules, 2016.\nSelect the correct answer using the code given below:", "options": {"a": "1 and 2 only", "b": "1, 3, and 4 only", "c": "1, 2 and 3 only", "d": "1, 2, 3 and 4"}, "correct": "b", "explanation": "•   Blue Category industries are defined by non-hazardous operations and minimal air/water pollution, meaning\nthey should not produce toxic effluents or hazardous waste, a core inclusion criterion.\n•   They are regulated under the Environment (Protection) Act, 1986, which empowers CPCB and State Pollution\nControl Boards (SPCBs) to implement zoning, consent, and classification.\n•   Their classification also supports implementation of Sustainable Waste Management Rules, 2016, promoting\nreuse, segregation, composting, biomethanation, and recovery.\n•   However, Statement 2 is incorrect—automatic environmental clearance is not granted to Blue Category\nindustries.\n•   Though less polluting, they must still obtain Consent to Establish (CTE) and Consent to Operate (CTO), albeit\nwith relaxed timelines."}, {"id": 20, "section": "Ecology and Environment", "question": "Consider the following statements about One-Horned Rhinoceros conservation in India:\n      1. Pobitora Wildlife Sanctuary has the largest population of rhinos in India.\n      2. The species prefers grassland ecosystems along rivers and wetlands.\n      3. The one-horned rhino is listed as Critically Endangered by the IUCN.\nHow many of the above statements are correct?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "a", "explanation": "•   Statement 1 is incorrect. Pobitora has the highest density (approx. 107 rhinos in just 16 sq. km), but\nKaziranga has the largest population (~2,613).\n•   Statement 2 is correct. Rhinos are habitat specialists, preferring alluvial floodplains, swamps, and wet\ngrasslands, rich in Saccharum and Vetiveria species.\n•   Statement 3 is incorrect. The species is listed as Vulnerable, not Critically Endangered, on the IUCN Red\nList, reflecting recovery but continued threats."}, {"id": 21, "section": "Ecology and Environment", "question": "Regarding the Chambal River, consider the following statements:\n      1. It is an anterior-drainage river, meaning its course was established before the formation of the\n          Yamuna and Ganges.\n      2. The river is noted for its high pollution levels due to the intensive industrial activity in the Chambal\n          Ravines.\n\n\n\n                                                                                  3. Its deep natural pools serve as critical refuge points for the critically endangered Gharial and the\n           Ganges River Dolphin.\nHow many of the above statements are correct?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "b", "explanation": "•   The Chambal River is one of India's most ecologically significant perennial rivers.\n•   Statement 1 is correct; geologically, it is an anterior-drainage river, signifying it predates the main Himalayan\ndrainage systems it now joins. This ancient lineage contributes to its unique geomorphology.\n•   Statement 2 is incorrect. Chambal is famous for being remarkably pollution-free. This is attributed to local\nfolklore and myths that discouraged human and industrial encroachment for centuries. While the Chambal\nRavines (Badland Topography) are a result of severe soil erosion, they have historically acted as a barrier to\nlarge-scale industrialization, preserving the water quality.\n•   Statement 3 is correct. The river’s hydrology includes deep natural pools that remain even during the lean\nsummer months. These pools are vital for the survival of large aquatic mammals like the Ganges River\nDolphin and reptiles like the Gharial. A large section is protected under the National Chambal Sanctuary."}, {"id": 22, "section": "Ecology and Environment", "question": "Consider the following statements:\n        Statement-I: India has updated its Nationally Determined Contribution (NDC) for the period 2031-2035 to\nalign with the long-term goal of Net-Zero emissions by 2070.\n        Statement-II: The updated NDC targets a reduction in the emissions intensity of India's GDP by 47% by\n2035 from the 2005 levels.\nWhich one of the following is correct in respect of the above statements?", "options": {"a": "Both Statement-I and Statement-II are correct and Statement-II is the correct explanation for\nStatement-I", "b": "Both Statement-I and Statement-II are correct and Statement-II is not the correct explanation for\nStatement-I", "c": "Statement-I is correct but Statement-II is incorrect", "d": "Statement-I is incorrect but Statement-II is correct"}, "correct": "a", "explanation": "•   The Paris Agreement requires countries to submit NDCs every five years, representing their highest possible\nambition for climate action. India’s updated NDC for 2031-2035 is a strategic step toward the Net-Zero 2070\ntarget.\n•   Statement-I is correct as it highlights the alignment of periodic targets with long-term climate neutrality.\n•   Statement-II is also correct and serves as a primary quantitative pillar explaining how the long-term vision in\nStatement-I will be operationalized through measurable reductions in carbon footprint per unit of economic\noutput.\n•   By targeting a 47% reduction in emissions intensity by 2035, India ensures that economic growth (Viksit\nBharat) is decoupled from greenhouse gas emissions. This transition involves scaling up renewable energy,\nenhancing energy efficiency across industrial sectors, and promoting the LiFE movement. The success of\nmeeting 2015 targets ahead of schedule provides the credibility required for these enhanced ambitions.\nTherefore, Statement-II directly supports and explains the strategic direction mentioned in Statement-I."}, {"id": 23, "section": "Ecology and Environment", "question": "Consider the following pairs of Climate Initiatives and their Primary Objectives:\n      | Initiative | Objective |\n      | 1. MISHTI | Restoration of Mangrove habitats and conservation |\n      | 2. LiFE Movement | Promoting community-driven sustainable lifestyles |\n      | 3. PM Surya Ghar | Large-scale solar rooftop installations for households |\n\n\n\n                                                                         | 4. Ek Ped Maa Ke Naam | Carbon Capture and Storage technology development |\nHow many of the above pairs are correctly matched?", "options": {"a": "Only one", "b": "Only two", "c": "Only three", "d": "All four"}, "correct": "c", "explanation": "•   Pair 1 is correctly matched: MISHTI (Mangrove Initiative for Shoreline Habitats & Tangible Incomes) focuses\non mangrove reforestation along India’s coastline, which serves as a natural buffer against cyclones and a\npotent carbon sink.\n•   Pair 2 is correctly matched: The LiFE (Lifestyle for Environment) movement is a global initiative by India to\nencourage mindful consumption and individual actions to combat climate change.\n•   Pair 3 is correctly matched: PM Surya Ghar (Muft Bijli Yojana) aims to provide free electricity to households\nby incentivizing solar rooftop installations, contributing to the non-fossil fuel capacity target.\n•   Pair 4 is incorrectly matched: Ek Ped Maa Ke Naam is a people-centric plantation drive aimed at increasing\ngreen cover through community participation, not a technological project for Carbon Capture, Utilization, and\nStorage (CCUS). While CCUS is part of India’s clean energy missions, it is distinct from this plantation drive."}, {"id": 24, "section": "Ecology and Environment", "question": "Consider the following statements regarding India’s tiger conservation initiatives:\n        1. The Global Tiger Forum is a treaty-based mechanism under the Convention on Biological Diversity\n(CBD).\n        2. M-STrIPES is a digital system that supports patrolling, GIS mapping, and ecological monitoring in tiger\nreserves.\n        3. Project Tiger is legally administered by a statutory body created through amendment of the Wildlife\n(Protection) Act, 1972.\nHow many of the above statements is/are incorrect?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "a", "explanation": "Statement 1 is incorrect.\n•   The Global Tiger Forum is an independent intergovernmental body, not created under any international\ntreaty like the CBD. It facilitates collaboration among tiger-range countries.\n•   Statement 2 is correct. M-STrIPES (Monitoring System for Tigers – Intensive Protection and Ecological\nStatus) is a smart patrolling and ecological monitoring software developed by NTCA for improved\nmanagement.\n•   Statement 3 is also correct. The National Tiger Conservation Authority (NTCA) was constituted by\namending the Wildlife (Protection) Act, 1972 in 2006, giving statutory backing to Project Tiger."}, {"id": 25, "section": "Ecology and Environment", "question": "Consider the following statements regarding the Indian Tiger and its conservation:\n       1. It is the National Animal of India.\n       2. It is listed in Appendix I of CITES.\n       3. Maximum tiger population in India is currently found in Madhya Pradesh.\n       4. The Global Tiger Initiative is a UNDP-led effort for transboundary tiger conservation.\nHow many of the above statements are correct?", "options": {"a": "Only one", "b": "Only two", "c": "Only three", "d": "All four"}, "correct": "c", "explanation": "Statement 4 is incorrect.\n•   The tiger is India’s National Animal, symbolizing strength and biodiversity. It is protected under Appendix I of\nCITES, which prohibits international trade of wild tigers or their derivatives.\n•   As per the latest All India Tiger Estimation, Madhya Pradesh has surpassed Karnataka to host the maximum\nnumber of tigers. Statement 4 is incorrect.\n•   The Global Tiger Initiative (GTI) was launched by the World Bank in 2008, not the UNDP, to coordinate tiger\nconservation across Asia."}, {"id": 26, "section": "Ecology and Environment", "question": "Consider the following statements about IUCN extinction categories:\n       1. \"Extinct\" species may still persist in extremely low numbers in inaccessible wild habitats.\n       2. \"Least Concern\" species have shown signs of population stress but are protected by law.\n       3. \"Not Evaluated\" refers to species that have not yet been formally assessed under IUCN criteria.\nHow many of the above statements is/are incorrect?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "b", "explanation": "Only Statement 3 is correct.\n• Statement 1 is incorrect because \"Extinct (EX)\" means there is no reasonable doubt that the last individual\nhas died, based on exhaustive surveys.\n• Statement 2 is also incorrect. Least Concern (LC) species are those with stable or increasing populations, and\nwhile some may be protected, that is not a criterion for LC status.\n• “Not Evaluated (NE)” simply means the species has not yet been assessed under IUCN's global framework.\nThis is different from DD (Data Deficient), where an evaluation has taken place, but data is lacking."}, {"id": 27, "section": "Ecology and Environment", "question": "Consider the following statements regarding biofuels derived from rice straw:\n       1. Biofuels reduce reliance on fossil fuels by using renewable resources.\n       2. Bioethanol and biogas are examples of fuels derived from rice straw.\n       3. The process of biofuel production completely eliminates greenhouse gas emissions.\nHow many of the above statements is/are incorrect?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "a", "explanation": "Biofuels derived from rice straw are gaining attention as sustainable energy alternatives.\n1. Statement 1 is correct. Biofuels like those derived from rice straw reduce dependency on fossil fuels by\nutilizing renewable agricultural waste, contributing to energy security and sustainability.\n2. Statement 2 is correct. Rice straw can be converted into bioethanol, a liquid biofuel used in blending with\npetrol, and biogas, a gaseous fuel suitable for cooking or electricity generation, making it a versatile\nresource for renewable energy.\n3. Statement 3 is incorrect. While biofuel production from rice straw significantly reduces greenhouse gas\nemissions compared to fossil fuels, it does not entirely eliminate emissions. The processes involved in\nproduction, transportation, and combustion still result in some level of emissions, though far lower than\nconventional fuels."}, {"id": 28, "section": "Ecology and Environment", "question": "Consider the following statements regarding the procedure for notification of tiger reserves in India:\n       1. Only the NTCA can notify a tiger reserve under the Wildlife Protection Act, 1972.\n       2. The core zone of a tiger reserve allows sustainable human habitation and activities.\n       3. The state government submits the proposal to the NTCA for evaluation and approval.\nHow many of the above statements are correct?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "a", "explanation": "Statement 1: Incorrect. Under Section 38V of the Wildlife Protection Act, 1972, the state government, not the\nNational Tiger Conservation Authority (NTCA), has the authority to notify an area as a tiger reserve. The NTCA\nevaluates and approves proposals submitted by the state governments but does not directly notify reserves.\nStatement 2: Incorrect. The core zone of a tiger reserve, also known as the critical tiger habitat, is a strictly\nprotected area where human habitation and activities are prohibited to ensure the safety and preservation of\ntigers and their ecosystems. Sustainable human activities are allowed only in the buffer zone, which surrounds\nthe core area.\nStatement 3: Correct. The process involves the state government identifying potential tiger habitats and\nsubmitting proposals to the NTCA for evaluation and approval. Once approved, the state government officially\nnotifies the tiger reserve."}, {"id": 29, "section": "Ecology and Environment", "question": "Consider the following statements regarding the characteristics of the Oriental Pied Hornbill:\n       1. It is the largest hornbill species found in Asia.\n       2. It is highly adaptable and widespread across its range.\n       3. It is known as a 'forest engineer' due to its role in seed dispersal.\n       4. It primarily inhabits subtropical and tropical moist lowland forests.\nWhich of the above statements are correct?", "options": {"a": "1 and 2 only", "b": "2, 3, and 4 only", "c": "1, 2 and 3 only", "d": "1, 2, 3 and 4"}, "correct": "b", "explanation": "Statement 1: Incorrect. The Oriental Pied Hornbill is not the largest hornbill species in Asia; it is, in fact, the\nsmallest and one of the most common hornbill species found in the region. Larger species like the Great Hornbill\nhold the title for size.\nStatement 2: Correct. The Oriental Pied Hornbill is highly adaptable and thrives in various environments across its\nrange, including forests, plantations, and even human-altered landscapes.\nStatement 3: Correct. Known as a 'forest engineer,' it plays a crucial ecological role by dispersing seeds over large\nareas, aiding in forest regeneration and biodiversity conservation.\nStatement 4: Correct. Its primary habitat includes subtropical and tropical moist lowland forests, although its\nadaptability allows it to survive in secondary forests and other habitats as well."}, {"id": 30, "section": "Ecology and Environment", "question": "Consider the following statements regarding Nilgiri Tahr:\n        Statement I: The Nilgiri Tahr is the only species of caprine found in tropical India and is endemic to the\nWestern Ghats.\n        Statement II: They prefer open montane grasslands interspersed with shola forests and use steep cliffs as\nescape terrain.\nWhich one of the following is correct in respect of the above statements?", "options": {"a": "Both Statement-I and Statement-II are correct and Statement-II is the correct explanation for\nStatement-I", "b": "Both Statement-I and Statement-II are correct and Statement-II is not the correct explanation for\nStatement-I", "c": "Statement-I is correct but Statement-II is incorrect", "d": "Statement-I is incorrect but Statement-II is correct"}, "correct": "b", "explanation": "Explanation:\n• Statement I is correct. The Nilgiri Tahr (Nilgiritragus hylocrius) is indeed the state animal of Tamil Nadu and\nthe only caprine (mountain goat/antelope) found in the tropical region of India. It is endemic to the Western\nGhats, meaning it is found nowhere else in the world. Its range is restricted to a narrow stretch between the\nNilgiri Hills and the Kanyakumari hills.\n• Statement II is correct. Their habitat is highly specific: high-altitude shola-grassland ecosystems. They are\nknown for their incredible agility on steep, rocky cliffs (crags), which they use as escape terrain to avoid\npredators like leopards.\n• However, Statement II does not explain why they are the only caprine in tropical India (Statement I). The\npresence of only one caprine species in this region is a result of evolutionary history and biogeography\n(specifically the isolation of the Western Ghats), whereas Statement II describes their current ecological\npreferences and survival strategies.\n• Therefore, while both statements are individually true, the second is not a causal explanation for the first. The\nNilgiri Tahr's IUCN status is Endangered, primarily due to habitat fragmentation and the loss of these specific\ngrassland-shola corridors."}, {"id": 31, "section": "Ecology and Environment", "question": "Match the following characteristics of the Nilgiri Tahr with their descriptions:\n Column 1 (Feature) Column 2 (Description)\nA. Saddlebacks        1. The agility required to survive on steep rocky cliffs\nB. Droves             2. Light-colored patches on the backs of mature males\n C. Escape Terrain 3. Social groups consisting of females and their young\nSelect the correct answer using the code given below:", "options": {"a": "A-1, B-2, C-3", "b": "A-3, B-2, C-1", "c": "A-2, B-1, C-3", "d": "A-2, B-3, C-1"}, "correct": "d", "explanation": "The Nilgiri Tahr (Nilgiritragus hylocrius) is an endangered ungulate endemic to the Western Ghats.\n• A matches with 2: Adult males are known as \"Saddlebacks\" because they develop a distinct, light-colored\npatch on their backs as they mature. This is a key feature of sexual dimorphism in the species, where\nmales are also larger and darker than females.\n• B matches with 3: The social structure of the Nilgiri Tahr involves living in groups called \"droves.\" These\ngroups typically consist of several adult females and their offspring, often led or accompanied by a\ndominant male.\n• C matches with 1: The Tahr is exceptionally agile. Its preferred habitat includes cliffs and crags (steep,\nrocky areas). They utilize these inaccessible heights as \"escape terrain\" to flee from predators like tigers\nand leopards, which cannot navigate the vertical rock faces as effectively.\nThe species is primarily found in the high-altitude shola-grassland ecosystems. The restoration of habitats like the\nChokramudi hills in Munnar is crucial for their survival, as these hills serve as natural corridors between larger\nprotected areas like Eravikulam National Park."}, {"id": 32, "section": "Ecology and Environment", "question": "Consider the following statements:\n      1. Fungi are considered prokaryotic organisms due to the absence of a nucleus.\n      2. Lichens are made solely of fungal species.\n      3. Some fungi have shown the ability to degrade synthetic plastic materials.\nHow many of the above statements is/are incorrect?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "b", "explanation": "•   Statement 3 is correct, making only one statement accurate. Certain fungal species, including some\nAspergillus and Penicillium strains, have shown the potential to degrade synthetic plastics, such as\npolyurethane. This finding is significant in the context of bioremediation and sustainable waste\nmanagement, as plastic pollution has become a global environmental crisis.\n•   Statement 1 is incorrect because fungi are eukaryotic organisms. They possess a membrane-bound nucleus,\nmitochondria, and other organelles, distinguishing them from prokaryotes like bacteria, which lack these\nfeatures. Eukaryotic nature is a defining trait of the fungal kingdom.\n•   Statement 2 is also incorrect — lichens are symbiotic associations between a fungal partner (usually an\nascomycete) and a photosynthetic partner, which may be either green algae or cyanobacteria. This\nmutualistic relationship allows lichens to colonize harsh environments by combining the fungus’s structural\nsupport with the photosynthetic partner’s energy production."}, {"id": 33, "section": "Ecology and Environment", "question": "Consider the following statements regarding honeybee behaviour and attacks:\n\n\n                                                                               1. Honeybees are naturally aggressive and actively seek out human targets to defend their territory.\n      2. The act of stinging is a fatal event for the honeybee due to its physiological structure.\n      3. Rapid movements or loud noises near a hive can trigger a defensive mobilization of the colony.\nHow many of the above statements are correct?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "b", "explanation": "•   Statement 1 is incorrect. Honeybees are generally not aggressive on their own; they are defensive creatures.\nThey only attack when they perceive a direct threat or external disturbance to their hive. They act like soldiers\nprotecting their colony rather than predators seeking targets.\n•   Statement 2 is correct. For honeybees, stinging is a suicidal act. When a honeybee stings a human, its barbed\nstinger becomes lodged in the skin. As the bee tries to fly away, the stinger is torn from its body, along with\nparts of its digestive tract, muscles, and nerves, leading to the bee's death. This highlights the \"last resort\"\nnature of their defense mechanism.\n•   Statement 3 is correct. Common triggers for aggression include loud noises, bright colors, drones, and strong\nodors (like perfumes or incense). These stimuli are perceived as threats by the colony, especially during\nsummer when hives are at their maximum strength. Once a single bee stings or is swatted, it releases alarm\npheromones—chemical signals that attract and incite more bees to attack the same target. This leads to a\nmass mobilization where bees can pursue a target at speeds of up to 35 km per hour."}, {"id": 34, "section": "Ecology and Environment", "question": "Consider the following table:\n Species                            IUCN Status                            Primary Habitat in India\n 1. Great Indian Bustard            Critically Endangered                  Semi-arid Grasslands\n 2. Western Tragopan                Vulnerable                             Temperate Forests\n 3. Indian Grey Wolf                Least Concern                          Himalayan Tundra\nWhich of the above are correctly matched?", "options": {"a": "1 only", "b": "2 and 3 only", "c": "1 and 2 only", "d": "1, 2 and 3"}, "correct": "c", "explanation": "Explanation:\n• Pair 1 is correctly matched: The Great Indian Bustard is Critically Endangered and is a flagship species of\nthe semi-arid grasslands and scrublands of Rajasthan and Gujarat.\n• Pair 2 is correctly matched: The Western Tragopan is listed as Vulnerable and is found in the temperate\nand subalpine forests of the Western Himalayas, specifically in areas with dense undergrowth.\n• Pair 3 is incorrectly matched: While the Indian Grey Wolf exists, its IUCN status varies by subspecies but\ngenerally, the Indian population is under threat; more importantly, its primary habitat is grasslands,\nscrublands, and agro-ecosystems, not the Himalayan Tundra.\n• The Western Tragopan, for instance, is restricted to elevations between 2,400–3,600 meters, whereas the\nGIB avoids irrigated or heavily forested areas, preferring open landscapes."}, {"id": 35, "section": "Ecology and Environment", "question": "In the context of environmental conservation, the term Indicator Species is often applied to the Western\n    Tragopan. This implies that:", "options": {"a": "The species has a high tolerance for pollution and can survive in degraded habitats.", "b": "The population trends of the species reflect the overall health of its specific ecosystem.", "c": "The species is a primary producer that forms the base of the Himalayan food web.", "d": "The species is an invasive pheasant that indicates the decline of native flora."}, "correct": "b", "explanation": "•   An indicator species is an organism whose presence, absence, or abundance reflects a specific environmental\ncondition or the health of an entire ecosystem. For the Western Tragopan, its reliance on undisturbed, dense\nundergrowth in Himalayan temperate forests makes it a perfect barometer for the state of that habitat. If the\nWestern Tragopan population declines, it often indicates that the forest is suffering from fragmentation,\novergrazing, or loss of biodiversity.\n•   It is a specialist species, meaning it has narrow environmental requirements. Therefore, changes in its\npopulation are early warning signs for ecologists. This is different from a keystone species (which has a\ndisproportionately large effect on its environment) or an umbrella species (whose protection benefits many\nothers).\n•   The Western Tragopan, or Jujurana, is highly sensitive to human disturbance and climate-induced changes in\nthe subalpine zone. By monitoring this bird, conservationists can assess the effectiveness of protected areas\nlike the Great Himalayan National Park."}, {"id": 36, "section": "Ecology and Environment", "question": "Consider the following statements regarding the Great Indian Bustard (GIB) Captive Breeding Programme:\n       1. It is a collaborative effort between the MoEFCC, the Wildlife Institute of India, and the Rajasthan\n            Forest Department.\n       2. The programme utilizes Soft Release strategies to acclimate captive-bred birds to the wild.\n       3. It relies on technical support from the International Fund for Houbara Conservation.\nHow many of the above statements are correct?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "c", "explanation": "•   Statement 1 correctly identifies the tripartite partnership managing the breeding centers at Sam and\nRamdevra in Rajasthan.\n•   Statement 2 highlights a critical phase of the project: the Soft Release strategy. This involves placing captive-\nbred birds in large, protected enclosures within their natural habitat, allowing them to acclimate to local\nweather and food sources before being fully released into the wild.\n•   Statement 3 is correct as the programme receives technical expertise from the International Fund for\nHoubara Conservation (Abu Dhabi), which has extensive experience in bustard breeding. The GIB breeding\nprogramme acts as an ex-situ conservation measure—an insurance policy against the extinction of a species\nwhose wild population has plummeted due to habitat loss and collisions with power lines.\n•   The success of the programme was highlighted by the hatching of new chicks in 2026, marking a milestone in\nthe effort to create a self-sustaining captive population that can eventually bolster the wild numbers in the\nDesert National Park and surrounding areas."}, {"id": 37, "section": "Ecology and Environment", "question": "Consider the following statements regarding the Nagoya Protocol:\n       Statement-I: It is a legally binding framework that requires users of genetic resources to obtain Prior\nInformed Consent (PIC) from the provider country.\n       Statement-II: The protocol primarily aims to prevent the commercialization of traditional knowledge by\nindigenous communities.\nWhich one of the following is correct in respect of the above statements?", "options": {"a": "Both Statement-I and Statement-II are correct and Statement-II is the correct explanation for\nStatement-I", "b": "Both Statement-I and Statement-II are correct and Statement-II is not the correct explanation for\nStatement-I", "c": "Statement-I is correct but Statement-II is incorrect", "d": "Statement-I is incorrect but Statement-II is correct"}, "correct": "c", "explanation": "•   Statement-I is correct. The Nagoya Protocol provides a transparent legal framework for the effective\nimplementation of one of the three objectives of the CBD: the fair and equitable sharing of benefits. It\nmandates that users (researchers or companies) obtain Prior Informed Consent (PIC) before accessing\ngenetic resources and negotiate Mutually Agreed Terms (MAT) for benefit sharing.\n•   Statement-II is incorrect. The protocol does not aim to prevent commercialization. On the contrary, it\nprovides a framework to allow commercial and research use of genetic resources and traditional knowledge,\nprovided that the benefits are shared with the indigenous and local communities who hold that knowledge. It\nprotects traditional knowledge by ensuring that these communities have a say and receive a share of the\nprofits or technology, rather than banning the use of such knowledge."}, {"id": 38, "section": "Ecology and Environment", "question": "With reference to the National Biodiversity Authority (NBA) of India, consider the following statements:\n       1. It was established to implement the provisions of the Biological Diversity Act, 2002.\n       2. It has the authority to issue approvals for access to genetic resources for commercial utilization by\n            both Indian and foreign entities.\n       3. A significant portion of the funds mobilized by the NBA has been distributed to local communities and\n            farmers.\nHow many of the above statements are correct?", "options": {"a": "Only one", "b": "Only two", "c": "All three", "d": "None"}, "correct": "b", "explanation": "•   Statement 1 is correct. The NBA is a statutory body established in 2003 to implement the Biological Diversity\nAct, 2002, which was India's response to the UN Convention on Biological Diversity.\n•   Statement 2 is incorrect. Under the Act, the NBA handles approvals for foreigners, NRIs, and foreign\ncompanies, as well as for IPR (Intellectual Property Rights). However, commercial utilization by Indian citizens\nor Indian-owned companies is primarily regulated by the State Biodiversity Boards (SBBs).\n•   Statement 3 is correct. As per the First National Report (NR1), out of the ₹216.31 crore mobilized, ₹139.69\ncrore was distributed to local communities, farmers, and traditional knowledge holders. This highlights the\nfunctional success of the ABS mechanism in India."}, {"id": 39, "section": "Ecology and Environment", "question": "With reference to the biological phenomenon of Gynandromorphy recently observed in the crab species Vela\n    carli, consider
